<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .t  { font-size: 17px; font-weight: 700; fill: #1a202c; }
      .st { font-size: 15px; font-weight: 700; fill: #1a202c; }
      .s  { font-size: 14px; fill: #4a5568; }
      .ss { font-size: 13px; fill: #4a5568; }
      .h  { font-size: 18px; font-weight: 700; fill: #1a202c; }
      .hs { font-size: 14px; fill: #718096; font-style: italic; }
      .ln { stroke: #4a5568; stroke-width: 1.8; fill: none; marker-end: url(#a); }
      .lb { font-size: 13.5px; fill: #4a5568; font-style: italic; }
      .ck { fill: #fff; stroke: #2d3748; stroke-width: 1.5; }
      .cm { font-size: 13px; font-weight: 700; fill: #2d3748; }
      .nb { font-size: 12px; font-weight: 700; fill: #4a5568; }
    </style>
  </defs>

  <rect width="960" height="600" fill="#fbfaf7"/>

  <!-- ===== Top row: you, orch, board, dobby ===== -->
  <rect x="20" y="40" width="190" height="64" rx="10" fill="#edf2f7" stroke="#a0aec0"/>
  <text x="115" y="68" text-anchor="middle" class="t">You</text>
  <text x="115" y="90" text-anchor="middle" class="s">say what you want</text>

  <rect x="263" y="40" width="190" height="64" rx="10" fill="#e9d8fd" stroke="#805ad5"/>
  <text x="358" y="68" text-anchor="middle" class="t">orch</text>
  <text x="358" y="90" text-anchor="middle" class="s">the session you talk to</text>

  <rect x="506" y="40" width="190" height="64" rx="10" fill="#fefcbf" stroke="#d69e2e"/>
  <text x="601" y="68" text-anchor="middle" class="t">board</text>
  <text x="601" y="90" text-anchor="middle" class="s">tasks, notes, projects</text>

  <rect x="750" y="40" width="190" height="64" rx="10" fill="#fed7d7" stroke="#e53e3e"/>
  <text x="845" y="68" text-anchor="middle" class="t">dobby</text>
  <text x="845" y="90" text-anchor="middle" class="s">a background program</text>

  <path class="ln" d="M210,72 L259,72"/>
  <text x="235" y="63" text-anchor="middle" class="lb">describe</text>
  <path class="ln" d="M453,72 L502,72"/>
  <text x="479" y="63" text-anchor="middle" class="lb">files</text>
  <path class="ln" d="M746,72 L700,72"/>
  <text x="723" y="63" text-anchor="middle" class="lb">watches</text>
  <path class="ln" d="M115,40 C115,20 601,20 601,36"/>
  <text x="358" y="16" text-anchor="middle" class="lb">you release the task</text>
  <path class="ln" d="M845,104 L845,146"/>
  <text x="835" y="130" text-anchor="end" class="lb">1. starts a run per released task</text>

  <!-- ===== The run ===== -->
  <rect x="20" y="150" width="920" height="180" rx="12" fill="#fff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="38" y="176" class="h">A run of the tapestry recipe</text>
  <text x="282" y="176" class="hs">in the task's own worktree, step by step, driven by lym</text>

  <g>
    <rect x="30"  y="192" width="125" height="62" rx="8" fill="#bee3f8" stroke="#3182ce"/>
    <text x="38" y="207" class="nb">2</text>
    <text x="92" y="223" text-anchor="middle" class="st">Discussion</text>
    <text x="92" y="244" text-anchor="middle" class="ss">decision record</text>

    <rect x="185" y="192" width="125" height="62" rx="8" fill="#bee3f8" stroke="#3182ce"/>
    <text x="193" y="207" class="nb">3</text>
    <text x="247" y="223" text-anchor="middle" class="st">Plan</text>
    <text x="247" y="244" text-anchor="middle" class="ss">cards</text>

    <rect x="340" y="192" width="125" height="62" rx="8" fill="#bee3f8" stroke="#3182ce"/>
    <text x="348" y="207" class="nb">4</text>
    <text x="402" y="223" text-anchor="middle" class="st">Implementation</text>
    <text x="402" y="244" text-anchor="middle" class="ss">code and tests</text>

    <rect x="495" y="192" width="125" height="62" rx="8" fill="#bee3f8" stroke="#3182ce"/>
    <text x="503" y="207" class="nb">5</text>
    <text x="557" y="223" text-anchor="middle" class="st">Code review</text>
    <text x="557" y="244" text-anchor="middle" class="ss">the whole diff</text>

    <rect x="650" y="192" width="125" height="62" rx="8" fill="#e2e8f0" stroke="#718096"/>
    <text x="658" y="207" class="nb">6</text>
    <text x="712" y="223" text-anchor="middle" class="st">Landing</text>
    <text x="712" y="244" text-anchor="middle" class="ss">into the parent</text>

    <rect x="805" y="192" width="125" height="62" rx="8" fill="#e2e8f0" stroke="#718096"/>
    <text x="813" y="207" class="nb">7</text>
    <text x="867" y="223" text-anchor="middle" class="st">Cleanup</text>
    <text x="867" y="244" text-anchor="middle" class="ss">issues, teardown</text>
  </g>

  <!-- lym's checks between steps -->
  <g>
    <circle cx="170" cy="223" r="11" class="ck"/><text x="170" y="228" text-anchor="middle" class="cm">✓</text>
    <circle cx="325" cy="223" r="11" class="ck"/><text x="325" y="228" text-anchor="middle" class="cm">✓</text>
    <circle cx="480" cy="223" r="11" class="ck"/><text x="480" y="228" text-anchor="middle" class="cm">✓</text>
    <circle cx="635" cy="223" r="11" class="ck"/><text x="635" y="228" text-anchor="middle" class="cm">✓</text>
    <circle cx="790" cy="223" r="11" class="ck"/><text x="790" y="228" text-anchor="middle" class="cm">✓</text>
  </g>

  <!-- review-round brackets -->
  <g stroke="#2f855a" stroke-width="3" fill="none">
    <path d="M30,266 L155,266 M30,260 L30,266 M155,260 L155,266"/>
    <path d="M185,266 L310,266 M185,260 L185,266 M310,260 L310,266"/>
    <path d="M495,266 L620,266 M495,260 L495,266 M620,260 L620,266"/>
  </g>
  <text x="38" y="292" font-size="14" font-weight="700" fill="#2f855a">green: the step's output passes review rounds before the run moves on</text>
  <text x="38" y="316" class="ss">blue: agents do the work</text>
  <text x="210" y="316" class="ss">grey: lym's git work, short agent steps</text>
  <text x="490" y="316" class="ss">✓: lym checks the output; a failure goes back to the agent</text>

  <!-- ===== Review rounds ===== -->
  <rect x="20" y="350" width="920" height="230" rx="12" fill="#f0fff4" stroke="#68d391" stroke-dasharray="6 4"/>
  <text x="38" y="376" class="h" fill="#22543d">Review rounds</text>
  <text x="182" y="376" class="hs">no session reviews its own work</text>

  <rect x="60" y="400" width="230" height="66" rx="8" fill="#c6f6d5" stroke="#38a169"/>
  <text x="175" y="427" text-anchor="middle" class="t">Reviewer</text>
  <text x="175" y="449" text-anchor="middle" class="s">a fresh session finds defects</text>

  <rect x="365" y="400" width="230" height="66" rx="8" fill="#c6f6d5" stroke="#38a169"/>
  <text x="480" y="427" text-anchor="middle" class="t">Fixer</text>
  <text x="480" y="449" text-anchor="middle" class="s">a fresh session fixes them</text>

  <rect x="670" y="400" width="230" height="66" rx="8" fill="#c6f6d5" stroke="#38a169"/>
  <text x="785" y="427" text-anchor="middle" class="t">Judge</text>
  <text x="785" y="449" text-anchor="middle" class="s">is another round needed?</text>

  <path class="ln" d="M290,433 L361,433"/>
  <path class="ln" d="M595,433 L666,433"/>

  <path class="ln" d="M745,466 C745,522 175,522 175,470"/>
  <text x="460" y="502" text-anchor="middle" class="lb">yes: another round</text>

  <path class="ln" d="M840,400 L840,334"/>
  <text x="830" y="392" text-anchor="end" class="lb">no: on to the next step</text>

  <path class="ln" d="M870,466 L870,540"/>
  <text x="860" y="562" text-anchor="end" class="lb">budget of rounds spent: the run halts and the orch asks you</text>
</svg>
