<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1130" viewBox="0 0 1500 1130" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 700; fill: #1a202c; }
      .s  { font-size: 12.5px; fill: #4a5568; }
      .h  { font-size: 17px; font-weight: 700; fill: #1a202c; }
      .hs { font-size: 12.5px; fill: #718096; font-style: italic; }
      .m  { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #2d3748; }
      .gt { font-size: 13.5px; font-weight: 700; fill: #1a202c; }
      .gw { font-size: 12.5px; font-style: italic; fill: #9c4221; }
      .gd { font-size: 12.5px; fill: #4a5568; }
      .ln { stroke: #4a5568; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .lb { font-size: 11.5px; fill: #4a5568; font-style: italic; }
    </style>
  </defs>

  <rect width="1500" height="1130" fill="#fbfaf7"/>

  <!-- Title -->
  <text x="40" y="44" font-size="26" font-weight="800" fill="#1a202c">LoomYard (lym) — conceptual overview</text>
  <text x="40" y="68" class="hs">A board task is woven into a landed commit: dobby starts its run, batten drives the lifecycle, loom the phases, and a perch inspects each review phase until clean.</text>

  <!-- ===== Row A: operator, orch, board, dobby ===== -->
  <rect x="40" y="92" width="230" height="70" rx="10" fill="#edf2f7" stroke="#a0aec0"/>
  <text x="155" y="121" text-anchor="middle" class="t">Operator</text>
  <text x="155" y="142" text-anchor="middle" class="s">in an ordinary terminal</text>

  <rect x="330" y="92" width="250" height="70" rx="10" fill="#e9d8fd" stroke="#805ad5"/>
  <text x="455" y="121" text-anchor="middle" class="t">orch</text>
  <text x="455" y="142" text-anchor="middle" class="s">the Claude session you talk to</text>
  <text x="455" y="182" text-anchor="middle" class="lb">a watcher cycles its context before the window fills</text>

  <rect x="640" y="92" width="220" height="70" rx="10" fill="#fefcbf" stroke="#d69e2e"/>
  <text x="750" y="121" text-anchor="middle" class="t">board  ·  on Bolt</text>
  <text x="750" y="142" text-anchor="middle" class="s">tasks, notes and projects</text>

  <rect x="920" y="92" width="180" height="70" rx="10" fill="#fed7d7" stroke="#e53e3e"/>
  <text x="1010" y="121" text-anchor="middle" class="t">dobby</text>
  <text x="1010" y="142" text-anchor="middle" class="s">starts released tasks</text>

  <path class="ln" d="M270,127 L326,127"/>
  <text x="298" y="119" text-anchor="middle" class="lb">lym s</text>
  <path class="ln" d="M580,127 L636,127"/>
  <text x="608" y="119" text-anchor="middle" class="lb">files</text>
  <path class="ln" d="M916,127 L864,127"/>
  <text x="890" y="119" text-anchor="middle" class="lb">watches</text>
  <path class="ln" d="M1010,162 L1010,206"/>
  <text x="1000" y="190" text-anchor="end" class="lb">starts one batten run per task</text>

  <!-- ===== Row B: batten ===== -->
  <rect x="40" y="210" width="1060" height="110" rx="12" fill="#fff" stroke="#c05621" stroke-width="1.5"/>
  <text x="58" y="234" class="h">batten</text>
  <text x="128" y="234" class="hs">one task's lifecycle, run as a Shed in its parent</text>

  <g>
    <rect x="58"  y="252" width="186" height="52" rx="8" fill="#feebc8" stroke="#dd6b20"/>
    <text x="151" y="274" text-anchor="middle" class="t">Worktree-Create</text>
    <text x="151" y="293" text-anchor="middle" class="s">code + records worktree</text>

    <rect x="266" y="252" width="186" height="52" rx="8" fill="#feebc8" stroke="#dd6b20"/>
    <text x="359" y="274" text-anchor="middle" class="t">Seed-Child</text>
    <text x="359" y="293" text-anchor="middle" class="s">seed the task's recipe</text>

    <rect x="474" y="252" width="186" height="52" rx="8" fill="#fbd38d" stroke="#c05621" stroke-width="2"/>
    <text x="567" y="274" text-anchor="middle" class="t">Run-Shed</text>
    <text x="567" y="293" text-anchor="middle" class="s">run the child's own run</text>

    <rect x="682" y="252" width="186" height="52" rx="8" fill="#feebc8" stroke="#dd6b20"/>
    <text x="775" y="274" text-anchor="middle" class="t">Land</text>
    <text x="775" y="293" text-anchor="middle" class="s">pull, deploy, prune board</text>

    <rect x="890" y="252" width="192" height="52" rx="8" fill="#feebc8" stroke="#dd6b20"/>
    <text x="986" y="274" text-anchor="middle" class="t">Worktree-Teardown</text>
    <text x="986" y="293" text-anchor="middle" class="s">remove the pair</text>

    <path class="ln" d="M244,278 L262,278"/>
    <path class="ln" d="M452,278 L470,278"/>
    <path class="ln" d="M660,278 L678,278"/>
    <path class="ln" d="M868,278 L886,278"/>
  </g>
  <path class="ln" d="M567,304 L567,356"/>

  <!-- ===== Row C: loom ===== -->
  <rect x="40" y="360" width="1060" height="320" rx="12" fill="#fff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="58" y="384" class="h">loom</text>
  <text x="112" y="384" class="hs">phase machine over a flat producer list; the tapestry recipe shown</text>

  <g>
    <rect x="52"  y="400" width="119" height="58" rx="8" fill="#bee3f8" stroke="#3182ce"/>
    <text x="111" y="423" text-anchor="middle" class="t">Motif</text>
    <text x="111" y="443" text-anchor="middle" class="s">decision record</text>

    <rect x="183" y="400" width="119" height="58" rx="8" fill="#bee3f8" stroke="#3182ce"/>
    <text x="242" y="423" text-anchor="middle" class="t">Plan</text>
    <text x="242" y="443" text-anchor="middle" class="s">flat card list</text>

    <rect x="314" y="400" width="119" height="58" rx="8" fill="#bee3f8" stroke="#3182ce"/>
    <text x="373" y="423" text-anchor="middle" class="t">Webster</text>
    <text x="373" y="443" text-anchor="middle" class="s">implementation</text>

    <rect x="445" y="400" width="119" height="58" rx="8" fill="#bee3f8" stroke="#3182ce"/>
    <text x="504" y="423" text-anchor="middle" class="t">Parent-Align</text>
    <text x="504" y="443" text-anchor="middle" class="s">take in parent</text>

    <rect x="576" y="400" width="119" height="58" rx="8" fill="#bee3f8" stroke="#3182ce"/>
    <text x="635" y="423" text-anchor="middle" class="t">Code review</text>
    <text x="635" y="443" text-anchor="middle" class="s">the whole diff</text>

    <rect x="707" y="400" width="119" height="58" rx="8" fill="#e2e8f0" stroke="#718096"/>
    <text x="766" y="423" text-anchor="middle" class="t">Describe</text>
    <text x="766" y="443" text-anchor="middle" class="s">change text</text>

    <rect x="838" y="400" width="119" height="58" rx="8" fill="#e2e8f0" stroke="#718096"/>
    <text x="897" y="423" text-anchor="middle" class="t">PR-Review</text>
    <text x="897" y="443" text-anchor="middle" class="s">pull request</text>

    <rect x="969" y="400" width="119" height="58" rx="8" fill="#e2e8f0" stroke="#718096"/>
    <text x="1028" y="423" text-anchor="middle" class="t">Finalize</text>
    <text x="1028" y="443" text-anchor="middle" class="s">land on parent</text>

    <path class="ln" d="M171,429 L180,429"/>
    <path class="ln" d="M302,429 L311,429"/>
    <path class="ln" d="M433,429 L442,429"/>
    <path class="ln" d="M564,429 L573,429"/>
    <path class="ln" d="M695,429 L704,429"/>
    <path class="ln" d="M826,429 L835,429"/>
    <path class="ln" d="M957,429 L966,429"/>
  </g>

  <!-- perch brackets under the three review segments -->
  <g stroke="#2f855a" stroke-width="2.5" fill="none">
    <path d="M52,468 L171,468 M52,462 L52,468 M171,462 L171,468"/>
    <path d="M183,468 L302,468 M183,462 L183,468 M302,462 L302,468"/>
    <path d="M576,468 L695,468 M576,462 L576,468 M695,462 L695,468"/>
  </g>
  <text x="373" y="486" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f855a">each green bracket is a review segment with its own perch; Friction-Reflect follows Finalize</text>

  <!-- drift band over the rows it brackets -->
  <rect x="183" y="496" width="512" height="22" rx="11" fill="#fffaf0" stroke="#dd6b20" stroke-dasharray="5 4"/>
  <text x="439" y="511" text-anchor="middle" font-size="12" fill="#9c4221">Drift, when on: a regression baseline before the plan, compared after the code</text>

  <!-- perch inset -->
  <rect x="60" y="528" width="1028" height="100" rx="10" fill="#f0fff4" stroke="#68d391" stroke-dasharray="5 4"/>
  <text x="76" y="550" font-size="14" font-weight="700" fill="#22543d">perch</text>

  <rect x="140" y="540" width="200" height="54" rx="8" fill="#c6f6d5" stroke="#38a169"/>
  <text x="240" y="562" text-anchor="middle" class="t">Bouncer</text>
  <text x="240" y="581" text-anchor="middle" class="s">independent judge: clean yet?</text>

  <rect x="420" y="540" width="200" height="54" rx="8" fill="#c6f6d5" stroke="#38a169"/>
  <text x="520" y="562" text-anchor="middle" class="t">Burler · review</text>
  <text x="520" y="581" text-anchor="middle" class="s">fresh reviewer session</text>

  <rect x="700" y="540" width="200" height="54" rx="8" fill="#c6f6d5" stroke="#38a169"/>
  <text x="800" y="562" text-anchor="middle" class="t">Burler · fix</text>
  <text x="800" y="581" text-anchor="middle" class="s">fresh fixer session</text>

  <path class="ln" d="M340,567 L416,567"/>
  <text x="378" y="560" text-anchor="middle" class="lb">not clean</text>
  <path class="ln" d="M620,567 L696,567"/>
  <path class="ln" d="M800,594 C800,634 240,634 240,598"/>
  <text x="520" y="610" text-anchor="middle" class="lb">another round until it converges</text>

  <path class="ln" d="M240,540 C240,530 960,530 1000,538"/>
  <text x="1010" y="562" class="lb" text-anchor="middle">CONVERGED</text>
  <text x="1010" y="578" class="lb" text-anchor="middle">→ next phase</text>

  <!-- other recipes -->
  <text x="58" y="650" class="hs">darn: one writer makes the decision record and the code  ·  sampler: an agent works the change out with the operator  ·  motif: the decision record alone</text>
  <text x="58" y="668" class="hs">pawl: lands a beam into its parent  ·  a large task's plan can first be split into parts  ·  every recipe opens with Preflight</text>

  <!-- ===== Row D left: execution stack ===== -->
  <rect x="40" y="706" width="520" height="292" rx="12" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
  <text x="58" y="730" class="h">Execution stack</text>
  <text x="58" y="749" class="hs">each layer knows only the one below it</text>

  <g>
    <rect x="58" y="762" width="484" height="32" rx="6" fill="#bee3f8"/>
    <text x="70" y="783" class="t">loom</text><text x="160" y="783" class="s">what to run next</text>
    <rect x="58" y="798" width="484" height="32" rx="6" fill="#c3dafe"/>
    <text x="70" y="819" class="t">shed</text><text x="160" y="819" class="s">generic phase FSM: resume, crash recovery, pause</text>
    <rect x="58" y="834" width="484" height="32" rx="6" fill="#c6f6d5"/>
    <text x="70" y="855" class="t">burler</text><text x="160" y="855" class="s">one review + fix round, no self-grading</text>
    <rect x="58" y="870" width="484" height="32" rx="6" fill="#d9f2e6"/>
    <text x="70" y="891" class="t">seats</text><text x="160" y="891" class="s">one step as a lead + named advisors</text>
    <rect x="58" y="906" width="484" height="32" rx="6" fill="#fed7e2"/>
    <text x="70" y="927" class="t">shuttle</text><text x="160" y="927" class="s">run ONE agent: Claude, Codex coming; Stop hook = done</text>
    <rect x="58" y="942" width="484" height="32" rx="6" fill="#fbd38d"/>
    <text x="70" y="963" class="t">reed</text><text x="160" y="963" class="s">tmux overlay; every process is a strand</text>
  </g>
  <text x="70" y="990" class="m">proc — OS processes beneath it all</text>

  <!-- ===== Row D right: hub and fabric ===== -->
  <rect x="580" y="706" width="520" height="292" rx="12" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
  <text x="598" y="730" class="h">Hub and fabric</text>
  <text x="598" y="749" class="hs">code and its piggyback records repo side by side; fabric keeps them in step</text>

  <text x="700" y="776" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3748">code repo (warp)</text>
  <text x="960" y="776" text-anchor="middle" font-size="13" font-weight="700" fill="#2d3748">records repo (weft)</text>

  <rect x="610" y="786" width="180" height="34" rx="6" fill="#edf2f7" stroke="#a0aec0"/>
  <text x="700" y="808" text-anchor="middle" class="m">&lt;prime&gt;/  · main</text>
  <rect x="870" y="786" width="180" height="34" rx="6" fill="#fefcbf" stroke="#d69e2e"/>
  <text x="960" y="808" text-anchor="middle" class="m">&lt;prime&gt;-&lt;records&gt;/</text>

  <rect x="610" y="830" width="180" height="34" rx="6" fill="#edf2f7" stroke="#a0aec0"/>
  <text x="700" y="852" text-anchor="middle" class="m">&lt;slug&gt;/  · task</text>
  <rect x="870" y="830" width="180" height="34" rx="6" fill="#fefcbf" stroke="#d69e2e"/>
  <text x="960" y="852" text-anchor="middle" class="m">&lt;slug&gt;-&lt;records&gt;/</text>

  <rect x="870" y="874" width="180" height="34" rx="6" fill="#fefcbf" stroke="#d69e2e"/>
  <text x="960" y="896" text-anchor="middle" class="m">_bolt/  = Bolt</text>

  <path d="M790,803 L866,803 M790,847 L866,847" stroke="#4a5568" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="828" y="826" text-anchor="middle" class="lb">_lym</text>

  <text x="598" y="936" class="m">_lym/</text>
  <text x="650" y="936" class="s">durable and synced: config, run status, plans, decision records</text>
  <text x="598" y="958" class="m">.lym/</text>
  <text x="650" y="958" class="s">ephemeral and machine-local: reed.json, scratch</text>
  <text x="598" y="984" class="s">Each task is one worktree; batten creates and tears it down.</text>

  <!-- ===== Bottom: cross-cutting ===== -->
  <rect x="40" y="1018" width="1060" height="84" rx="12" fill="#fff" stroke="#4a5568" stroke-width="1.5"/>
  <text x="58" y="1042" class="h">Cross-cutting</text>
  <g font-size="12.5">
    <rect x="58"  y="1054" width="196" height="36" rx="18" fill="#e9d8fd"/>
    <text x="156" y="1077" text-anchor="middle" fill="#1a202c"><tspan font-weight="700">creel</tspan>  hook-delivered mail</text>
    <rect x="266" y="1054" width="196" height="36" rx="18" fill="#e9d8fd"/>
    <text x="364" y="1077" text-anchor="middle" fill="#1a202c"><tspan font-weight="700">gate</tspan>  test tiers and slots</text>
    <rect x="474" y="1054" width="196" height="36" rx="18" fill="#e9d8fd"/>
    <text x="572" y="1077" text-anchor="middle" fill="#1a202c"><tspan font-weight="700">quarry</tspan>  glyphs for the plan</text>
    <rect x="682" y="1054" width="196" height="36" rx="18" fill="#e9d8fd"/>
    <text x="780" y="1077" text-anchor="middle" fill="#1a202c"><tspan font-weight="700">heddle</tspan>  repo instructions</text>
    <rect x="890" y="1054" width="196" height="36" rx="18" fill="#e9d8fd"/>
    <text x="988" y="1077" text-anchor="middle" fill="#1a202c"><tspan font-weight="700">config</tspan>  layered settings</text>
  </g>

  <!-- ===== Glossary ===== -->
  <rect x="1130" y="92" width="335" height="1010" rx="12" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="1148" y="120" class="h">The weaving vocabulary</text>
  <text x="1148" y="139" class="hs">term — in weaving — in lym</text>

  <g>
    <text x="1148" y="168" class="gt">loom <tspan class="gw">the weaving frame</tspan></text>
    <text x="1148" y="184" class="gd">the phase machine driving one task</text>

    <text x="1148" y="207" class="gt">shed <tspan class="gw">the opening in the warp</tspan></text>
    <text x="1148" y="223" class="gd">generic FSM over a producer list</text>

    <text x="1148" y="246" class="gt">batten <tspan class="gw">beats each pick into place</tspan></text>
    <text x="1148" y="262" class="gd">a task's lifecycle: create → land → tear down</text>

    <text x="1148" y="285" class="gt">shuttle <tspan class="gw">carries the weft across</tspan></text>
    <text x="1148" y="301" class="gd">carries one agent through a run</text>

    <text x="1148" y="324" class="gt">reed <tspan class="gw">keeps the warp threads spaced</tspan></text>
    <text x="1148" y="340" class="gd">the tmux layer holding strands in place</text>

    <text x="1148" y="363" class="gt">strand <tspan class="gw">a thread</tspan></text>
    <text x="1148" y="379" class="gd">one tracked process in reed</text>

    <text x="1148" y="402" class="gt">burler <tspan class="gw">removes flaws from cloth</tspan></text>
    <text x="1148" y="418" class="gd">one review + fix round</text>

    <text x="1148" y="441" class="gt">perch <tspan class="gw">a cloth-inspection frame</tspan></text>
    <text x="1148" y="457" class="gd">a segment's Bouncer ⇄ Burler pair</text>

    <text x="1148" y="480" class="gt">webster <tspan class="gw">a weaver (Old English)</tspan></text>
    <text x="1148" y="496" class="gd">the implementer; forks per batch</text>

    <text x="1148" y="519" class="gt">tapestry <tspan class="gw">a woven picture</tspan></text>
    <text x="1148" y="535" class="gd">the full recipe: discuss, plan, build, review</text>

    <text x="1148" y="558" class="gt">motif <tspan class="gw">a design element</tspan></text>
    <text x="1148" y="574" class="gd">the recipe that makes a decision record</text>

    <text x="1148" y="597" class="gt">darn <tspan class="gw">to mend</tspan></text>
    <text x="1148" y="613" class="gd">a lightweight recipe for small changes</text>

    <text x="1148" y="636" class="gt">sampler <tspan class="gw">a stitch practice piece</tspan></text>
    <text x="1148" y="652" class="gd">a run worked out with the operator</text>

    <text x="1148" y="675" class="gt">pawl <tspan class="gw">the catch that holds the beam</tspan></text>
    <text x="1148" y="691" class="gd">the run that lands a beam</text>

    <text x="1148" y="714" class="gt">fabric <tspan class="gw">cloth</tspan></text>
    <text x="1148" y="730" class="gd">git coordination of code + records</text>

    <text x="1148" y="753" class="gt">warp <tspan class="gw">the lengthwise threads</tspan></text>
    <text x="1148" y="769" class="gd">fabric's code side</text>

    <text x="1148" y="792" class="gt">weft <tspan class="gw">the crosswise thread</tspan></text>
    <text x="1148" y="808" class="gd">fabric's records side</text>

    <text x="1148" y="831" class="gt">Bolt <tspan class="gw">a roll of cloth</tspan></text>
    <text x="1148" y="847" class="gd">the records repo's main; the board's home</text>

    <text x="1148" y="870" class="gt">beam <tspan class="gw">holds the warp and the cloth</tspan></text>
    <text x="1148" y="886" class="gd">a long-lived pair that groups tasks</text>

    <text x="1148" y="909" class="gt">dobby <tspan class="gw">a house-elf, not weaving</tspan></text>
    <text x="1148" y="925" class="gd">starts and drives a beam's runs</text>

    <text x="1148" y="948" class="gt">creel <tspan class="gw">the bobbin rack</tspan></text>
    <text x="1148" y="964" class="gd">the message daemon between agents</text>

    <text x="1148" y="987" class="gt">heddle <tspan class="gw">lifts the warp threads</tspan></text>
    <text x="1148" y="1003" class="gd">renders a repository's agent instructions</text>

    <text x="1148" y="1026" class="gt">tender <tspan class="gw">the loom attendant</tspan></text>
    <text x="1148" y="1042" class="gd">pauses the hub</text>

    <text x="1148" y="1065" class="gt">lym · loom · ly</text>
    <text x="1148" y="1081" class="gd">binary · orchestrator module · skills</text>
  </g>
</svg>
