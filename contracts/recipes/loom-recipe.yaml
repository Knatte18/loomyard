# loom-recipe.yaml is loom's producer graph. It is embedded into the binary by the sibling
# recipes.go rather than read from disk. The thirteen row names below are the durable on-disk
# identities pinned against internal/loomshed's Name* constants by the coverage guard -- a rename
# here without a matching constant rename breaks resume for any in-flight task.
#
# Every gate and validator bounces back to the producer whose artifact it guards, and a gate whose
# guarded artifact is produced by no row in the list escalates instead -- Preflight, Loom-Preflight,
# Batchifier, Publish, and Finalize carry no on_stuck for exactly that reason: nothing in the list
# produces what each of them gates, so there is nothing to bounce to and a human is the only thing
# that can fix any of the five.

version: 1
entry: Preflight
terminals:
  - Finalize

producers:
  - name: Preflight
    engine: Preflight
    on_done: Loom-Preflight

  - name: Loom-Preflight
    engine: LoomPreflight
    on_done: Discussion-Write

  - name: Discussion-Write
    engine: DiscussionWrite
    on_done: Discussion-Validate

  - name: Discussion-Validate
    engine: DiscussionValidate
    on_stuck: Discussion-Write
    on_done: Discussion-Review

  - name: Discussion-Review
    engine: Stub
    on_stuck: Discussion-Write
    on_done: Plan-Write

  - name: Plan-Write
    engine: Stub
    on_done: Plan-Validate

  - name: Plan-Validate
    engine: PlanValidate
    on_stuck: Plan-Write
    on_done: Plan-Review

  - name: Plan-Review
    engine: Stub
    on_stuck: Plan-Write
    on_done: Batchifier

  - name: Batchifier
    engine: Batchifier
    on_done: Webster

  - name: Webster
    engine: Webster
    on_done: Webster-Review

  - name: Webster-Review
    engine: Stub
    on_stuck: Webster
    on_done: Publish

  - name: Publish
    engine: Publish
    on_done: Finalize

  - name: Finalize
    engine: Finalize
    # on_done is explicitly empty: the empty value is load-bearing and is what ends the whole run
    # quietly, per shedengine.ProducerDef.OnDone's own field doc.
    on_done: ""
