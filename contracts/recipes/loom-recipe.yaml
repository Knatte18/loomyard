# loom-recipe.yaml is loom's producer graph. It is embedded into the binary by the sibling
# recipes.go rather than read from disk. The seventeen row names below are the durable on-disk
# identities pinned against internal/loomshed's Name* constants by the coverage guard -- a rename
# here without a matching constant rename breaks resume for any in-flight task.
#
# Every gate and validator bounces back to the producer whose artifact it guards, and a gate whose
# guarded artifact is produced by no row in the list escalates instead -- Preflight, Loom-Preflight,
# Batchifier, Publish, and Finalize carry no on_stuck for exactly that reason: nothing in the list
# produces what each of them gates, so there is nothing to bounce to and a human is the only thing
# that can fix any of the five.
#
# Those five are not the whole escalate-to-a-human set, and the difference matters when auditing
# routing from this header. Three PRODUCER rows also carry no on_stuck -- Discussion-Write,
# Plan-Write, and Webster -- so eight rows in total escalate rather than bounce. They are omitted
# from the sentence above because its subject is gates, not because their Stuck is any softer: it
# halts the whole run identically. Discussion-Write's is a reachable state rather than a theoretical
# one, since shedadapters.SingleLLMProducer maps a shuttleengine.OutcomeAsking onto shedengine.Stuck.
#
# All three review segments follow the same shared-segment mutual-on_stuck shape: Discussion-Bouncer
# and Discussion-Burler carry segment: Discussion-Review, Plan-Bouncer and Plan-Burler carry
# segment: Plan-Review, and Webster-Bouncer and Webster-Burler carry segment: Webster-Review, each
# pair routing to its partner via a mutual on_stuck -- internal/shedengine's validator rejects an
# OnStuck naming a producer in a different Segment, so each pair needs its own non-empty, shared
# label for that pair of edges to build at all.

version: 1
entry: Preflight
terminals:
  - Finalize

producers:
  - name: Preflight
    engine: Preflight
    on_done: Loom-Preflight

  - name: Loom-Preflight
    engine: LoomPreflight
    on_done: Discussion-Write

  - name: Discussion-Write
    engine: DiscussionWrite
    on_done: Discussion-Validate

  - name: Discussion-Validate
    engine: DiscussionValidate
    on_stuck: Discussion-Write
    on_done: Discussion-Bouncer

  - name: Discussion-Bouncer
    engine: Bouncer
    segment: Discussion-Review
    max_bounces: 5
    on_stuck: Discussion-Burler
    on_done: Plan-Write
    config:
      run_subdir: discussion
      artifact_paths:
        - _lyx/discussion/decision-record.md
        - _lyx/discussion/support-log.md
      rubric_stencil: loom-rubric-discussion-review
      # commit_seam is required rather than optional here: Discussion-Burler runs fix-scope: overlay
      # and an overlay round runs no git at all, and nothing else in this segment commits, so without
      # the seam every approved fix would stay uncommitted in the weft working tree.
      commit_seam: discussion
      # No model/effort/version key: the absence is what makes this row take the run-wide
      # Env.Review* values loom.yaml supplies, rather than a recipe-literal, untunable-without-a-
      # rebuild model.

  - name: Discussion-Burler
    engine: BurlerRound
    segment: Discussion-Review
    max_bounces: 5
    on_stuck: Discussion-Bouncer
    # BurlerProducer never returns Done, so this edge is unreachable -- but an empty on_done is
    # load-bearing and ends the whole run silently, which is a worse failure than a redundant edge,
    # so it is set explicitly to the row it can never actually reach.
    on_done: Discussion-Bouncer
    config:
      # The same run_subdir value as Discussion-Bouncer is what makes both rows write into one
      # shared run directory.
      run_subdir: discussion
      profile:
        target:
          paths:
            - _lyx/discussion/decision-record.md
            - _lyx/discussion/support-log.md
        fasit:
          instructions: >
            The authority for this round is the rubric supplied in the prompt. The mechanical
            section contract over the discussion artifact pair is already enforced upstream by
            Discussion-Validate and is not this round's subject.
        rubric_stencil: loom-rubric-discussion-review
        # fix-scope: overlay, not source: the target paths above are weft content reached through the
        # junction, and the Fabric Git Invariant reserves committing that class of file to the loop
        # owner, never an agent. Discussion-Bouncer's commit_seam: discussion key is what actually
        # commits this round's approved settle.
        fix-scope: overlay
        tool-use: true
      # No model/effort/timeout_s key, for the same Env fallback reason as Discussion-Bouncer.

  - name: Plan-Write
    engine: PlanWrite
    on_done: Plan-Validate

  - name: Plan-Validate
    engine: PlanValidate
    on_stuck: Plan-Write
    on_done: Plan-Bouncer
    # No config block, deliberately: this row runs before the review segment, and its absent
    # require_approved key is what puts it in format-only mode -- it must not demand the
    # plan-unapproved flag only Plan-Bouncer's approved settle can produce.

  - name: Plan-Bouncer
    engine: Bouncer
    segment: Plan-Review
    max_bounces: 5
    on_stuck: Plan-Burler
    # Deliberately NOT Batchifier: Plan-Revalidate re-runs the mechanical checks over whatever the
    # fixer rounds left behind, because the judge is rubric-forbidden from re-deriving them and
    # Batchifier never parses the plan at all.
    on_done: Plan-Revalidate
    config:
      run_subdir: plan
      # A plan is 00-overview.md plus a variable number of card files, so no enumeration written
      # here stays correct across plans -- the single directory entry is what stays right. Both
      # consumers accept a directory: shedadapters.NewBouncer stats nothing, and burlerengine's own
      # path check documents that a file and a directory both satisfy it.
      artifact_paths:
        - _lyx/plan
      rubric_stencil: loom-rubric-plan-review
      # commit_seam is required rather than optional here: Plan-Burler runs fix-scope: overlay and
      # an overlay round runs no git at all, and nothing else in this segment commits, so without
      # the seam every approved fix would stay uncommitted in the weft working tree.
      commit_seam: plan
      # No model/effort/version key: the absence is what makes this row take the run-wide
      # Env.Review* values loom.yaml supplies, rather than a recipe-literal, untunable-without-a-
      # rebuild model.

  - name: Plan-Burler
    engine: BurlerRound
    segment: Plan-Review
    max_bounces: 5
    on_stuck: Plan-Bouncer
    # BurlerProducer never returns Done, so this edge is unreachable -- but an empty on_done is
    # load-bearing and ends the whole run silently, which is a worse failure than a redundant edge,
    # so it is set explicitly to the row it can never actually reach.
    on_done: Plan-Bouncer
    config:
      # The same run_subdir value as Plan-Bouncer is what makes both rows write into one shared
      # run directory.
      run_subdir: plan
      profile:
        target:
          paths:
            - _lyx/plan
        fasit:
          paths:
            - _lyx/discussion/decision-record.md
          instructions: >
            The decision record named above is the answer key: the plan's job is to implement the
            decisions and constraints it settles. The format authority is
            contracts/specs/loom-plan-spec.md, and the mechanical checks over that format are
            already enforced upstream by Plan-Validate, so re-deriving them in this round is
            duplicated work.
        rubric_stencil: loom-rubric-plan-review
        # fix-scope: overlay, matching the Discussion-Burler row above. The plan directory is weft
        # content reached through the junction, and the Fabric Git Invariant reserves committing that
        # class of file to the loop owner, never an agent.
        fix-scope: overlay
        # tool-use is required: the round walks the plan directory's card files (the set is
        # variable and only the Card Index names it), resolves symbol-shaped target entries against
        # the repo, and reads the decision record.
        tool-use: true
      # No model/effort/timeout_s key, for the same Env fallback reason as Plan-Bouncer.

  - name: Plan-Revalidate
    # The same PlanValidate engine Plan-Validate's own row uses: the registry maps engine names to
    # constructors, and two rows may share one. This row re-runs planparser's checks AFTER the
    # review segment, over whatever Plan-Burler's overlay rounds rewrote -- the judge is forbidden
    # by its own rubric from re-deriving those checks, Batchifier's Call never parses the plan, and
    # Webster carries no on_stuck at all, so without this row a fixer-introduced format regression
    # lands on the one row in the list a human is the only recovery for. The recipe now distinguishes
    # the two rows sharing this engine by two things: their differing on_done targets, and this row's
    # require_approved: true config key below, which puts it in the approval-enforcing mode
    # Plan-Validate's absent key does not carry.
    engine: PlanValidate
    # on_stuck is Plan-Write, not Plan-Bouncer: this row reports mechanical format findings, and the
    # fixer round is rubric-forbidden from re-deriving those, so the row that can actually repair
    # them is the writer. Plan-Write is the same target Plan-Validate already bounces to, it
    # terminates, and the bounce budget bounds it -- though the cost is no longer free now that a
    # re-entered Plan-Bouncer archives and re-judges rather than replaying a settled verdict: each
    # Stuck -> Plan-Write -> Plan-Validate -> Plan-Bouncer pass now runs a complete review
    # generation, bounded by Plan-Revalidate's own bounce budget and, from the second generation on,
    # by the Burler row's leftover budget.
    on_stuck: Plan-Write
    on_done: Batchifier
    config:
      # This row runs after the review segment settles, so it is the row that confirms the
      # plan-unapproved flag is present -- catching both a fixer-introduced regression that clears
      # it and a failed approval write.
      require_approved: true

  - name: Batchifier
    engine: Batchifier
    on_done: Webster

  - name: Webster
    engine: Webster
    on_done: Webster-Bouncer

  - name: Webster-Bouncer
    engine: Bouncer
    segment: Webster-Review
    max_bounces: 5
    on_stuck: Webster-Burler
    on_done: Publish
    config:
      run_subdir: webster
      # The subject under review is the committed diff, which artifact_paths cannot name at all:
      # the key is required and non-empty, every entry resolves to an absolute path under
      # Env.AnchorPath, and the generic bouncer-template-judge.md renders the list as the
      # artifacts under review with "read each one". Whatever value is chosen is a workaround, so
      # the question is only which one gives the judge the most useful reading -- the single plan
      # directory entry is the card contract the diff is measured against, and Plan-Bouncer
      # already proves a bare directory entry works here (NewBouncer stats nothing). The rubric
      # is where the diff itself is named as the subject, which reaches the judge and the fixer
      # round alike because both rows read it.
      artifact_paths:
        - _lyx/plan
      rubric_stencil: loom-rubric-webster-review
      # No commit_seam key, deliberately unlike both Discussion-Bouncer and Plan-Bouncer:
      # Webster-Burler runs fix-scope: source and commits each fix itself, so there is no artifact
      # left for a loop-owner seam to commit. bouncerEntry documents the resulting nil Commit as a
      # legitimate configuration and never an error. The segment's own round artifacts are
      # uncommitted by construction -- Env.RunRoot lands under the ephemeral .lyx tree, not the
      # durable _lyx one.
      # No model/effort/version key: the absence is what makes this row take the run-wide
      # Env.Review* values loom.yaml supplies, rather than a recipe-literal, untunable-without-a-
      # rebuild model.

  - name: Webster-Burler
    engine: BurlerRound
    segment: Webster-Review
    max_bounces: 5
    on_stuck: Webster-Bouncer
    # BurlerProducer never returns Done, so this edge is unreachable -- but an empty on_done is
    # load-bearing and ends the whole run silently, which is a worse failure than a redundant edge,
    # so it is set explicitly to the row it can never actually reach.
    on_done: Webster-Bouncer
    config:
      # The same run_subdir value as Webster-Bouncer is what makes both rows write into one shared
      # run directory.
      run_subdir: webster
      profile:
        target:
          # No paths key, deliberately: burlerengine's own Profile.validate resolves and stats
          # every Target.Paths entry, and a diff has no such file on disk. validate accepts a
          # FileSet carrying Instructions and no Paths, which is exactly the escape this row
          # needs.
          instructions: >
            The subject under review is the committed diff. The rubric supplied in this prompt is
            the single definition of the review range: read its "Determining the review range"
            section and derive the range exactly as written there. This instruction deliberately
            does not restate the derivation.
        fasit:
          paths:
            - _lyx/plan
          instructions: >
            The plan directory named above is the answer key: the diff's job is to implement the
            cards it carries, and the Card model those cards implement is described in
            manifest/designs/plan-card-format.md. The mechanical checks over the plan's own format
            are already enforced upstream by Plan-Validate and Plan-Revalidate, so re-deriving
            them in this round is duplicated work.
        rubric_stencil: loom-rubric-webster-review
        # fix-scope: source, the only row in the recipe still carrying this value now that
        # Discussion-Burler and Plan-Burler both run overlay. The target is the repo's own source
        # files, which the Fabric Git Invariant names as the one explicitly permitted agent commit
        # (commit-per-fix, never a push) -- the one legitimate reason a Burler row still runs source
        # here. An overlay round runs no git at all and restricts writes to Target.Paths, which this
        # profile deliberately leaves empty -- a fixer that cannot write source cannot fix a diff.
        fix-scope: source
        # tool-use is required: the round reads _lyx/loom/status.json and runs read-only git to
        # obtain the diff, which is its entire subject.
        tool-use: true
        # No cluster-fan key: fork reviewers are read-only and may never run any git command,
        # which burlerengine's fork boilerplate states and its own round audit enforces, so under
        # a fan the forks could not reach a subject that exists only through git. Single reviewer,
        # matching both shipped segments.
      # No model/effort/timeout_s key, for the same Env fallback reason as Webster-Bouncer.

  - name: Publish
    engine: Publish
    on_done: Finalize

  - name: Finalize
    engine: Finalize
    # on_done is explicitly empty: the empty value is load-bearing and is what ends the whole run
    # quietly, per shedengine.ProducerDef.OnDone's own field doc.
    on_done: ""
