# loom-recipe.yaml is loom's producer graph. It is embedded into the binary by the sibling
# recipes.go rather than read from disk. The row names below are the durable on-disk
# identities pinned against internal/loomshed's Name* constants by the coverage guard -- a rename
# here without a matching constant rename breaks resume for any in-flight task.
#
# Every gate and validator bounces back to the producer whose artifact it guards, and a gate whose
# guarded artifact is produced by no row in the list escalates instead -- Preflight, Loom-Preflight,
# Batchifier, Merge-In, Publish, and Finalize carry no on_stuck for exactly that reason: nothing in
# the list produces what each of them gates, so there is nothing to bounce to and a human is the
# only thing that can fix any of the six.
#
# Those six are not the whole escalate-to-a-human set, and the difference matters when auditing
# routing from this header. Four PRODUCER rows also carry no on_stuck -- Discussion-Write,
# Plan-Write, Webster, and Describe -- so ten rows in total escalate rather than bounce: the
# first two writer rows were already members of this set, only their reachability changed, and
# Describe is the newest member, a writer row whose exhausted gate halts the run for a human. They
# are omitted from the sentence above because its subject is gates, not because their Stuck is any
# softer: it halts the whole run identically. Discussion-Write's Stuck is reachable through the
# gate-exhaustion path the row below used to catch. Plan-Write's Stuck
# becomes reachable for the first time: nothing made it fire before, because its own row's on_done
# always reached the row now removed regardless of what its gate found.
#
# A gated writer row's exhausted gate halts the run for a human rather than bouncing to a fresh
# writer, and this replaces the removed rows' cheap respawn deliberately: no on_stuck is added to
# either writer row, because after three in-session re-prompts with the findings already in hand, a
# cold respawn that knows nothing about the complaint is strictly worse than stopping and telling
# someone.
#
# An in-flight run parked past Webster-Bouncer when the Describe row lands is restarted, not
# migrated: Webster-Bouncer's on_done now names Describe rather than Publish, and the operator can
# simply re-run.
#
# Merge-In and Publish still escalate: their failures are merge, verify and push faults nothing in
# the list produces. Merge-In and the Merge-Review perch sit between Describe and Publish, and
# Publish, PR-Gate and Finalize each declare on_reroute: Merge-In: a row that finds the parent
# moved since the last merge-in reroutes there, which spends no bounce budget, and the reroute cap
# bounds a parent that keeps moving. An in-flight run parked on a row whose name or edges changed
# with the Merge-In rows, Describe and Publish included, is restarted, not migrated.
#
# PR-Gate bounces to PR-Rework, the row that produces the diff it guards. PR-Rework joins
# the writer rows whose Stuck halts for a human. A Done by any row of segment PR-Review ends the
# gate's episode, so PR-Rework's Done resets the count after every rework; max_bounces bounds
# consecutive gate Stucks with no rework Done between them, which this recipe never produces, since
# every gate Stuck routes to PR-Rework. A rework round starts a new plan
# generation that walks the whole main line again, Plan-Review included; Plan-Bouncer skips its
# judge only for a generation whose live cards are all exempt.
#
# Friction-Reflect and PR-Align are outside the escalate-to-a-human set: each also carries no
# on_stuck, but each always returns Done and never Stuck, so they stay outside that set.
#
# An in-flight run parked on one of the three removed rows when this recipe lands is restarted, not
# migrated: row names are durable on-disk resume identities, and a permanent migration table mapping
# three retired names onto their successors is carrying cost a pre-release, single-operator system
# does not need when the operator can simply re-run.
#
# Every review segment follows the same shared-segment on_stuck ring: Discussion-Bouncer,
# Discussion-Burler-Review and Discussion-Burler-Fix carry segment: Discussion-Review, the three
# Plan rows carry segment: Plan-Review, the three Webster rows carry segment: Webster-Review, and
# the three Merge rows carry segment: Merge-Review.
# In each ring the Bouncer's on_stuck names the review row, the review row's on_stuck names the fix
# row, and the fix row's on_stuck names the Bouncer, and each Burler row's on_done names the same
# row as its on_stuck -- neither Burler row ever returns Done, and an empty on_done would end the
# run silently. A Done by any row of a segment ends its bounce episode, so the hand-offs between
# the two halves are Stucks. internal/shedengine's validator rejects an OnStuck naming a producer
# in a different Segment, so each ring needs its own non-empty, shared label for its edges to build
# at all.
#
# A review segment's round is two Shed rows, each one fresh session: the review row reviews, and
# the fix row fixes only a review with findings, or a clean review whose row gates fail. The
# reviewer's findings carry their own fix, so the fixer orients on the review and its targets alone.
#
# An in-flight run parked on one of the retired Discussion-Burler, Plan-Burler or Webster-Burler
# rows is restarted, not migrated, as it is for the earlier retired rows above.
#
# The Bouncer, review and fix rows of those segments declare no max_bounces: their budget is the
# perch's own loom.yaml key (discussion_max_bounces, plan_max_bounces, webster_max_bounces or merge_max_bounces),
# falling back to review_max_bounces where that is 0, applied by internal/loomrecipe. PR-Gate keeps
# its literal max_bounces.

version: 1
entry: Preflight
terminals:
  - Friction-Reflect

producers:
  - name: Preflight
    engine: Preflight
    on_done: Loom-Preflight

  - name: Loom-Preflight
    engine: LoomPreflight
    on_done: Discussion-Write

  - name: Discussion-Write
    engine: DiscussionWrite
    on_done: Discussion-Bouncer
    config:
      # gates holds this row's handoff until the artifact is mechanically valid: each entry names a
      # validator and re-prompts the live session up to its attempts times, so a failure never
      # reaches the row below.
      gates:
        - name: discussion
          attempts: 3
        # parent-review hands the finished discussion to the run's parent once the mechanical gate
        # passes, as one scope check against the board entry; the perch below reviews the detail.
        # every rewrite after a reject is reviewed as the next round. attempts is the reject cap and
        # 0 turns the review off; the cap's reject halts the run blocked until
        # `lyx loom review approve`.
        - name: parent-review
          attempts: 2

  - name: Discussion-Bouncer
    engine: Bouncer
    segment: Discussion-Review
    on_stuck: Discussion-Burler-Review
    on_done: Plan-Write
    config:
      run_subdir: discussion
      artifact_paths:
        - _lyx/discussion/decision-record.md
        - _lyx/discussion/support-log.md
      rubric_stencil: loom-rubric-discussion-review
      # commit_seam is required rather than optional here: Discussion-Burler-Fix runs fix-scope: overlay
      # and an overlay round runs no git at all, and nothing else in this segment commits, so without
      # the seam every approved fix would stay uncommitted in fabric's records working tree.
      commit_seam: discussion
      # carry_over names this row's own segment: the Bouncer files the round's still-open findings
      # under it in the decision record's Open risks section, and a test pins it equal to segment.
      carry_over: Discussion-Review
      # No model/effort/version key: the row refuses them as unknown keys, and loom.yaml's judge,
      # seed and per-segment judge and seed keys are the only source of this row's passes' models.

  - name: Discussion-Burler-Review
    engine: BurlerReview
    segment: Discussion-Review
    on_stuck: Discussion-Burler-Fix
    # BurlerReviewProducer never returns Done, so this edge is unreachable -- but an empty on_done
    # is load-bearing and ends the whole run silently, which is a worse failure than a redundant
    # edge, so it is set explicitly to the row it can never actually reach.
    on_done: Discussion-Burler-Fix
    config:
      # The same run_subdir value as Discussion-Bouncer is what makes the three rows write into one
      # shared run directory.
      run_subdir: discussion
      profile:
        target:
          paths:
            - _lyx/discussion/decision-record.md
            - _lyx/discussion/support-log.md
        fasit:
          instructions: >
            The authority for this round is the rubric supplied in the prompt. The mechanical
            section contract over the discussion artifact pair is already enforced by this round's
            own gate over this round's own output, so re-deriving it here is duplicated work.
        rubric_stencil: loom-rubric-discussion-review
        # fix-scope: overlay, not source: the target paths above are fabric records content reached through the
        # junction, and the Fabric Git Invariant reserves committing that class of file to the loop
        # owner, never an agent. Discussion-Bouncer's commit_seam: discussion key is what actually
        # commits this round's approved settle.
        fix-scope: overlay
        tool-use: true
      # No model/effort key: model choice lives in loom.yaml's review and fix keys only.
      # No timeout_s key, for the same Env fallback reason as Discussion-Bouncer.

  - name: Discussion-Burler-Fix
    engine: BurlerFix
    segment: Discussion-Review
    on_stuck: Discussion-Bouncer
    # BurlerFixProducer never returns Done, so this edge is unreachable -- but an empty on_done is
    # load-bearing and ends the whole run silently, which is a worse failure than a redundant edge,
    # so it is set explicitly to the row it can never actually reach.
    on_done: Discussion-Bouncer
    config:
      run_subdir: discussion
      # review_row names this segment's review row, which a refusal's way forward sends the
      # operator back to.
      review_row: Discussion-Burler-Review
      # gates holds this row's handoff until the artifact is mechanically valid: each entry names a
      # validator and re-prompts the live session up to its attempts times, so a failure never
      # reaches the row below.
      gates:
        - name: discussion
          attempts: 3
      profile:
        target:
          paths:
            - _lyx/discussion/decision-record.md
            - _lyx/discussion/support-log.md
        # fix-scope: overlay, for the reason the review row gives.
        fix-scope: overlay

  - name: Plan-Write
    engine: PlanWrite
    on_done: Plan-Bouncer
    config:
      # gates holds this row's handoff until the artifact is mechanically valid: each entry names a
      # validator and re-prompts the live session up to its attempts times, so a failure never
      # reaches the row below.
      gates:
        - name: plan
          attempts: 3

  - name: Plan-Bouncer
    engine: Bouncer
    segment: Plan-Review
    on_stuck: Plan-Burler-Review
    on_done: Batchifier
    config:
      run_subdir: plan
      # A plan is 00-overview.md plus a variable number of card files, so no enumeration written
      # here stays correct across plans -- the single directory entry is what stays right. Both
      # consumers accept a directory: shedadapters.NewBouncer stats nothing, and burlerengine's own
      # path check documents that a file and a directory both satisfy it.
      artifact_paths:
        - _lyx/plan
      rubric_stencil: loom-rubric-plan-review
      # commit_seam is required rather than optional here: Plan-Burler-Fix runs fix-scope: overlay and
      # an overlay round runs no git at all, and nothing else in this segment commits, so without
      # the seam every approved fix would stay uncommitted in fabric's records working tree.
      commit_seam: plan
      # approve_seam: plan is set on this row and no other -- it is the only row in the whole list
      # that knows the plan passed review. The approved settle writes the approval flag through
      # this seam immediately before commit_seam fires, so the flag lands inside the commit rather
      # than as working-tree dirt afterwards. Neither Discussion-Bouncer nor Webster-Bouncer gets
      # this key: neither of their artifacts carries an approval flag, and an absent key leaves the
      # seam nil exactly as an omitted commit_seam already does.
      approve_seam: plan
      # skip_seam: rework-exempt lets a rework generation whose cards are all exempt pass without a
      # judge. Its inputs are agent-written -- the overview's first_card and a swept record.json --
      # so the seam re-classifies the live committed cards: a stale or forged record can at most
      # skip a generation whose live cards are themselves exempt. It also re-classifies the
      # working-tree cards, since a Plan-Burler-Fix fix lands only through the commit a skip runs.
      # Generation 0 never skips, and a seam error falls back to a real review.
      skip_seam: rework-exempt
      # carry_over names this row's own segment: the Bouncer files the round's still-open findings
      # under it in the decision record's Open risks section, and a test pins it equal to segment.
      carry_over: Plan-Review
      # No model/effort/version key: the row refuses them as unknown keys, and loom.yaml's judge,
      # seed and per-segment judge and seed keys are the only source of this row's passes' models.

  - name: Plan-Burler-Review
    engine: BurlerReview
    segment: Plan-Review
    on_stuck: Plan-Burler-Fix
    # BurlerReviewProducer never returns Done, so this edge is unreachable -- but an empty on_done
    # is load-bearing and ends the whole run silently, which is a worse failure than a redundant
    # edge, so it is set explicitly to the row it can never actually reach.
    on_done: Plan-Burler-Fix
    config:
      # The same run_subdir value as Plan-Bouncer is what makes the three rows write into one
      # shared run directory.
      run_subdir: plan
      profile:
        target:
          paths:
            - _lyx/plan
        fasit:
          paths:
            - _lyx/discussion/decision-record.md
          instructions: >
            The decision record named above is the answer key: the plan's job is to implement the
            decisions and constraints it settles. In a rework generation the live generation's
            findings.md joins it: every finding is covered by some card, and every card's scope is
            licensed by the decision record or a finding. The live generation's round is, among
            _lyx/loom/rework/round-<N>/ directories, the highest N whose record.json carries a
            class and whose first_card equals the first_card in _lyx/plan/00-overview.md's
            frontmatter (absent means 1). With no such round (generation 0, or a fresh Plan-Write
            plan after an operator goto Plan-Write), the decision record alone is the answer key.
            The round's prior-generation/ archive is context, never the subject of a finding. The
            format authority is
            contracts/specs/loom-plan-spec.md, and the mechanical checks over that format are
            already enforced by this round's own gate over this round's own output, so re-deriving
            them here is duplicated work. This round may never write the approved: key in the
            plan's overview file: a fixer that set the flag would be approving the very artifact
            the review round is judging, and this row already has write access to the overview
            because it runs fix-scope: overlay with the plan directory in its target paths.
        rubric_stencil: loom-rubric-plan-review
        # fix-scope: overlay, matching the Discussion-Burler-Review row above. The plan directory is fabric
        # records content reached through the junction, and the Fabric Git Invariant reserves committing that
        # class of file to the loop owner, never an agent.
        fix-scope: overlay
        # tool-use is required: the round walks the plan directory's card files (the set is
        # variable and only the Card Index names it), resolves symbol-shaped target entries against
        # the repo, and reads the decision record.
        tool-use: true
      # No model/effort key: model choice lives in loom.yaml's review and fix keys only.
      # No timeout_s key, for the same Env fallback reason as Plan-Bouncer.

  - name: Plan-Burler-Fix
    engine: BurlerFix
    segment: Plan-Review
    on_stuck: Plan-Bouncer
    # BurlerFixProducer never returns Done, so this edge is unreachable -- but an empty on_done is
    # load-bearing and ends the whole run silently, which is a worse failure than a redundant edge,
    # so it is set explicitly to the row it can never actually reach.
    on_done: Plan-Bouncer
    config:
      run_subdir: plan
      review_row: Plan-Burler-Review
      # gates holds this row's handoff until the artifact is mechanically valid: each entry names a
      # validator and re-prompts the live session up to its attempts times, so a failure never
      # reaches the row below.
      gates:
        - name: plan
          attempts: 3
      profile:
        target:
          paths:
            - _lyx/plan
        # fix-scope: overlay, for the reason the review row gives.
        fix-scope: overlay

  - name: Batchifier
    engine: Batchifier
    on_done: Webster

  - name: Webster
    engine: Webster
    on_done: Webster-Bouncer

  - name: Webster-Bouncer
    engine: Bouncer
    segment: Webster-Review
    on_stuck: Webster-Burler-Review
    on_done: Describe
    config:
      run_subdir: webster
      # The subject under review is the committed diff, which artifact_paths cannot name at all:
      # the key is required and non-empty, every entry resolves to an absolute path under
      # Env.AnchorPath, and the generic bouncer-template-judge.md renders the list as the
      # artifacts under review with "read each one". Whatever value is chosen is a workaround, so
      # the question is only which one gives the judge the most useful reading -- the single plan
      # directory entry is the card contract the diff is measured against, and Plan-Bouncer
      # already proves a bare directory entry works here (NewBouncer stats nothing). The rubric
      # is where the diff itself is named as the subject, which reaches the judge and the fixer
      # round alike because both rows read it.
      artifact_paths:
        - _lyx/plan
      rubric_stencil: loom-rubric-webster-review
      # No commit_seam key, deliberately unlike both Discussion-Bouncer and Plan-Bouncer:
      # Webster-Burler-Fix runs fix-scope: source and commits each fix itself, so there is no artifact
      # left for a loop-owner seam to commit. bouncerEntry documents the resulting nil Commit as a
      # legitimate configuration and never an error. The segment's own round artifacts are
      # uncommitted by construction -- Env.RunRoot lands under the ephemeral .lyx tree, not the
      # durable _lyx one.
      # carry_over names this row's own segment: the Bouncer files the round's still-open findings
      # under it in the decision record's Open risks section, and a test pins it equal to segment.
      carry_over: Webster-Review
      # No model/effort/version key: the row refuses them as unknown keys, and loom.yaml's judge,
      # seed and per-segment judge and seed keys are the only source of this row's passes' models.

  - name: Webster-Burler-Review
    engine: BurlerReview
    segment: Webster-Review
    on_stuck: Webster-Burler-Fix
    # BurlerReviewProducer never returns Done, so this edge is unreachable -- but an empty on_done
    # is load-bearing and ends the whole run silently, which is a worse failure than a redundant
    # edge, so it is set explicitly to the row it can never actually reach.
    on_done: Webster-Burler-Fix
    config:
      # The same run_subdir value as Webster-Bouncer is what makes the three rows write into one
      # shared run directory.
      run_subdir: webster
      profile:
        target:
          # No paths key, deliberately: burlerengine's own Profile.validate resolves and stats
          # every Target.Paths entry, and a diff has no such file on disk. validate accepts a
          # FileSet carrying Instructions and no Paths, which is exactly the escape this row
          # needs.
          instructions: >
            The subject under review is the committed diff. The rubric supplied in this prompt is
            the single definition of the review range: read its "Determining the review range"
            section and derive the range exactly as written there. This instruction deliberately
            does not restate the derivation.
        fasit:
          paths:
            - _lyx/plan
          instructions: >
            The plan directory named above is the answer key: the diff's job is to implement the
            cards it carries, and the Card model those cards implement is described in
            contracts/specs/loom-plan-spec.md. The mechanical checks over the plan's own format
            are already enforced by Plan-Write's and Plan-Burler-Fix's own gates over each round's own
            output, so re-deriving them in this round is duplicated work.
        rubric_stencil: loom-rubric-webster-review
        # fix-scope: source, the only row in the recipe still carrying this value now that
        # Discussion-Burler-Fix and Plan-Burler-Fix both run overlay. The target is the repo's own source
        # files, which the Fabric Git Invariant names as the one explicitly permitted agent commit
        # (commit-per-fix, never a push) -- the one legitimate reason a Burler row still runs source
        # here. An overlay round runs no git at all and restricts writes to Target.Paths, which this
        # profile deliberately leaves empty -- a fixer that cannot write source cannot fix a diff.
        fix-scope: source
        # tool-use is required: the round reads _lyx/shed/<slug>/status.json and runs read-only git to
        # obtain the diff, which is its entire subject.
        tool-use: true
        # No cluster-fan key: Webster-Review stays solo, because fork reviewers are read-only and
        # may never run any git command, which burlerengine's fork boilerplate states and its own
        # round audit enforces, so under a fan the forks could not reach a subject that exists
        # only through git. Discussion-Review and Plan-Review take their fan from loom.yaml.
      # No model/effort key: model choice lives in loom.yaml's review and fix keys only.
      # No timeout_s key, for the same Env fallback reason as Webster-Bouncer.

  - name: Webster-Burler-Fix
    engine: BurlerFix
    segment: Webster-Review
    on_stuck: Webster-Bouncer
    # BurlerFixProducer never returns Done, so this edge is unreachable -- but an empty on_done is
    # load-bearing and ends the whole run silently, which is a worse failure than a redundant edge,
    # so it is set explicitly to the row it can never actually reach.
    on_done: Webster-Bouncer
    config:
      run_subdir: webster
      review_row: Webster-Burler-Review
      # The verify gate runs on the committed tree after each round and re-prompts the round
      # session with the findings until it passes. It first runs the headroom lint from the merge
      # base with the parent branch, then lints the comments the round added, then runs the impacted-set command derived from the diff since the plan verify's last
      # pass, or the plan's verify command wherever that diff cannot be narrowed. A tree the
      # record already names passes without running, so a round that changed no code costs
      # nothing.
      gates:
        - name: verify
          attempts: 3
      profile:
        # No target key, deliberately: the subject is the committed diff, which names no file, so
        # the fixer finds its files from the review's findings and the gate's findings alone.
        # fix-scope: source, for the reason the review row gives.
        fix-scope: source

  - name: Describe
    engine: Describe
    on_done: Merge-In
    config:
      # gates holds this row's handoff until the artifact is mechanically valid: each entry names a
      # validator and re-prompts the live session up to its attempts times, so a failure never
      # reaches the row below.
      gates:
        - name: description
          attempts: 3

  # Merge-In takes the parent lock, brings the local parent level with its upstream, merges it into
  # the task worktree, verifies the merged tree and writes the merge record. It keeps the lock on
  # every way out: Publish, PR-Gate or Finalize frees it, or the loop's exit does.
  - name: Merge-In
    engine: MergeIn
    on_done: Merge-Bouncer

  # The Merge-Review perch reviews how the task's code interacts with what the parent gained in the
  # merge-in. loom.yaml's skip_merge_review routes Merge-In's Done past it to Publish, and the
  # Bouncer's skip_seam skips the judge for a merge that gained nothing the task touches. A BLOCKING
  # finding escalates past an exhausted budget even where loom.yaml auto-accepts the round.
  - name: Merge-Bouncer
    engine: Bouncer
    segment: Merge-Review
    on_stuck: Merge-Burler-Review
    on_done: Publish
    config:
      run_subdir: merge
      # The subject under review is the merge-in, which artifact_paths cannot name: the key is
      # required and non-empty, so it takes the decision record the review measures the merge
      # against. The rubric names the merge as the subject for the judge and the fixer alike.
      artifact_paths:
        - _lyx/discussion/decision-record.md
      rubric_stencil: loom-rubric-merge-review
      # approve_seam: merge records the parent tip a finished review reached, as the reviewed tip the next merge record reads.
      approve_seam: merge
      # skip_seam: merge-overlap skips the judge when the merge record shows the parent gained
      # nothing the task touches; a missing record or a seam error falls back to a real review.
      skip_seam: merge-overlap
      # A BLOCKING finding sends a spent budget to the soft-cap rule even where loom.yaml auto-accepts the round.
      blocking_escalates: true
      # No commit_seam key, for the reason Webster-Bouncer gives: Merge-Burler-Fix runs fix-scope:
      # source and commits each fix itself.
      carry_over: Merge-Review
      color_segment: merge
      # No model/effort/version key: the row refuses them as unknown keys, and loom.yaml's judge,
      # seed and per-segment judge and seed keys are the only source of this row's passes' models.

  - name: Merge-Burler-Review
    engine: BurlerReview
    segment: Merge-Review
    on_stuck: Merge-Burler-Fix
    # BurlerReviewProducer never returns Done, so this edge is unreachable -- but an empty on_done
    # is load-bearing and ends the whole run silently, which is a worse failure than a redundant
    # edge, so it is set explicitly to the row it can never actually reach.
    on_done: Merge-Burler-Fix
    config:
      # The same run_subdir value as Merge-Bouncer is what makes the three rows write into one
      # shared run directory.
      run_subdir: merge
      color_segment: merge
      profile:
        target:
          # No paths key, for the reason Webster-Burler-Review gives: the subject is a merge, not a file.
          instructions: >
            The subject under review is the interaction between the parent commits merged in and
            the task's own change, as the merge section of the rubric supplied in this prompt
            defines them. This instruction deliberately does not restate how to find them.
        fasit:
          paths:
            - _lyx/discussion/decision-record.md
          instructions: >
            The decision record named above is the answer key for what the task's change must do.
            Read PATTERN.md and the pattern/ files the rubric's merge section names: they are the
            invariants the parent's commits may have added or changed.
        rubric_stencil: loom-rubric-merge-review
        # fix-scope: source, for the reason Webster-Burler-Review gives.
        fix-scope: source
        tool-use: true
        # No cluster-fan key: the subject exists only through read-only git, which a fan's forks may not run.
      # No model/effort key: model choice lives in loom.yaml's review and fix keys only.
      # No timeout_s key, for the same Env fallback reason as Merge-Bouncer.

  - name: Merge-Burler-Fix
    engine: BurlerFix
    segment: Merge-Review
    on_stuck: Merge-Bouncer
    # BurlerFixProducer never returns Done, so this edge is unreachable -- but an empty on_done is
    # load-bearing and ends the whole run silently, which is a worse failure than a redundant edge,
    # so it is set explicitly to the row it can never actually reach.
    on_done: Merge-Bouncer
    config:
      run_subdir: merge
      review_row: Merge-Burler-Review
      color_segment: merge
      # The verify gate runs as Webster-Burler-Fix's does.
      gates:
        - name: verify
          attempts: 3
      profile:
        # No target key, for the reason Webster-Burler-Fix gives.
        # fix-scope: source, for the reason the review row gives.
        fix-scope: source

  # Publish pushes the task branch and opens or refreshes the pull request, after the push-time
  # publish_verify. A moved parent reroutes it to Merge-In.
  - name: Publish
    engine: Publish
    on_reroute: Merge-In
    on_done: PR-Align

  # PR-Align spawns the alignment agent for the pull request Publish opened and applies its verdict
  # through the records PR-Gate reads. It returns Done without spawning when PR-Gate would pass
  # without a pull request or alignment is off, takes no parent lock, and is re-entered with the new
  # head after every PR-Rework and moved-parent reroute. It never returns Stuck, so it carries no
  # on_stuck, and it sits outside the PR-Review segment: a Done by a row of that segment ends the
  # gate's bounce episode, which only PR-Rework's Done does.
  - name: PR-Align
    engine: PRAlign
    on_done: PR-Gate

  # PR-Gate owns every review decision on the pull request Publish opened: it returns Done on an
  # approval or a merge, Awaiting while the operator has not decided, and Stuck only for a matching
  # rejection, which bounces to the rework row that produces the diff it guards.
  - name: PR-Gate
    engine: PRGate
    segment: PR-Review
    max_bounces: 5
    on_stuck: PR-Rework
    on_reroute: Merge-In
    on_done: Finalize

  # PR-Rework archives the live plan generation and has its session write a whole new one for the
  # operator's findings, then hands to Plan-Bouncer, so the generation walks Plan-Review, Webster,
  # Webster-Review, Describe, Publish and the gate. Its Stuck halts the run for a human.
  - name: PR-Rework
    engine: PRRework
    segment: PR-Review
    on_done: Plan-Bouncer
    config:
      # gates holds this row's handoff until the artifact is mechanically valid: each entry names a
      # validator and re-prompts the live session up to its attempts times, so a failure never
      # reaches the row below.
      # rework-plan validates the whole new generation, plus `first_card` equal to the number the
      # row told the session.
      gates:
        - name: rework-plan
          attempts: 3

  - name: Finalize
    engine: Finalize
    on_reroute: Merge-In
    # Hands off to the reflection row rather than ending the run.
    on_done: Friction-Reflect

  # Friction-Reflect runs the Tier 2 friction reflection under the run lock and is the recipe's
  # sole terminal, so the engine persists state: done only after the reflection returns (batten's
  # Run-Shed row reads that done as "finished" and tears the worktree down, deleting the friction
  # notes). It always returns Done, and reflects under step as under run.
  - name: Friction-Reflect
    engine: FrictionReflect
    # on_done is explicitly empty: the empty value is load-bearing and is what ends the whole run
    # quietly, per shedengine.ProducerDef.OnDone's own field doc.
    on_done: ""
