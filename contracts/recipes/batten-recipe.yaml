# batten-recipe.yaml is the task-worktree batten's producer graph. It is embedded into the
# binary by the sibling recipes.go rather than read from disk. The row names below are
# durable on-disk identities that resume depends on, pinned against internal/battenrecipe's own
# Name* constants by that package's coverage guard -- a rename here without a matching constant
# rename breaks resume for any in-flight run.
#
# Run-Shed's producer checks its child once per call and yields when the check ends nothing, with
# its memory between calls in a per-run record: a call is one pass that the scheduling dobby runs
# again. It returns a verdict only when something is worth a history entry: the child's state
# changed, an awaiting child's decision arrived, batten was paused, or the child's status file
# could not be stat'ed. Anything costing a process or a multiplexer round trip runs at most once per
# config.notice_probe_s. Every Stuck it returns is budget-exempt and routes back through the
# on_stuck: Run-Shed self-route to re-enter the producer for the next pass, so the row carries no
# max_bounces and no running watch window: a running child is checked without a time limit, bounded
# only by "lyx batten pause", the notices, and the driver-exit grace for a done child
# (config.driver_exit_grace_s). It never routes to
# Worktree-Teardown: the destructive teardown row is unreachable from any failure path because
# Run-Shed's own hard-error return -- not an empty on_stuck -- is what shedengine turns into
# StateFailed at Run-Shed with the run halted; a halted child is no longer such a return, only a
# mechanism failure is.
#
# Open-Window, Seed-IDE and Open-IDE are Command rows: each runs its batten.yaml command, and is Done
# whether the command succeeds or not, a failed command only warning. A row whose setting is off is
# skipped by its entry gate. They follow Seed-Child because that row writes the task's run_settings
# into the pair's local config layer, which their entry gates are read from.
#
# Land runs after Run-Shed's Done: under the hub's land lock it pulls the prime, runs the hub-wide
# deploy command and prunes the board; a records stop of the pull is the one notice of a successful
# landing. It carries no on_stuck and no max_bounces: a failed Land step, or a pause honoured during its waits, halts
# batten blocked at Land with the pair present, so Worktree-Teardown stays the only terminal and
# unreachable from any failure path.
#
# Worktree-Teardown's empty on_done is likewise load-bearing and is what ends the run quietly.

version: 1
entry: Worktree-Create
terminals:
  - Worktree-Teardown

producers:
  - name: Worktree-Create
    engine: WorktreeCreate
    on_done: Seed-Child

  - name: Seed-Child
    engine: SeedChild
    on_done: Open-Window

  - name: Open-Window
    engine: Command
    on_done: Seed-IDE
    entry_gate: batten.open_window
    config:
      command: batten.open_window_command

  - name: Seed-IDE
    engine: Command
    on_done: Open-IDE
    entry_gate: batten.seed_ide
    config:
      command: batten.seed_ide_command

  - name: Open-IDE
    engine: Command
    on_done: Run-Shed
    entry_gate: batten.open_ide
    config:
      command: batten.open_ide_command

  - name: Run-Shed
    engine: InnerRun
    on_done: Land
    on_stuck: Run-Shed
    config:
      poll_interval_s: 2
      notice_probe_s: 30
      driver_exit_grace_s: 900
      notice_quiet_min: 30

  - name: Land
    engine: Land
    on_done: Worktree-Teardown

  - name: Worktree-Teardown
    engine: WorktreeTeardown
    on_done: ""
