# darn-recipe.yaml is the darn task recipe: one gated writer reads the board entry, edits, tests and
# commits, the Code-Review perch reviews the committed diff, Describe rewrites the change
# description from the final diff, then PR-Review and Finalize land it. It is
# embedded into the binary by the sibling recipes.go rather than read from disk. The row names below are the
# durable on-disk identities pinned against internal/loomshed's Name* constants -- a rename here
# without a matching constant rename breaks resume for any in-flight task, unless internal/loomrecipe
# maps the retired name onto its successor, as it maps the writer row's former name, Darn.
#
# The writer writes and validates the decision record before any code, and the perch's open findings
# land in the record's `## Open risks`.
# Darn has no Merge-In row: Finalize merges the parent itself, under the parent lock it takes first.
#
# Preflight and Finalize carry no on_stuck: nothing in the list produces what each of them
# gates, so a human is the only thing that can fix them.
# Finalize fixes its own merge and test failures in its merge fixer, and a failure the fixer cannot
# fix halts the run for the orch.
# Darn-Write and Describe carry none either:
# an exhausted writer gate halts the run for the parent, which resumes it with a fresh budget.
# PR-Review, like Friction-Reflect, carries none either, because it never returns Stuck.
#
# Code-Bouncer, Code-Burler-Review and Code-Burler-Fix are the Code-Review perch, the same perch
# loom's recipe runs, with the same row names, segment, run_subdir, role_prefix, rubric and loom.yaml
# code_* keys; only its answer key differs. Its ring is the shared-segment one: the Bouncer's on_stuck
# names the review row, the review row's on_stuck names the fix row, the fix row's on_stuck names the
# Bouncer, and each Burler row's on_done names the same row as its on_stuck, since neither ever
# returns Done. The segment's rows declare no max_bounces: their budget is loom.yaml's
# code_max_bounces, applied by internal/loomrecipe, and a budget of 0 turns the perch off: the
# Bouncer settles approved at once and Describe's entry gate skips it, so the writer's own
# description stands.
#
# The perch's answer key is the task's board entry, which the discussion gate's commit snapshots into
# _lyx/discussion/board-entry.md, as amended by the decision record's `Added after Discussion`
# entries; the record's other sections are the writer's own claim, reviewed against the snapshot.
#
# Finalize declares on_reroute: Code-Bouncer, the row a conflict or a merge too large to land sends
# the run back to, so the perch reviews the code the writer changed in answer.
# Shed's reroute cap bounds that edge, and a reroute spends no bounce budget.
# With a budget of 0 the Bouncer settles approved at once on that reroute too.
#
# An in-flight run parked on a row this recipe removed -- Merge-In, Publish, PR-Align, PR-Gate -- or
# on a row whose edges changed with them, or on the retired Darn-Burler, Darn-Bouncer,
# Darn-Burler-Review or Darn-Burler-Fix row, is restarted, not migrated.
#
# Describe follows the perch because Code-Burler-Fix can change the code after the writer described it.
# Its entry gate budget.Code-Review skips it when the perch is off.

version: 1
entry: Preflight
terminals:
  - Friction-Reflect

producers:
  - name: Preflight
    engine: Preflight
    on_done: Darn-Write

  - name: Darn-Write
    engine: DarnWrite
    # With loom.yaml's code_max_bounces at 0 the Bouncer settles approved at once, so this edge is kept.
    on_done: Code-Bouncer
    config:
      # gates holds this row's handoff until it is mechanically valid: each entry names a gate and
      # re-prompts the live session up to its attempts times. The verify gate runs the hub's
      # `darn-write` key, or the tree-scoped command for a diff wholly under the configured trees,
      # and lints the comments from the merge base on every attempt; gate_key names another key of
      # the hub's gate.yaml. The verify gate's attempts here is a
      # placeholder: the builder stamps darn.yaml's verify_attempts at every build.
      gates:
        # On a darn run the discussion gate is the darn gate: it also refuses a record missing an
        # entry its commit history held, and when it passes snapshots the task's board entry and
        # commits it with the decision record and support log.
        - name: discussion
          attempts: 3
        - name: verify
          attempts: 3
        - name: description
          attempts: 3

  - name: Code-Bouncer
    engine: Bouncer
    segment: Code-Review
    on_stuck: Code-Burler-Review
    on_done: Describe
    config:
      run_subdir: code
      subject: code
      role_prefix: code
      reviewer_fan_setting: loom.code_reviewer_fan
      auto_accept_setting: loom.code_auto_accept
      # The subject under review is the committed diff, which artifact_paths cannot name; the key
      # names the answer key instead: the board entry snapshot and the decision record. The rubric
      # names the diff as the subject.
      artifact_paths:
        - _lyx/discussion/board-entry.md
        - _lyx/discussion/decision-record.md
      rubric_stencil: loom-rubric-code-review
      # No commit_seam: Code-Burler-Fix runs fix-scope: source and commits each fix itself.
      # carry_over names this row's own segment: the Bouncer files the round's still-open findings
      # under it in the decision record's Open risks section, and a test pins it equal to segment.
      carry_over: Code-Review

  - name: Code-Burler-Review
    engine: BurlerReview
    segment: Code-Review
    on_stuck: Code-Burler-Fix
    # BurlerReviewProducer never returns Done, so this edge is unreachable -- but an empty on_done
    # is load-bearing and ends the whole run silently, so it names the row it can never reach.
    on_done: Code-Burler-Fix
    config:
      # The same run_subdir value as Code-Bouncer is what makes the three rows write into one
      # shared run directory.
      run_subdir: code
      role_prefix: code
      reviewer_fan_setting: loom.code_reviewer_fan
      fixer_fan_setting: loom.code_fixer_fan
      profile:
        target:
          # No paths key: a diff has no file on disk for the profile's path check to stat.
          instructions: >
            The subject under review is the committed diff. The rubric supplied in this prompt is
            the single definition of the review range: read its "Determining the review range"
            section and derive the range exactly as written there.
        fasit:
          paths:
            - _lyx/discussion/board-entry.md
            - _lyx/discussion/decision-record.md
          instructions: >
            The board entry snapshot named above is the task's scope, as amended by the
            `Added after Discussion` entries of the decision record named above, which win where
            they differ. The record's other sections are the writer's own claim, checked against
            the snapshot and never the answer key. The diff's job is to make the change the
            amended entry asks for.
        rubric_stencil: loom-rubric-code-review
        # fix-scope: source: the target is the repo's own source files, and a fixer that cannot
        # write and commit source cannot fix a diff.
        fix-scope: source
        # tool-use is required: the round runs read-only git to obtain the diff.
        tool-use: true
        # The round reviews code, so its seats load the hub's language skills after their own.
        language-skills: true
        # No cluster-fan key: the row's reviewer_fan_setting and fixer_fan_setting keys name loom.yaml's
        # code_reviewer_fan and code_fixer_fan.

  - name: Code-Burler-Fix
    engine: BurlerFix
    segment: Code-Review
    on_stuck: Code-Bouncer
    # BurlerFixProducer never returns Done, so this edge is unreachable -- but an empty on_done is
    # load-bearing and ends the whole run silently, so it names the row it can never reach.
    on_done: Code-Bouncer
    config:
      run_subdir: code
      role_prefix: code
      fixer_fan_setting: loom.code_fixer_fan
      review_row: Code-Burler-Review
      # The verify gate runs the tree-scoped command, or the hub's `code-burler-fix` key, on the
      # committed tree after each round, lints the comments from the merge base on every attempt,
      # and re-prompts the fix session with the findings until it passes. The row runs its own key
      # and shares no pass with the writer's; gate_key names another key of the hub's gate.yaml.
      # Its attempts here is a placeholder: the builder stamps darn.yaml's verify_attempts at every build.
      gates:
        - name: verify
          attempts: 3
      profile:
        # No target key: a diff names no file, so the fixer finds its files from the review's
        # findings and the gate's findings alone.
        fix-scope: source
        # The round fixes code, so its seat loads the hub's language skills after its own.
        language-skills: true

  # Describe writes the change description from the final diff, replacing the writer's own.
  - name: Describe
    engine: Describe
    entry_gate: budget.Code-Review
    on_done: PR-Review
    config:
      gates:
        - name: description
          attempts: 3

  # PR-Review is the stub seat the human pull-request review will take over. It always returns Done,
  # so it carries no on_stuck, and darn.yaml's pr_review key only decides whether it logs.
  - name: PR-Review
    engine: PRReview
    on_done: Finalize
    config:
      pr_review_setting: darn.pr_review

  # Finalize takes the parent lock first, merges the parent into the task branch, runs the landing
  # gate and the merge fixer, then fast-forwards the parent and releases the lock on every way out.
  # A conflict or a merge too large to land reroutes to Code-Bouncer.
  - name: Finalize
    engine: Finalize
    on_reroute: Code-Bouncer
    # Hands off to the reflection row rather than ending the run.
    on_done: Friction-Reflect

  # Friction-Reflect runs the Tier 2 friction reflection under the run lock and is the recipe's
  # sole terminal, so the engine persists state.
  - name: Friction-Reflect
    engine: FrictionReflect
    # on_done is explicitly empty: the empty value is load-bearing and is what ends the whole run
    # quietly, per shedengine.ProducerDef.OnDone's own field doc.
    on_done: ""
