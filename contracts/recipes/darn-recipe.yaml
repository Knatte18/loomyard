# darn-recipe.yaml is the darn task recipe: one gated writer reads the board entry, edits, tests and
# commits, the Darn-Review perch reviews the committed diff, Describe rewrites the change
# description from the final diff, then Publish, PR-Align, PR-Gate and Finalize land it. It is
# embedded into the binary by the sibling recipes.go rather than read from disk. The row names below are the
# durable on-disk identities pinned against internal/loomshed's Name* constants -- a rename here
# without a matching constant rename breaks resume for any in-flight task, unless internal/loomrecipe
# maps the retired name onto its successor, as it maps the writer row's former name, Darn.
#
# The writer writes and validates the decision record before any code, and the perch's open findings
# land in the record's `## Open risks`. PR-Align spawns the alignment agent with darn's geometry
# before PR-Gate and reads loom.yaml's alignment keys. An in-flight run parked on a row whose edges
# changed with PR-Align is restarted, not migrated.
#
# Preflight, Merge-In, Publish and Finalize carry no on_stuck: nothing in the list produces what each of them
# gates, so a human is the only thing that can fix them. Darn-Write and Describe carry none either:
# an exhausted writer gate halts the run for the parent, which resumes it with a fresh budget.
# PR-Align, like Friction-Reflect, carries none either, because it never returns Stuck.
#
# Darn-Bouncer, Darn-Burler-Review and Darn-Burler-Fix are the Darn-Review perch, wired like loom's
# Webster-Review ring under one shared segment label: the Bouncer's on_stuck names the review row,
# the review row's on_stuck names the fix row, the fix row's on_stuck names the Bouncer, and each
# Burler row's on_done names the same row as its on_stuck, since neither ever returns Done. The
# segment's rows declare no max_bounces: their budget is darn.yaml's review_max_bounces, applied by
# internal/loomrecipe, and a budget of 0 turns the perch off by routing Darn-Write's Done straight
# to Merge-In, past Describe, so the writer's own description stands.
# The perch's judge, reviewer
# and fixer models are loom.yaml's Webster-Review keys, the other committed-diff review.
# The perch's rows share one role_prefix, which leads their sessions' roles,
# so ly:<slug>:darn-burler-review names its segment.
#
# Merge-In follows Describe and hands straight to Publish: darn has no Merge-Review perch.
# Publish, PR-Gate and Finalize each declare on_reroute: Merge-In, the row a moved parent sends
# them back to. An in-flight run parked on a row whose name or edges changed with Merge-In is
# restarted, not migrated.
#
# An in-flight run parked on the retired Darn-Burler row is restarted, not migrated, as it is for
# the other retired rows.
#
# Describe follows the perch because Darn-Burler-Fix can change the code after the writer described it.
#
# PR-Gate bounces to Darn-Write, the row that produces the diff it guards, so a rework passes the
# perch and Describe again before Publish refreshes the open pull request. The edge's max_bounces is
# the value the status projection and the reject refusal report; a Darn-Write Done ends the gate's
# episode and a Darn-Write Stuck halts the run, so consecutive rejections never accumulate and the
# budget is never reached under this recipe.

version: 1
entry: Preflight
terminals:
  - Friction-Reflect

producers:
  - name: Preflight
    engine: Preflight
    on_done: Darn-Write

  - name: Darn-Write
    engine: DarnWrite
    segment: PR-Review
    # internal/loomrecipe rewrites this edge to Merge-In when darn.yaml's review_max_bounces is 0.
    on_done: Darn-Bouncer
    config:
      # gates holds this row's handoff until it is mechanically valid: each entry names a gate and
      # re-prompts the live session up to its attempts times. The verify gate's attempts here is a
      # placeholder: the builder stamps darn.yaml's verify_attempts at every build.
      gates:
        # On a darn run the discussion gate is the darn gate: it also refuses a record missing an
        # entry its commit history held, and commits the decision record and support log when it
        # passes.
        - name: discussion
          attempts: 3
        - name: verify
          attempts: 3
        - name: description
          attempts: 3

  - name: Darn-Bouncer
    engine: Bouncer
    segment: Darn-Review
    on_stuck: Darn-Burler-Review
    on_done: Describe
    config:
      run_subdir: darn
      role_prefix: darn
      # The subject under review is the committed diff, which artifact_paths cannot name; the key is
      # required, so it names the change description the writer committed, the writer's own claim
      # of what the diff does. The rubric names the diff as the subject and the amended board entry
      # as the measuring stick.
      artifact_paths:
        - _lyx/landing/summary.md
      rubric_stencil: loom-rubric-darn-review
      # No commit_seam: Darn-Burler-Fix runs fix-scope: source and commits each fix itself.
      # carry_over names this row's own segment: the Bouncer files the round's still-open findings
      # under it in the decision record's Open risks section, and a test pins it equal to segment.
      carry_over: Darn-Review

  - name: Darn-Burler-Review
    engine: BurlerReview
    segment: Darn-Review
    on_stuck: Darn-Burler-Fix
    # BurlerReviewProducer never returns Done, so this edge is unreachable -- but an empty on_done
    # is load-bearing and ends the whole run silently, so it names the row it can never reach.
    on_done: Darn-Burler-Fix
    config:
      # The same run_subdir value as Darn-Bouncer is what makes the three rows write into one
      # shared run directory.
      run_subdir: darn
      role_prefix: darn
      profile:
        target:
          # No paths key: a diff has no file on disk for the profile's path check to stat.
          instructions: >
            The subject under review is the committed diff. The rubric supplied in this prompt is
            the single definition of the review range: read its "Determining the review range"
            section and derive the range exactly as written there.
        fasit:
          instructions: >
            The board entry of this run's task is the answer key: read it with
            `lyx board get '{"slug":"<slug>"}'`, where <slug> is this worktree's own directory
            name, as amended by the `Added after Discussion` entries of
            `_lyx/discussion/decision-record.md`, which win where they differ. The record's other
            sections are the writer's claim, checked against the board entry and never the answer
            key. The diff's job is to make the change the amended entry asks for. A deviation the
            change description names as an unrecorded parent correction is a `decision`-class
            MEDIUM finding whose fix text tells the fixer to leave the code and defer to the
            parent.
        rubric_stencil: loom-rubric-darn-review
        # fix-scope: source: the target is the repo's own source files, and a fixer that cannot
        # write and commit source cannot fix a diff.
        fix-scope: source
        # tool-use is required: the round runs read-only git to obtain the diff and reads the board
        # entry.
        tool-use: true
        # No cluster-fan key: fork reviewers may run no git, and the subject exists only through git.

  - name: Darn-Burler-Fix
    engine: BurlerFix
    segment: Darn-Review
    on_stuck: Darn-Bouncer
    # BurlerFixProducer never returns Done, so this edge is unreachable -- but an empty on_done is
    # load-bearing and ends the whole run silently, so it names the row it can never reach.
    on_done: Darn-Bouncer
    config:
      run_subdir: darn
      role_prefix: darn
      review_row: Darn-Burler-Review
      # The verify gate runs darn.yaml's verify command on the committed tree after each round and
      # re-prompts the fix session with the findings until it passes. Its attempts here is a
      # placeholder: the builder stamps darn.yaml's verify_attempts at every build.
      gates:
        - name: verify
          attempts: 3
      profile:
        # No target key: a diff names no file, so the fixer finds its files from the review's
        # findings and the gate's findings alone.
        fix-scope: source

  # Describe writes the change description from the final diff, replacing the writer's own.
  - name: Describe
    engine: Describe
    on_done: Merge-In
    config:
      gates:
        - name: description
          attempts: 3

  # Merge-In takes the parent lock, merges the parent into the task worktree, verifies the merged
  # tree and writes the merge record. It hands straight to Publish: darn has no Merge-Review perch.
  - name: Merge-In
    engine: MergeIn
    on_done: Publish

  - name: Publish
    engine: Publish
    on_reroute: Merge-In
    on_done: PR-Align

  # PR-Align spawns the alignment agent for the pull request Publish opened and applies its verdict
  # through the records PR-Gate reads. It always ends Done and never Stuck, so it carries no on_stuck,
  # and it sits outside the PR-Review segment: a Done by a row of that segment ends the gate's bounce
  # episode.
  - name: PR-Align
    engine: PRAlign
    on_done: PR-Gate

  # PR-Gate owns every review decision on the pull request Publish opened: it returns Done on an
  # approval or a merge, Awaiting while the operator has not decided, and Stuck only for a matching
  # rejection, which bounces to the writer row that produces the diff it guards.
  - name: PR-Gate
    engine: PRGate
    segment: PR-Review
    max_bounces: 5
    on_stuck: Darn-Write
    on_reroute: Merge-In
    on_done: Finalize

  - name: Finalize
    engine: Finalize
    on_reroute: Merge-In
    # Hands off to the reflection row rather than ending the run.
    on_done: Friction-Reflect

  # Friction-Reflect runs the Tier 2 friction reflection under the run lock and is the recipe's
  # sole terminal, so the engine persists state.
  - name: Friction-Reflect
    engine: FrictionReflect
    # on_done is explicitly empty: the empty value is load-bearing and is what ends the whole run
    # quietly, per shedengine.ProducerDef.OnDone's own field doc.
    on_done: ""
