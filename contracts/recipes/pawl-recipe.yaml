# pawl-recipe.yaml is the pawl recipe, a beam's life, and a loom recipe: Preflight checks the pair, as tapestry and darn do,
# Record-Write writes the project's decision record from its board entry, Beam-Up brings the beam up, Beam-Await holds the run
# while the members' runs do the work a writer does in a task recipe, until a land request passes the landing re-check,
# Parent-Align brings the parent's upstream tip into the beam, Beam-Describe writes the change description from the beam's
# board entry, its project record and the commits it adds, PR-Review lands the beam through a pull request when the resolver
# says so, Finalize merges the beam's parent into the beam, runs the landing gate and fast-forwards the parent, and Beam-Down
# takes the beam's dobby and orch down.
# It is embedded into the binary by the sibling recipes.go rather than read from disk. The row names below
# are the durable on-disk identities that resume depends on.
#
# Record-Write, Beam-Up, Beam-Await and Beam-Down are Go producers that spawn no agent, and Beam-Await returns Done only
# for a land request that names this run and passes the re-check.
#
# The project record holds only what binds the whole project: its goal, its bounds and the constraints every member follows.
# Record-Write writes it under the beam's slug, apart from any member's own record, since every pair forked from the beam
# inherits the beam's records. After that only `lym loom decision add <beam-slug>` changes it.
#
# The hold boundary: a beam project's run holds its beam from Parent-Align on, so Preflight, Record-Write, Beam-Up and
# Beam-Await leave the beam open to members, and boardengine.RunHolds names those rows and batten's claim row as the
# hold-free ones. A test pins that list against this recipe's row names.
#
# The recipe has no review round of its own: a member's run reviews its own change before it lands in the beam.
# Beam-Describe carries no entry gate: it writes from the entry, the record and the commits.
#
# Finalize never reroutes, in this recipe or any other, so it declares no on_reroute: it settles an
# over-cap fixer change in place, through its own fix review and the fixer. A conflict or a large merge lands through the gate in every recipe: the merge
# fixer takes a failing merged tree.
#
# Preflight carries no on_stuck: nothing in the list produces what it gates, so a human is the only thing
# that can fix it.
# Record-Write, Parent-Align and Beam-Describe carry no on_stuck: Record-Write's Stuck names its way forward,
# Parent-Align fixes its own merge and test failures in its merge fixer, and a description that fails validation halts
# the run for the orch, which ends the landing and fixes the entry.

version: 1
entry: Preflight
# The recipe declares the loom contract, which Shed checks when it builds the recipe; Finalize runs the landing gate's
# own key over the whole merged tree, so verify_source names the gate-call source.
contract: loom
verify_source: plan
terminals:
  - Beam-Down

producers:
  - name: Preflight
    engine: Preflight
    on_done: Record-Write

  # Record-Write writes the project record and its support log from the beam's board entry, with no agent, and commits them.
  # It writes only a file that is missing, so a resume keeps every entry `lym loom decision add` added.
  - name: Record-Write
    engine: RecordWrite
    on_done: Beam-Up

  - name: Beam-Up
    engine: BeamUp
    on_done: Beam-Await

  # Beam-Await is the recipe's build row: the members' runs land their changes in the beam while it waits.
  - name: Beam-Await
    engine: BeamAwait
    on_done: Parent-Align

  # Parent-Align brings the parent's upstream tip into the beam with no parent lock and runs the merge
  # fixer on a conflict or a failing merged tree. A failure the fixer cannot fix halts the run for the orch.
  - name: Parent-Align
    engine: ParentAlign
    on_done: Beam-Describe

  - name: Beam-Describe
    engine: BeamDescribe
    on_done: PR-Review

  # PR-Review carries no entry_gate and no on_stuck, because its Stuck is always a Halt.
  - name: PR-Review
    engine: PRReview
    on_done: Finalize

  - name: Finalize
    engine: Finalize
    on_done: Beam-Down

  # Beam-Down's empty on_done is load-bearing and is what ends the run quietly.
  - name: Beam-Down
    engine: BeamDown
    on_done: ""
