# tapestry-recipe.yaml is loom's producer graph for a task the run discusses, plans and builds.
# It is embedded into the binary by the sibling recipes.go rather than read from disk.
#
# It is two block rows and no row of its own:
# the Motif block runs motif-recipe.yaml's Discussion-Write and Discussion-Review ring inline,
# and the Jacquard block runs jacquard-recipe.yaml's rows inline, from Preflight to Friction-Reflect.
# Each row is defined once, in the recipe its block names, so tapestry's rows are motif's followed by jacquard's.
# The rows keep their names inside a block, so a run resumes by row name.
# The header of each of those recipes states the routing of its rows.
#
# The recipe declares contract: loom, so Shed checks the loom contract when it builds it.
# Its top-level keys are the run's, since an expansion reads none of a block recipe's keys;
# all but entry equal jacquard-recipe.yaml's.

version: 1
entry: Motif
# The arbiter's prompt names this row once the plan is approved: a decision that amends the plan routes here.
amendment_target: Plan-Burler-Review
# The recipe declares the loom contract, which Shed checks when it builds the recipe; verify_source names where the verify targets come from.
contract: loom
verify_source: plan
terminals:
  - Friction-Reflect

producers:
  # Motif runs the motif recipe inline: Discussion-Write and the Discussion-Review ring.
  # Its block_gate undiscussed enters the block unless the run's board entry is flagged discussed.
  # For a discussed entry the gate writes the entry's stored decision record into _lym/discussion, commits it,
  # and passes over the block to Jacquard, whose Record-Seed row then finds the record and writes nothing.
  - name: Motif
    block: motif
    block_gate: undiscussed
    on_done: Jacquard

  # Jacquard runs the jacquard recipe inline: Preflight, Record-Seed and every row after them.
  # It is the recipe's last row, so its empty on_done ends the run once its own last row, Friction-Reflect, does,
  # and its block_gate always holds, so no skip falls back to the block's entry.
  - name: Jacquard
    block: jacquard
    block_gate: always
