judge_model: haiku  # model-spec string for the ephemeral progress judge and the asking-triage call: an alias with an optional [effort=...] bracket (e.g. "sonnet[effort=high]"), or the escape form "<engine>:<model-id>[...]" for a model not in the registry. A bare alias picks up its default effort from models.yaml; effort is the only bracket param perch accepts. See docs/reference/model-spec.md for the full grammar.
round_caps: [5, 8, 10]  # engine-wide default milestone cap ladder: strictly increasing, the last entry is the hard cap a round loop can never exceed; a profile's own round-caps key overrides this per phase
