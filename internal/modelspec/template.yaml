# models.yaml — the model-spec registry. Materialized once (lym init / lym
# config reconcile) when this file is absent; after that, this file is
# OPERATOR-OWNED: any alias you add, or value you change or remove, here
# survives every future reconcile. In a hub, the reconcile after a lym upgrade
# carries a template change into the board's copy only where it still holds
# lym's earlier value, kept in models.template-base beside it.
#
# Add a new alias by adding a block like this (freely — no code change or
# recompile is needed to adopt a brand-new model):
# zephyr: {engine: claude, model: claude-zephyr-1}
#
# See contracts/specs/llm-model-spec.md for the full grammar, precedence rules, and
# the built-in fallback set this file overrides/extends.

sonnet:
  engine: claude
  model: sonnet
  defaults:
    effort: medium
opus:
  engine: claude
  model: opus
  defaults:
    effort: medium
haiku:
  engine: claude
  model: haiku
  defaults:
    effort: medium
fable:
  engine: claude
  model: fable
  defaults:
    effort: high
sol:
  engine: codex
  model: gpt-6.1-sol
  defaults:
    effort: medium
astra:
  engine: codex
  model: gpt-6-astra
  defaults:
    effort: medium
luna:
  engine: codex
  model: gpt-6-luna
  defaults:
    effort: medium
