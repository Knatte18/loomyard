enabled: false  # true turns on the regression rows Drift-Baseline, Drift-Await and Drift-Verify in the loom and darn recipes; false leaves them out
capture: {}  # the command that records the regression baseline, written whole as {command, dir, env, timeout_min}; {} declares none; the command must hold {baseline_dir}, where it writes its profile files, and may hold {skip_file}, a file naming one skipped test per line; write it with lym config drift --set 'capture={command: "...", timeout_min: 30}'
compare: {}  # the command that compares the branch against the baseline, written whole as {command, dir, env, timeout_min}; {} declares none; the command must hold {baseline_dir}, may hold {skip_file}, and exits 0 when nothing drifted; write it with lym config drift --set 'compare={command: "...", timeout_min: 30}'
baseline_model: sonnet[medium]  # model-spec for the Drift-Baseline agent, which records the task's regression scope (see contracts/specs/llm-model-spec.md)
verify_model: opus[high]  # model-spec for the Drift-Verify agent, which judges, accepts and fixes drift (see contracts/specs/llm-model-spec.md)
verify_max_runs: 8  # how many compare or side-capture runs one Drift-Verify agent session may take before it must report
