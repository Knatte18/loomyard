enabled: false  # true turns on the regression rows Drift-Baseline, Drift-Await, Drift-Verify and Drift-Recheck in the tapestry and darn recipes; false leaves them out
capture: {}  # the command that records the regression baseline, written whole as {command, dir, env, timeout_min}; {} declares none; dir is absolute or relative to the worktree root, the base gate.yaml's dir uses too, no dir runs in the worktree's anchor, and a hub write refuses a dir that is no existing directory in the prime; the command must hold {baseline_dir}, where it writes its result files, the only files drift compares; it may hold {meta_dir}, where it writes the capture's provenance, such as the commit it ran at and its capture time, which drift keeps beside the capture and never compares; write it with lym config drift --set 'capture={command: "...", timeout_min: 30}'; once declared, change one key alone with lym config drift --set capture.timeout_min=45
compare: {}  # the command that compares the branch against the baseline, run only under diff: command, written whole as {command, dir, env, timeout_min}; {} declares none; dir resolves as capture's does; the command must hold {baseline_dir} and exits 0 when nothing drifted, and {meta_dir} names the baseline's provenance directory; write it with lym config drift --set 'compare={command: "...", timeout_min: 30}'; once declared, change one key alone with lym config drift --set compare.timeout_min=45
diff: lines  # how a run compares the capture with the baseline: lines diffs the two capture directories line by line in Go and checks the changed values against the expectation the expect agent writes, which needs a capture of files of lines the key_patterns read; command runs the compare command; lines or command, set only in the hub's drift.yaml
key_patterns: ['^\s*(?P<key>[^=:]+?)\s*=\s*(?P<value>.*?)\s*$', '^\s*(?P<key>[^=:]+?)\s*:\s*(?P<value>.*?)\s*$']  # the regular expressions, tried in order, that key a captured line: the named group key names the quantity and the named group value holds its value, the first match wins, and a line none matches is told apart by its position; the defaults read name = value and name: value; set only in the hub's drift.yaml
volatile_files: []  # capture files that differ in every capture whatever the code does, which the diff under diff: lines leaves out whole; a capture's provenance needs no entry, since it goes to {meta_dir} and the expect agent marks any it finds as metadata; each entry is a glob, matched against a file's name at any depth, or against its whole path when it holds a /; a run keeps the list it started with; set only in the hub's drift.yaml, with lym config drift --set 'volatile_files=[<glob>]'
volatile_keys: []  # line keys, as the key_patterns read them, that differ in every capture whatever the code does, which the diff under diff: lines leaves out of every file; a timestamp, run id or host name needs no entry, since the expect agent marks it as metadata; a run keeps the list it started with; set only in the hub's drift.yaml, with lym config drift --set 'volatile_keys=[<key>]'
expect_model: sonnet[medium]  # model-spec for the expect agent, which writes the expectation of what the task changes in the capture (see contracts/specs/llm-model-spec.md)
judge_model: opus[high]  # model-spec for the judge, which rules on each expected value against its old and new value (see contracts/specs/llm-model-spec.md)
judge_interactive: false  # true runs the judge as a session with the operator in its pane, who decides each ruling, so an operator must be present; false, the default, runs it autonomously
scope: ""  # the task's regression scope, off, partial or full, which Drift-Baseline records as given, spawning no agent; "" lets the Drift-Baseline agent decide it; set it per task in the board entry's run_settings, as {"drift": {"scope": "full"}}
