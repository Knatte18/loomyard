discussion: opus[medium]  # model-spec for the discussion-phase interview agent (see contracts/specs/llm-model-spec.md)
discussion_timeout_min: 480  # minutes the discussion agent's shuttle run is allowed to run (an autonomous agent exploring a codebase and writing two files can legitimately run long; this is a deadline, not a wait)
discussion_interactive: false  # true runs the discussion-phase agent as an interview in its pane and requires an operator to be present; false, the default, is today's autonomous behaviour, because a task spawned unattended must not silently wait for a human
discussion_producer: single  # producer the Discussion-Write row runs: single, the default, runs the single-agent writer; seats runs a chair with the advisors below; twill runs the single-agent writer, which forks itself once per lens of the twill-discussion fan in burler.yaml to review its record before it finishes
discussion_advisors: ["sonnet[high]"]  # model-specs of the advisors a seats chair consults, one advisor per entry; read only when discussion_producer is seats, and an empty list runs the chair alone, deciding each question itself
plan: opus[medium]  # model-spec for the plan-phase producer agent (see contracts/specs/llm-model-spec.md)
plan_timeout_min: 120  # minutes the plan agent's shuttle run is allowed to run (a shorter ceiling than the discussion run)
plan_producer: single  # producer the Plan-Write row runs: single, the default, runs the single-agent writer; twill runs the single writer, which forks itself once per lens of the twill-plan fan in burler.yaml to review its plan before it finishes; an empty value reads as single
review: opus[medium]  # model-spec for the reviewer of every review segment round (see contracts/specs/llm-model-spec.md); a YAML list sets one model per round, with the last entry for every later round
fix: opus[medium]  # model-spec for the fixer of every review segment round (see contracts/specs/llm-model-spec.md); a YAML list sets one model per round, with the last entry for every later round
discussion_review: ""  # model-spec for the Discussion-Review reviewer; empty takes the run-wide review list, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
discussion_fix: ""  # model-spec for the Discussion-Review fixer; empty takes the run-wide fix list, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
plan_review: ""  # model-spec for the Plan-Review reviewer; empty takes the run-wide review list, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
plan_fix: ""  # model-spec for the Plan-Review fixer; empty takes the run-wide fix list, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
webster_review: sonnet[high]  # model-spec for the Webster-Review reviewer; empty takes the run-wide review list, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
webster_fix: ""  # model-spec for the Webster-Review fixer; empty takes the run-wide fix list, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
discussion_fan: ""  # fan name from burler.yaml (its fans fall back per name to the embedded template) that turns the lens fan on for Discussion-Review; empty, the default, runs the segment solo
plan_fan: ""  # fan name from burler.yaml that turns the lens fan on for Plan-Review; empty, the default, runs the segment solo; Webster-Review has no fan key and always runs solo
fan_review: sonnet[high]  # model-spec for the reviewer of a fanned segment's round (a segment whose discussion_fan or plan_fan is set), replacing that segment's review list while its fixer list is kept; it is also the forks' model, since forks run on the reviewer session's model; same grammar as review, a YAML list sets one model per round with the last entry for every later round
judge: sonnet[medium]  # model-spec for every Bouncer row's judge pass, and for its seed pass while seed is empty; discussion_judge, plan_judge and webster_judge override it per segment (see contracts/specs/llm-model-spec.md)
seed: ""  # model-spec for every Bouncer row's seed pass; empty takes that segment's resolved judge; discussion_seed, plan_seed and webster_seed override it per segment
discussion_judge: ""  # model-spec for the Discussion-Review judge pass; empty takes judge
plan_judge: ""  # model-spec for the Plan-Review judge pass; empty takes judge
webster_judge: ""  # model-spec for the Webster-Review judge pass; empty takes judge
discussion_seed: ""  # model-spec for the Discussion-Review seed pass; empty takes seed, and seed empty takes the segment's resolved judge
plan_seed: ""  # model-spec for the Plan-Review seed pass; empty takes seed, and seed empty takes the segment's resolved judge
webster_seed: ""  # model-spec for the Webster-Review seed pass; empty takes seed, and seed empty takes the segment's resolved judge
rework: ""  # model-spec for the PR-Rework agent; empty takes plan
review_timeout_min: 240  # minutes one review round's shuttle run is allowed to run
friction: sonnet[medium]  # model-spec for the Tier 2 friction-reflection producer (see contracts/specs/llm-model-spec.md); empty turns Tier 2 self-reporting off
friction_timeout_min: 30  # minutes the friction-reflection agent's shuttle run is allowed to run
driver: sonnet[medium]  # model-spec for the model that runs an llm-driven run's loom driver session (see contracts/specs/llm-model-spec.md); empty defers to the provider default
arbiter: opus[high]  # model-spec for the arbiter, the cold agent a run's driver asks to settle a stop it cannot (see contracts/specs/llm-model-spec.md); empty takes opus[high]
arbiter_timeout_min: 30  # minutes one arbiter spawn is allowed to run; 0 takes 30
arbiter_max_spawns: 3  # arbiter spawns a run may use; 0 turns the arbiter off, so every eligible stop escalates to the run's parent as without it
driver_kind: llm  # the driver a task's loom run is seeded with when nothing typed one: llm or go; a seeded run keeps its recorded driver
tackler: haiku  # model-spec for the tackler, the cold agent a Go driver asks to settle a stop its rules do not (see contracts/specs/llm-model-spec.md); empty takes haiku
tackler_timeout_min: 10  # minutes one tackler spawn is allowed to run; 0 takes 10
tackler_max_spawns: 4  # tackler spawns a run may use; 0 turns the tackler off, so every stop it would take hands back
alignment: opus[high]  # model-spec for the alignment agent, the cold agent that settles a parent review or a PR-Gate itself unless it finds an overlap or a question it cannot settle (see contracts/specs/llm-model-spec.md); empty takes opus[high]
alignment_timeout_min: 20  # minutes one alignment spawn is allowed to run; 0 takes 20, and the resolved value must stay below parent_review_wait_min
skip_alignment: false  # true sends parent review and PR-Gate to the run's parent exactly as before the alignment agent
alignment_pr_approve: true  # false makes an agent approve at PR-Gate an escalation, so the parent gives the yes
parent_review_wait_min: 60  # minutes Discussion-Write's gate waits for the parent's verdict before passing with a Warn
step_idle_timeout_min: 60  # minutes a --until-stop step may show no activity (no trace write and no agent activity) before the loop kills it; a value below 1 is raised to 1
review_circling_checkpoint: 3  # first judged round from which a review segment's judge may rule CIRCLING; with review_max_bounces also 3 a run reaches the soft-cap rule at round 3 before a CIRCLING verdict could change the outcome, so lower this for an earlier circling escalation; a value above review_max_bounces means a run never rules CIRCLING and reaches the soft-cap rule instead
review_max_bounces: 3  # bounce budget of every Bouncer review segment's rows (Discussion-Review, Plan-Review, Webster-Review); 0 gives every perch without its own budget zero rounds; a spent budget runs the soft-cap rule (the judge's fix tags settle the round, escalating only a stuck run); with review_circling_checkpoint also 3 the soft-cap rule at round 3 comes before a CIRCLING verdict could change the outcome, and lowering the checkpoint gives an earlier circling escalation
review_hard_max_bounces: 4  # hard cap of every Bouncer review segment's rows: a round numbered at or past it is never continued, it is accepted or escalated hard-cap; at least 1 and not below the perch's budget
discussion_max_bounces: ~  # bounce budget of the Discussion-Review perch: N gives N judged Burler rounds; null takes review_max_bounces; 0 runs no review round: the perch's Bouncer settles approved at once; a checkpoint above this budget means the perch never rules CIRCLING and reaches the soft-cap rule, or the accept, instead
plan_max_bounces: ~  # bounce budget of the Plan-Review perch: N gives N judged Burler rounds; null takes review_max_bounces; 0 runs no review round: the perch's Bouncer settles approved at once; a checkpoint above this budget means the perch never rules CIRCLING and reaches the soft-cap rule, or the accept, instead
webster_max_bounces: ~  # bounce budget of the Webster-Review perch: N gives N judged Burler rounds; null takes review_max_bounces; 0 runs no review round: the perch's Bouncer settles approved at once; a checkpoint above this budget means the perch never rules CIRCLING and reaches the soft-cap rule, or the accept, instead
discussion_hard_max_bounces: 0  # hard cap of the Discussion-Review perch: a round numbered at or past it is never continued, it is accepted or escalated hard-cap; 0 takes review_hard_max_bounces
plan_hard_max_bounces: 0  # hard cap of the Plan-Review perch: a round numbered at or past it is never continued, it is accepted or escalated hard-cap; 0 takes review_hard_max_bounces
webster_hard_max_bounces: 0  # hard cap of the Webster-Review perch: a round numbered at or past it is never continued, it is accepted or escalated hard-cap; 0 takes review_hard_max_bounces
discussion_auto_accept: false  # true makes the Discussion-Review perch accept a harvested round at a spent budget instead of running the soft-cap rule
plan_auto_accept: false  # true makes the Plan-Review perch accept a harvested round at a spent budget instead of running the soft-cap rule
webster_auto_accept: false  # true makes the Webster-Review perch accept a harvested round at a spent budget instead of running the soft-cap rule
merge_max_bounces: 1  # bounce budget of the Merge-Review perch: N gives N judged Burler rounds; null takes review_max_bounces; 0 runs no review round: the perch's Bouncer settles approved at once
merge_hard_max_bounces: 0  # hard cap of the Merge-Review perch: a round numbered at or past it is never continued, it is accepted or escalated hard-cap; 0 takes review_hard_max_bounces
merge_auto_accept: true  # true makes the Merge-Review perch accept a harvested round at a spent budget instead of running the soft-cap rule; an open BLOCKING finding in the ledger sends the round to the rule
