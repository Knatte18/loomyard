discussion: opus[medium]  # model-spec for the discussion-phase interview agent (see contracts/specs/llm-model-spec.md)
discussion_timeout_min: 480  # minutes the discussion agent's shuttle run is allowed to run (an autonomous agent exploring a codebase and writing two files can legitimately run long; this is a deadline, not a wait)
discussion_interactive: false  # true runs the discussion-phase agent as an interview in its pane and requires an operator to be present; false, the default, is today's autonomous behaviour, because a task spawned unattended must not silently wait for a human
discussion_advisors: []  # the Discussion-Write advisors, each entry a {name, model} pair: name is the advisor's seat name (a lowercase letter first, then lowercase letters, digits and hyphens) and model its model-spec; an empty list, the default, runs the lead alone, deciding each question itself
discussion_lenses: twill-discussion  # fan name from lenses.yaml that has the Discussion-Write lead fork itself once per lens to review its record before it finishes; twill-discussion is the default, and empty turns the forks off; this names the writer's lens fan, not the discussion_reviewer_fan of the Discussion-Review perch
plan: opus[medium]  # model-spec for the plan-phase producer agent (see contracts/specs/llm-model-spec.md)
plan_timeout_min: 120  # minutes the plan agent's shuttle run is allowed to run (a shorter ceiling than the discussion run)
implementer: webster  # engine of the Webster row, the implementer that builds the approved plan on the task branch and batches it its own way; webster, the only value, runs the Merriam session with one fork per batch
plan_lenses: twill-plan  # fan name from lenses.yaml that has the Plan-Write lead explore, have one fork write the plan, then fork itself once per lens of the fan to review it before it finishes; twill-plan is the default, and empty turns the forks off; this names the writer's lens fan, not the plan_reviewer_fan of the Plan-Review perch
reviewer_model: opus[medium]  # model-spec for the reviewer of every review segment round whose own <segment>_reviewer_model is empty (see contracts/specs/llm-model-spec.md); a YAML list sets one model per round, with the last entry for every later round
fixer_model: opus[medium]  # model-spec for the fixer of every review segment round whose own <segment>_fixer_model is empty (see contracts/specs/llm-model-spec.md); a YAML list sets one model per round, with the last entry for every later round
discussion_reviewer_model: ["opus[medium]", "opus[medium]", "sonnet[high]"]  # model-spec for the Discussion-Review reviewer, one model per round with the last entry serving every later round; the default runs the first two rounds on opus[medium] and later rounds on sonnet[high]; empty takes reviewer_model
discussion_fixer_model: ""  # model-spec for the Discussion-Review fixer; empty, the default, takes fixer_model, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
plan_reviewer_model: ["opus[medium]", "sonnet[high]"]  # model-spec for the Plan-Review reviewer, one model per round with the last entry serving every later round; the default runs the first round on opus[medium] and later rounds on sonnet[high]; empty takes reviewer_model
plan_fixer_model: ""  # model-spec for the Plan-Review fixer; empty, the default, takes fixer_model, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
code_reviewer_model: sonnet[medium]  # model-spec for the Code-Review reviewer, sonnet[medium] by default; empty takes reviewer_model, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
code_fixer_model: sonnet[medium]  # model-spec for the Code-Review fixer, sonnet[medium] by default; empty takes fixer_model, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
discussion_reviewer_fan: ["review-discussion", ""]  # fan name from lenses.yaml that turns the lens fan on for Discussion-Review; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; the default fans round one out over review-discussion and runs later rounds solo; an empty entry runs that round solo
plan_reviewer_fan: ["review-plan", ""]  # fan name from lenses.yaml that turns the lens fan on for Plan-Review; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; the default fans round one out over review-plan and runs later rounds solo; an empty entry runs that round solo
code_reviewer_fan: ["review-code", ""]  # fan name from lenses.yaml, such as review-code, that turns the lens fan on for Code-Review; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; the default fans round one out over review-code and runs later rounds solo; an empty entry runs that round solo
discussion_fixer_fan: fix-discussion  # fan name from lenses.yaml that has the Discussion-Review fixer fork itself once per lens of the fan to check its fixes; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; fix-discussion is the default, and an empty entry runs the single fixer for that round
plan_fixer_fan: fix-plan  # fan name from lenses.yaml that has the Plan-Review fixer fork itself once per lens of the fan to check its fixes; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; fix-plan is the default, and an empty entry runs the single fixer for that round
code_fixer_fan: fix-code  # fan name from lenses.yaml, such as fix-code, that has the Code-Review fixer fork itself once per lens of the fan to check its fixes; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; fix-code is the default, and an empty entry runs the single fixer for that round
judge: sonnet[medium]  # model-spec for every Bouncer row's judge pass, and for its seed pass while seed is empty; discussion_judge, plan_judge and code_judge override it per segment (see contracts/specs/llm-model-spec.md)
seed: ""  # model-spec for every Bouncer row's seed pass; empty takes that segment's resolved judge; discussion_seed, plan_seed and code_seed override it per segment
discussion_judge: ""  # model-spec for the Discussion-Review judge pass; empty takes judge
plan_judge: ""  # model-spec for the Plan-Review judge pass; empty takes judge
code_judge: ""  # model-spec for the Code-Review judge pass; empty takes judge
discussion_seed: ""  # model-spec for the Discussion-Review seed pass; empty takes seed, and seed empty takes the segment's resolved judge
plan_seed: ""  # model-spec for the Plan-Review seed pass; empty takes seed, and seed empty takes the segment's resolved judge
code_seed: ""  # model-spec for the Code-Review seed pass; empty takes seed, and seed empty takes the segment's resolved judge
review_timeout_min: 240  # minutes one review round's shuttle run is allowed to run
friction: sonnet[medium]  # model-spec for the Tier 2 friction-reflection producer (see contracts/specs/llm-model-spec.md); empty turns Tier 2 self-reporting off
friction_timeout_min: 30  # minutes the friction-reflection agent's shuttle run is allowed to run
driver: haiku[medium]  # model-spec for the model that runs an llm-driven run's loom driver session (see contracts/specs/llm-model-spec.md); the llm driver runs only when a hub, a module's driver override, a task's run settings or --driver selects llm, and a hub pins the model back with lym config loom --layer default --set driver=sonnet[medium]; empty defers to the provider default
driver_kind: ""  # overrides shed.yaml's driver_kind for a loom run, llm or go; empty inherits shed.yaml; a seeded run keeps its recorded driver
tackler: ""  # overrides shed.yaml's tackler model-spec for a loom run (see contracts/specs/llm-model-spec.md); empty inherits shed.yaml
tackler_timeout_min: 0  # overrides shed.yaml's tackler_timeout_min for a loom run; 0 inherits shed.yaml
tackler_max_spawns: ~  # overrides shed.yaml's tackler_max_spawns for a loom run; null inherits shed.yaml, and a set 0 turns the tackler off for loom
arbiter: ""  # overrides shed.yaml's arbiter model-spec for a loom run (see contracts/specs/llm-model-spec.md); empty inherits shed.yaml
arbiter_timeout_min: 0  # overrides shed.yaml's arbiter_timeout_min for a loom run; 0 inherits shed.yaml
arbiter_max_spawns: ~  # overrides shed.yaml's arbiter_max_spawns for a loom run; null inherits shed.yaml, and a set 0 turns the arbiter off for loom
step_idle_timeout_min: 60  # minutes a --until-stop step may show no activity (no trace write and no agent activity) before the loop kills it; a value below 1 is raised to 1
review_circling_checkpoint: 3  # first judged round from which a review segment's judge may rule CIRCLING; with review_max_bounces also 3 a run reaches the soft-cap rule at round 3 before a CIRCLING verdict could change the outcome, so lower this for an earlier circling escalation; a value above review_max_bounces means a run never rules CIRCLING and reaches the soft-cap rule instead
review_max_bounces: 3  # bounce budget of every Bouncer review segment's rows (Discussion-Review, Plan-Review, Code-Review); 0 gives every perch without its own budget zero rounds; a spent budget runs the soft-cap rule (the judge's fix tags settle the round, escalating only a stuck run); with review_circling_checkpoint also 3 the soft-cap rule at round 3 comes before a CIRCLING verdict could change the outcome, and lowering the checkpoint gives an earlier circling escalation
review_hard_max_bounces: 4  # hard cap of every Bouncer review segment's rows: a round numbered at or past it is never continued, it is accepted or escalated hard-cap; at least 1 and not below the perch's budget
review_amend_max_bounces: 1  # review rounds an amendment generation gets after a settled review segment's subject changed, clamped to the perch's own budget; 0 settles every amendment approved with no review round; settable per run through run_settings
discussion_max_bounces: 2  # bounce budget of the Discussion-Review perch: N gives N judged Burler rounds, 2 by default; null takes review_max_bounces; 0 runs no review round: the perch's Bouncer settles approved at once; a checkpoint above this budget means the perch never rules CIRCLING and reaches the soft-cap rule, or the accept, instead
plan_max_bounces: ~  # bounce budget of the Plan-Review perch: N gives N judged Burler rounds; null takes review_max_bounces; 0 runs no review round: the perch's Bouncer settles approved at once; a checkpoint above this budget means the perch never rules CIRCLING and reaches the soft-cap rule, or the accept, instead
code_max_bounces: 1  # bounce budget of the Code-Review perch: N gives N judged Burler rounds, 1 by default; null takes review_max_bounces; 0 runs no review round: the perch's Bouncer settles approved at once; a checkpoint above this budget means the perch never rules CIRCLING and reaches the soft-cap rule, or the accept, instead
discussion_hard_max_bounces: 0  # hard cap of the Discussion-Review perch: a round numbered at or past it is never continued, it is accepted or escalated hard-cap; 0 takes review_hard_max_bounces
plan_hard_max_bounces: 0  # hard cap of the Plan-Review perch: a round numbered at or past it is never continued, it is accepted or escalated hard-cap; 0 takes review_hard_max_bounces
code_hard_max_bounces: 0  # hard cap of the Code-Review perch: a round numbered at or past it is never continued, it is accepted or escalated hard-cap; 0 takes review_hard_max_bounces
discussion_auto_accept: false  # true makes the Discussion-Review perch accept a harvested round at a spent budget instead of running the soft-cap rule
plan_auto_accept: false  # true makes the Plan-Review perch accept a harvested round at a spent budget instead of running the soft-cap rule
code_auto_accept: true  # true, the default, makes the Code-Review perch accept a harvested round at a spent budget with its open findings, BLOCKING ones included, instead of running the soft-cap rule; false restores the soft-cap rule
