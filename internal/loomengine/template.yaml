discussion:
  model: opus[medium]  # model-spec for the discussion-phase interview agent (see contracts/specs/llm-model-spec.md)
  timeout_min: 480  # minutes the discussion agent's shuttle run is allowed to run (an autonomous agent exploring a codebase and writing two files can legitimately run long; this is a deadline, not a wait)
  interactive: false  # true runs the discussion-phase agent as an interview in its pane and requires an operator to be present; false, the default, is today's autonomous behaviour, because a task spawned unattended must not silently wait for a human
  advisors: []  # the Discussion-Write advisors, each entry a {name, model} pair: name is the advisor's seat name (a lowercase letter first, then lowercase letters, digits and hyphens) and model its model-spec; an empty list, the default, runs the lead alone, deciding each question itself
  lenses: twill-discussion  # fan name from lenses.yaml that has the Discussion-Write lead fork itself once per lens to review its record before it finishes; twill-discussion is the default, and empty turns the forks off; this names the writer's lens fan, not the loom.discussion.reviewer_fan of the Discussion-Review perch
  gate_fixer: sonnet[medium]  # model-spec for the cold fixer of Discussion-Write's discussion gate, which clears the discussion check's mechanical findings before the writer hears of them; empty turns the fixer off
  reviewer_model: ["opus[medium]", "opus[medium]", "sonnet[high]"]  # model-spec for the Discussion-Review reviewer, one model per round with the last entry serving every later round; the default runs the first two rounds on opus[medium] and later rounds on sonnet[high]; empty takes loom.review.reviewer_model
  fixer_model: ""  # model-spec for the Discussion-Review fixer; empty, the default, takes loom.review.fixer_model, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
  reviewer_fan: ["review-discussion", ""]  # fan name from lenses.yaml that turns the lens fan on for Discussion-Review; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; the default fans round one out over review-discussion and runs later rounds solo; an empty entry runs that round solo
  fixer_fan: fix-discussion  # fan name from lenses.yaml that has the Discussion-Review fixer fork itself once per lens of the fan to check its fixes; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; fix-discussion is the default, and an empty entry runs the single fixer for that round
  assist_reviewer_model: ""  # model-spec for the Discussion-Review assistant, an extra reviewer beside the segment's reviewer whose report the reviewer consolidates, and which never gates the round; one model-spec, or a YAML list with one model-spec per round, the last entry serving every later round; empty, the default, runs no assistant, and an empty entry runs none that round
  assist_reviewer_fan: ""  # fan name from lenses.yaml that turns the lens fan on for the Discussion-Review assistant; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; an empty entry, the default, runs the assistant solo
  judge: ""  # model-spec for the Discussion-Review judge pass; empty takes loom.review.judge
  seed: ""  # model-spec for the Discussion-Review seed pass; empty takes loom.review.seed, and loom.review.seed empty takes the segment's resolved judge
  max_bounces: 2  # bounce budget of the Discussion-Review perch: N gives N judged Burler rounds, 2 by default; null takes loom.review.max_bounces; 0 runs no review round: the perch's Bouncer settles approved at once; a checkpoint above this budget means the perch never rules CIRCLING and reaches the soft-cap rule, or the accept, instead
  hard_max_bounces: 0  # hard cap of the Discussion-Review perch: a round numbered at or past it is never continued, it is accepted or escalated hard-cap; 0 takes loom.review.hard_max_bounces
  auto_accept: false  # true makes the Discussion-Review perch accept a harvested round at a spent budget instead of running the soft-cap rule
  review_ask_parent: false  # true has each Discussion-Review round ask the parent orch to review the decision record beside the reviewer, who keeps every finding the parent returns; false, the default, asks no parent; settable per run through run_settings
  review_parent_timeout_min: 30  # minutes from a Discussion-Review round's ask to the parent orch to its deadline, capped so the reviewer keeps room to consolidate before loom.review.timeout_min; a cap that leaves no room sends no ask; a positive integer, 30 by default; settable per run through run_settings
raddle:
  model: opus[high]  # model-spec for the raddle agent, which proposes how a Sketch splits into tasks (see contracts/specs/llm-model-spec.md)
  auto_approve: false  # true files a raddle proposal once its gate passes, with no operator approval; false, the default, has the agent put the proposal to the operator in its pane; read once, at Raddle-Write's first spawn in a run, and never in a run whose recipe rows hold a split perch
subagent_model: sonnet  # model the Plan, Discussion-Write and darn writers on Claude pass as the model of the fresh subagents they hand lookups to; a writer on Codex runs its subagents on its own model and does not read the key; the loom-template-plan, loom-template-discussion and darn-template-write stencils read it; a bare model name the Agent tool takes, such as sonnet, never a bracketed model-spec; sonnet is the default
review:
  reviewer_model: opus[medium]  # model-spec for the reviewer of every review segment round whose own loom.<segment>.reviewer_model is empty (see contracts/specs/llm-model-spec.md); a YAML list sets one model per round, with the last entry for every later round
  fixer_model: opus[medium]  # model-spec for the fixer of every review segment round whose own loom.<segment>.fixer_model is empty (see contracts/specs/llm-model-spec.md); a YAML list sets one model per round, with the last entry for every later round
  judge: sonnet[medium]  # model-spec for every Bouncer row's judge pass, and for its seed pass while loom.review.seed is empty; loom.discussion.judge and loom.code.judge override it per segment, and tapestry.plan.judge for the plan segment (see contracts/specs/llm-model-spec.md)
  seed: ""  # model-spec for every Bouncer row's seed pass; empty takes that segment's resolved judge; loom.discussion.seed and loom.code.seed override it per segment, and tapestry.plan.seed for the plan segment
  timeout_min: 240  # minutes one review round's shuttle run is allowed to run
  assist_reviewer_timeout_min: 60  # minutes the assistant reviewer's run is allowed to take; capped so the assistant ends before the reviewer's own timeout, loom.review.timeout_min; 0 takes that whole capped room
  circling_checkpoint: 3  # first judged round from which a review segment's judge may rule CIRCLING; with loom.review.max_bounces also 3 a run reaches the soft-cap rule at round 3 before a CIRCLING verdict could change the outcome, so lower this for an earlier circling escalation; a value above loom.review.max_bounces means a run never rules CIRCLING and reaches the soft-cap rule instead
  stalemate_rounds: 2  # unchanged review rounds in a row that escalate a stalemate: a round whose fixer answered every finding and left the review target as the round found it counts as unchanged; 0 turns the check off
  max_bounces: 3  # bounce budget of every Bouncer review segment's rows (Discussion-Review, Plan-Review, Code-Review, Raddle-Review); 0 gives every perch without its own budget zero rounds; a spent budget runs the soft-cap rule (the judge's fix tags settle the round, escalating only a stuck run); with loom.review.circling_checkpoint also 3 the soft-cap rule at round 3 comes before a CIRCLING verdict could change the outcome, and lowering the checkpoint gives an earlier circling escalation
  hard_max_bounces: 4  # hard cap of every Bouncer review segment's rows: a round numbered at or past it is never continued, it is accepted or escalated hard-cap; at least 1 and not below the perch's budget
  amend_max_bounces: 1  # review rounds an amendment generation gets after a settled review segment's subject changed, clamped to the perch's own budget; 0 settles every amendment approved with no review round; settable per run through run_settings
code:
  reviewer_model: sonnet[medium]  # model-spec for the Code-Review reviewer, sonnet[medium] by default; empty takes loom.review.reviewer_model, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
  fixer_model: sonnet[medium]  # model-spec for the Code-Review fixer, sonnet[medium] by default; empty takes loom.review.fixer_model, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
  reviewer_fan: ["review-code", ""]  # fan name from lenses.yaml, such as review-code, that turns the lens fan on for Code-Review; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; the default fans round one out over review-code and runs later rounds solo; an empty entry runs that round solo
  fixer_fan: fix-code  # fan name from lenses.yaml, such as fix-code, that has the Code-Review fixer fork itself once per lens of the fan to check its fixes; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; fix-code is the default, and an empty entry runs the single fixer for that round
  assist_reviewer_model: ""  # model-spec for the Code-Review assistant, an extra reviewer beside the segment's reviewer whose report the reviewer consolidates, and which never gates the round; one model-spec, or a YAML list with one model-spec per round, the last entry serving every later round; empty, the default, runs no assistant, and an empty entry runs none that round
  assist_reviewer_fan: ""  # fan name from lenses.yaml that turns the lens fan on for the Code-Review assistant; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; an empty entry, the default, runs the assistant solo
  judge: ""  # model-spec for the Code-Review judge pass; empty takes loom.review.judge
  seed: ""  # model-spec for the Code-Review seed pass; empty takes loom.review.seed, and loom.review.seed empty takes the segment's resolved judge
  max_bounces: 1  # bounce budget of the Code-Review perch: N gives N judged Burler rounds, 1 by default; null takes loom.review.max_bounces; 0 runs no review round: the perch's Bouncer settles approved at once; a checkpoint above this budget means the perch never rules CIRCLING and reaches the soft-cap rule, or the accept, instead
  hard_max_bounces: 0  # hard cap of the Code-Review perch: a round numbered at or past it is never continued, it is accepted or escalated hard-cap; 0 takes loom.review.hard_max_bounces
  auto_accept: true  # true, the default, makes the Code-Review perch accept a harvested round at a spent budget with its open findings instead of running the soft-cap rule; a round with an open BLOCKING finding is never accepted this way but escalates to the run's parent, which accepts it or orders another round; false restores the soft-cap rule
  review_ask_parent: false  # true has every Code-Review round ask the parent orch to review the task's code change once the round's fixer report exists and before its Bouncer judges the round, naming the round's own review and fixer report, so the parent sees each ruling; the Bouncer's judge waits for the answer and keeps every finding the parent returns; false, the default, asks no parent; settable per run through run_settings
  review_parent_timeout_min: 30  # minutes from a Code-Review round's ask to the parent orch to its deadline, capped so the Bouncer's judge, which waits for the answer, keeps room to finish before its own timeout, run_timeout_min; a cap that leaves no room sends no ask; a positive integer, 30 by default; settable per run through run_settings
split:
  reviewer_model: ""  # model-spec for the reviewer of the split perch, the arras recipe's Raddle-Review perch over the raddle proposal; empty, the default, takes loom.review.reviewer_model, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
  fixer_model: ""  # model-spec for the split perch's cold fixer; empty, the default, takes the model of loom.raddle.model, so the split is fixed by a model of the raddle agent's strength; a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it
  reviewer_fan: ""  # fan name from lenses.yaml that turns the lens fan on for the split perch's reviewer; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; an empty entry, the default, runs that round solo
  fixer_fan: ""  # fan name from lenses.yaml that has the split perch's fixer fork itself once per lens of the fan to check its fixes; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; an empty entry, the default, runs the single fixer for that round
  judge: ""  # model-spec for the split perch's judge pass; empty takes loom.review.judge, and its seed pass takes loom.review.seed, or this judge while loom.review.seed is empty
  max_bounces: 2  # bounce budget of the split perch: N gives N judged Burler rounds over each new raddle proposal, 2 by default; null takes loom.review.max_bounces; 0 runs no review round: the perch's Bouncer settles approved at once and the proposal is filed unreviewed
  hard_max_bounces: 0  # hard cap of the split perch: a round numbered at or past it is never continued, it is accepted or escalated hard-cap; 0 takes loom.review.hard_max_bounces
  auto_accept: false  # true makes the split perch accept a harvested round at a spent budget with its open findings instead of running the soft-cap rule, and its approval files the proposal; false, the default, runs the soft-cap rule
friction:
  model: sonnet[medium]  # model-spec for the Tier 2 friction-reflection producer (see contracts/specs/llm-model-spec.md); empty turns Tier 2 self-reporting off
  timeout_min: 30  # minutes the friction-reflection agent's shuttle run is allowed to run
driver: haiku[medium]  # model-spec for the model that runs an llm-driven run's loom driver session (see contracts/specs/llm-model-spec.md); the llm driver runs only when a hub, a module's driver override, a task's run settings or --driver selects llm, and a hub pins the model back with lym config loom --layer default --set driver=sonnet[medium]; empty defers to the provider default
step_idle_timeout_min: 60  # minutes a --until-stop step may show no activity (no trace write and no agent activity) before the loop kills it; a step at a row waiting on the operator (Beam-Await, PR-Review, Sampler-Session) reads as active and is never killed; a value below 1 is raised to 1
notify_parent_on: []  # recipe row names, such as ["Drift-Verify"], whose start lym mails the run's parent orch as a [row reached] line from LOOM, once each time the run reaches the row and again on a re-call after an escalation's answer or a resumed halt, so the parent can brief the row's agent; a row the run skips sends none, and a name that is no row of the run's recipe refuses the run's steps, naming the recipe's rows; an empty list, the default, mails nothing; settable per run through run_settings
