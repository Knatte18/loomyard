# The top-level operator shortcuts of lym, embedded in the binary.
# Each key is a shortcut name, mounted as `lym <name>`.
# Each value is one argv, a list of words, or a list of argvs run in order.
# An argv names lym words only, never a shell string: a command path, then any args and flags of that command.
# A shortcut is added only by a commit to this file.
a: [reed, attach]
s: [[beam, start], [reed, attach]]
p: [tender, pause]
r: [tender, resume]
