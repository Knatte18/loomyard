driver_kind: go  # the driver a shed run is seeded with when nothing typed one: llm or go; go is the template default, and llm is selected by a hub, a module's own driver_kind, a task's run settings or the run's --driver; a seeded run keeps its recorded driver
tackler: haiku  # model-spec for the tackler, the cold agent a Go driver asks to settle a stop its rules do not (see contracts/specs/llm-model-spec.md); a module's own tackler overrides it
tackler_timeout_min: 10  # minutes one tackler spawn is allowed to run; 0 takes 10; a module's own positive value overrides it
tackler_max_spawns: 4  # tackler spawns a run may use; 0 turns the tackler off, so every stop it would take hands back; a module's own set value, 0 included, overrides it
arbiter: opus[high]  # model-spec for the arbiter, the agent that judges a stop the tackler escalates or cannot settle (see contracts/specs/llm-model-spec.md); a module's own arbiter overrides it
arbiter_timeout_min: 30  # minutes one arbiter spawn is allowed to run; 0 takes 30; a module's own positive value overrides it
arbiter_max_spawns: 3  # arbiter spawns a run may use; 0 turns the arbiter off, so every stop it would take hands back; a module's own set value, 0 included, overrides it
