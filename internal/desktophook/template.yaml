window_command: ""  # shell command run after lym opens a desktop window (a run's terminal window, lym reed window, lym ide), such as a tiling script that snaps the new window into the active desktop's grid; empty runs nothing; set it per machine with `lym config desktop --layer machine --set window_command=<value>` from the prime
window_wait_ms: 1500  # milliseconds lym waits after opening a window before it runs window_command, so the command sees the new window

buttons:  # status-bar buttons a machine adds, appended after reed's of the same place, in the groups task, beam and prime; set them in <BoltDir>/.lym/config/desktop.machine.yaml by hand or with `lym config desktop --layer machine --edit`
  task: []
  beam: []
  prime: []
