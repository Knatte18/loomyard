max_runs: 3  # the most runs of this beam's tasks dobby drives at once; 0 starts none
board_tidy_every: 5  # dobby starts the board-tidy agent after this many landings; 0 never tidies
board_tidy_timeout_min: 30  # the minutes the board-tidy agent may run before dobby gives up on it
task_headroom: 500  # the fewest free tasks under the cgroup task limit (pids.max) for dobby to start a run; 0 never holds a start
pull_request: "review"  # per task: whether a task's landing goes through a GitHub pull request: review (one that waits, whatever beam.autonomy says, with a PR-Review agent session in the task's window, until the operator approves or merges it on GitHub or lym loom pr-continue ends the review on the operator's word), off (none, unless GitHub's rules for the parent branch require one), trail (always, squash-merged on GitHub at once with no agent and no review, so the parent keeps a trail of pull requests to backtrack through) or merge-in (none, a true merge keeping the merged commit); the task's run_settings, else the nearest worktree up to the prime that sets it, else the hub's default decides
land_notice: "off"  # per task: whether dobby posts a line to the orch once a task's run lands or ends without landing: on or off; decided like beam.pull_request
autonomy: false  # per task: whether the orch settles every halt of the task's runs and reaches the operator only for a severe halt or a merge-ready beam: true or false; decided like beam.pull_request
adopt_fix_tries: 3  # the most adopt fix tasks a failed adopt check files for this worktree's subject between two hand adopts; 0 files none
run_watch: "stops"  # per task: which changes of a task's run dobby mails the orch as a `[run watch]` line: stops, rows or off; decided like beam.pull_request
gate_hold_factor: 1.5  # dobby notices a gate slot a run holds past this many times its tier's gate.tiers.<tier>.timeout_min, in awake time; 0 sends no gate-hold notice
gate_hold_min: 90  # the minutes the gate-hold bound is for a holder with no tier or a tier with no gate.tiers.<tier>.timeout_min; at least 1
