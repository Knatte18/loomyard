what_went_wrong: >-
  Nothing in the first four turn ends: each lists the running batch fork in background_tasks and reads waiting.
  The last turn end lists only a shell the batch 10 fork left running after it returned;
  the old code counted that turn end once the shell passed background_shell_wait_min and read it as asking, the outcome the run directory still records.
