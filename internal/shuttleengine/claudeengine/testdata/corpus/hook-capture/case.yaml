  - {state: busy, cause: turn}
  - {state: asking, cause: ask}
  - {state: idle-stalled, cause: no-output}
  - {state: unknown, cause: clear}
  - {state: idle-fresh, cause: session-start}
  - {state: busy, cause: turn}
