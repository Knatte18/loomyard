run_dir: ${env:LYM_SHUTTLE_RUN_DIR:-}  # per-run directory root, resolved by shuttle's own runDirRoot (rundir.go); empty resolves to <anchor>/.lym/shuttle, and a RELATIVE value resolves against that same <anchor> — the ANCHOR path, never the worktree root, which are different directories in a subpath-anchored worktree (.lym is the anchor-side sibling of _lym, and it is where reed keeps the reed.json this sweep reads); must stay worktree-LOCAL — the orphan sweep checks run dirs against this worktree's reed.json only, so a root shared across worktrees would sweep the other worktrees' kept run dirs as orphans
poll_interval_ms: 1000  # milliseconds between polls of a run's completion state; a value below 1000 is floored to 1000 with one warning (an unfloored 0 would silently busy-spin the wait loop)
liveness_every_n_polls: 10  # how often (in polls) to check pane liveness alongside the completion file; the same multiple of poll_interval_ms also spaces startup-gate dismissals and caps the startup probe's backoff
run_timeout_min: 30  # minutes before an in-progress run is classified as timed out; 0 is NOT "unlimited" — it times out immediately
startup_timeout_s: 90  # seconds allowed for the claude process to start and reach a live pane; 0 is NOT "unlimited" or "disabled" — it fast-fails startup as died immediately AND zeroes the orphan-sweep age guard (minAge = 2x this value)
start_retries: 1  # extra launches of a start whose provider died before it took its first input and whose strand the teardown removed, each in a fresh run directory; a timed-out start and one whose strand could not be removed are never retried; 0 turns the retry off, negative is a config error
background_shell_wait_min: 10  # minutes an outstanding background shell of either signal may run before the wait logs it once and shows it in the wait marker; it also expires an ungated waiting turn end with an output file missing, whose every outstanding task is a non-awaited shell, into a held turn end, while a fork or an awaited shell never expires; 0 or negative is a config error, not "unlimited"
send_ready_timeout_s: 60  # seconds a verified send (the start prompt, a skill-load message and every injected prompt) waits for an idle session before it fails as busy, ending at the run's deadline for a gate send; binds only an engine that reads session idleness, any other keeps a ready-pane check with no wait; 0 or negative is a config error
submit_confirm_timeout_s: 30  # seconds from the moment a verified send begins typing within which it must be seen to land before it fails as not landed, ending at the run's deadline for a gate send; binds only an engine that reads its input box, any other has no window; 0 or negative is a config error
submit_settle_ms: 300  # milliseconds between the two input-box reads that must agree before a verified send's Enter, so typed text has finished arriving and Claude Code does not swallow the Enter as part of a paste; it paces the two box reads before the Enter of the no-Enter paste variant and of a typing engine; 0 reads back to back, negative is a config error
submit_redraw_settle_ms: 300  # milliseconds for the first step of the doubling interval at which the input box is read after an Enter to confirm the send, so Claude Code has redrawn it; 0 reads at once, negative is a config error
engine: claude  # the engine for a spec that names none; must be a registered engine name, and an empty value is a config error
deny_python: true  # switches the python guard of internal/shellguard's table for every engine: a deny for the python interpreter (python, python3, python3.<minor>, optionally path-prefixed) run as a shell command in every lym-spawned session; on by default, turn it off in a Python target repo
