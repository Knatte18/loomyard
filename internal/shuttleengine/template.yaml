run_dir: ${env:LYX_SHUTTLE_RUN_DIR:-}  # per-run directory root, resolved by shuttle's own runDirRoot (rundir.go); empty resolves to <anchor>/.lyx/shuttle, and a RELATIVE value resolves against that same <anchor> — the ANCHOR path, never the worktree root, which are different directories in a subpath-anchored worktree (.lyx is the anchor-side sibling of _lyx, and it is where reed keeps the reed.json this sweep reads); must stay worktree-LOCAL — the orphan sweep checks run dirs against this worktree's reed.json only, so a root shared across worktrees would sweep the other worktrees' kept run dirs as orphans
poll_interval_ms: 500  # milliseconds between polls of a run's completion state; 0 or negative is floored back to 500 (an unfloored 0 would silently busy-spin the wait loop)
liveness_every_n_polls: 10  # how often (in polls) to check pane liveness alongside the completion file
run_timeout_min: 30  # minutes before an in-progress run is classified as timed out; 0 is NOT "unlimited" — it times out immediately
startup_timeout_s: 90  # seconds allowed for the claude process to start and reach a live pane; 0 is NOT "unlimited" or "disabled" — it fast-fails startup as died immediately AND zeroes the orphan-sweep age guard (minAge = 2x this value)
background_shell_wait_min: 10  # minutes a turn end waits on an outstanding background shell before it counts as a turn end, forks and declared shells excepted; 0 or negative is a config error, not "unlimited"
submit_settle_ms: 300  # milliseconds between typed text and the Enter that submits it (the /clear, /compact and /model commands and every injected prompt); Claude Code reads a fast burst as a paste and swallows an Enter inside it, so too low a value loses submissions while a high one delays every injected prompt; 0 sends the Enter immediately, negative is a config error
submit_redraw_settle_ms: 300  # milliseconds to wait after an Enter before the input box is read to confirm the send, so Claude Code has redrawn it; 0 reads at once, negative is a config error
claude: ${env:LYX_SHUTTLE_CLAUDE:-}  # path to the claude executable; empty falls back to "claude" on PATH — prefer an explicit path, PATH aliases can hit the 0-byte WindowsApps stub
claude_deny_agent_tool: true  # emit a PreToolUse deny for the in-process Agent tool
claude_deny_ask_user_question: true  # emit a PreToolUse deny for the AskUserQuestion tool (autonomous runs only)
claude_prompt_cache_ttl: 5m  # prompt-cache TTL for every role without an entry in claude_prompt_cache_ttl_roles; Claude Code's own values, validated when a run starts, and the refusal names the accepted ones
claude_prompt_cache_ttl_roles:  # prompt-cache TTL per role, keyed by a strand's role segment (Spec.Role); the operator's own map, replacing the template's whole when present, so leaving a role out drops it to the default; values are Claude Code's, validated when a run starts, and the refusal names the accepted ones
  driver: 1h
  webster: 1h
