binary: ""  # path to the codex executable; empty falls back to "codex" on PATH; the binary must be Codex or exec it, since a wrapper that does not exec leaves its shell in the foreground and reed reads the strand dead
home: ~/.lym/codex  # the shared lym Codex home every Codex launch runs under as CODEX_HOME: lym renders its config.toml whole on each launch and links its auth.json and sessions to those under codex.operator_home; a leading ~/ is the user's home directory
operator_home: ~/.codex  # the operator's own Codex home, which lym never writes; the lym home links its auth.json and sessions here, so one login and its token refresh serve both
efforts: [low, medium, high]  # the reasoning efforts a Codex launch may take; a run whose model-spec names another effort is refused when it starts
skill_roots: [~/.claude/plugins/cache]  # the directories a skill <plugin>:<name> is looked up under, newest version first, when a Codex session loads skills; a leading ~/ is the user's home directory
sandbox_mode: auto  # the sandbox every Codex launch runs in: workspace-write bounds the session's writes to the workspace, the codex.writable_roots folders and the temporary folders, and refuses the launch, naming the cause, when Codex's sandbox cannot start on the machine; danger-full-access runs it with no sandbox, as a Claude seat runs; auto probes Codex's sandbox at each launch and runs workspace-write when it starts, danger-full-access with a warning when it refuses to start, and refuses the launch when the probe itself cannot run (a missing executable, a timeout), as on a machine whose bubblewrap may not create a user namespace (Ubuntu's AppArmor restriction of unprivileged user namespaces; every shell command would fail with "bwrap: setting up uid map: Permission denied"); pin it on one machine with lym config codex --layer machine from the hub's prime worktree; a local override may not set it
writable_roots: [~/.cache/go-build]  # folders outside the workspace every Codex session's sandbox may write, such as a build cache, besides the records checkout and the checkout's git dirs lym adds itself; a leading ~/ is the user's home directory, a folder that does not exist is left out, and a local override may not set it
max_subagent_threads: 16  # the most child agents one Codex session runs at once; it raises Codex's default cap of three concurrent children per session, which stalls a session that fans out wider; at least 1
plugin_hook_timeout: 10s  # the longest each plugin SessionStart hook runs when a Codex launch collects the context of the plugins the session scope turns on, unless the hook sets its own timeout; a Go duration above zero
batching_nudge:  # the after-tool-call hook that adds one line to the calling thread's context when its recent top-level calls break the batching rules, and never denies a call; one exec cell counts as one call; read when a run starts, so a running session keeps the values it started with; a value below its least refuses the load while the hook is on
  enabled: true  # install the hook on every Codex launch; false installs none
  lookup_chain: true  # nudge a run of consecutive exec cells that each ran exactly one shell command, a read-only lookup such as grep, find, ls, cat, sed -n or a git read
  read_slice: true  # nudge a shell command that prints a line range of one file, such as sed -n with a range or head or tail with a count, of a file under codex.batching_nudge.slice_lines lines, or of a file an earlier exec cell read and that has not changed since
  edit_chain: true  # nudge a run of consecutive exec cells that each ran only apply_patch calls
  context_tokens: 150000  # the calling thread's own context size, in tokens, below which the hook stays silent; at least 0
  lookup_run: 3  # the number of consecutive single-lookup exec cells that fires; at least 1
  edit_run: 2  # the number of consecutive apply_patch-only exec cells that fires; at least 1
  slice_lines: 2000  # the line count under which a line-range read of a file fires; at least 1
  max_nudges: 5  # the most nudges each thread of a run, the session's and each child's, gets, so a session that ignores the line is not nagged on every turn; at least 1
