# profiles.yaml — the hub's named run profiles, and the profile each recipe takes by default.
# Each top-level key but defaults is a profile name, and its value holds one block per recipe, tapestry, motif, darn, pawl or sampler;
# a block has the shape of a board task's run_settings: module name to that module's config keys.
# A task names a profile in its board entry's profile field, or takes its recipe's entry under defaults when it names none;
# batten's Seed-Child writes the block of the recipe the task runs into the pair's local config, with the task's own run_settings layered on top.
# Each perch's hard cap is its rounds plus one, so `lym loom circling continue` can grant one more round.
#
# Seeded once when this file is absent; after that it is operator-owned.
# The hub reconcile after a lym upgrade carries a template change into it only where it still holds lym's earlier value, kept in profiles.template-base beside it:
# a value you set, added or removed stays yours, and one the new template holds otherwise is reported under differs.
# Reconcile also renames a block held under a recipe's former name, and lists a former block left beside a differing current one under unsettled.
# Add or replace a profile, or the defaults, with: lym config profiles --set <name>='<json object>'
# Remove one by deleting its block in the editor: lym config profiles

defaults:
  tapestry: solid
  motif: solid
  darn: light
  pawl: light
speed:
  tapestry:
    loom: {discussion_max_bounces: 0, discussion_hard_max_bounces: 1, plan_max_bounces: 0, plan_hard_max_bounces: 1, code_max_bounces: 1, code_hard_max_bounces: 2, code_reviewer_fan: ""}
  motif:
    loom: {discussion_max_bounces: 0, discussion_hard_max_bounces: 1}
  darn:
    loom: {code_max_bounces: 0, code_hard_max_bounces: 1}
  pawl:
    loom: {code_max_bounces: 0, code_hard_max_bounces: 1}
  sampler:
    loom: {code_max_bounces: 0, code_hard_max_bounces: 1}
light:
  tapestry:
    loom: {discussion_max_bounces: 1, discussion_hard_max_bounces: 2, plan_max_bounces: 1, plan_hard_max_bounces: 2, code_max_bounces: 1, code_hard_max_bounces: 2}
  motif:
    loom: {discussion_max_bounces: 1, discussion_hard_max_bounces: 2}
  darn:
    loom: {code_max_bounces: 1, code_hard_max_bounces: 2}
  pawl:
    loom: {code_max_bounces: 1, code_hard_max_bounces: 2}
  sampler:
    loom: {code_max_bounces: 1, code_hard_max_bounces: 2}
    sampler: {code_review: true}
solid:
  tapestry:
    loom: {discussion_max_bounces: 2, discussion_hard_max_bounces: 3, plan_max_bounces: 2, plan_hard_max_bounces: 3, code_max_bounces: 1, code_hard_max_bounces: 2}
  motif:
    loom: {discussion_max_bounces: 2, discussion_hard_max_bounces: 3}
  darn:
    loom: {code_max_bounces: 2, code_hard_max_bounces: 3}
  pawl:
    loom: {code_max_bounces: 2, code_hard_max_bounces: 3}
  sampler:
    loom: {code_max_bounces: 2, code_hard_max_bounces: 3}
    sampler: {code_review: true}
wide:
  tapestry:
    loom: {discussion_max_bounces: 3, discussion_hard_max_bounces: 4, plan_max_bounces: 2, plan_hard_max_bounces: 3, code_max_bounces: 1, code_hard_max_bounces: 2}
  motif:
    loom: {discussion_max_bounces: 3, discussion_hard_max_bounces: 4}
  darn:
    loom: {code_max_bounces: 3, code_hard_max_bounces: 4}
  pawl:
    loom: {code_max_bounces: 3, code_hard_max_bounces: 4}
  sampler:
    loom: {code_max_bounces: 3, code_hard_max_bounces: 4}
    sampler: {code_review: true}
docs:
  darn:
    darn: {writer: "sonnet[medium]"}
    loom: {code_max_bounces: 1, code_hard_max_bounces: 2, code_reviewer_fan: ""}
