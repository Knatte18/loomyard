slots: 2  # how many gate builds and test runs the hub executes at once; a lowered count takes effect on the next acquire while a running holder finishes
go_parallel: 4  # the -p cap every slotted run gets in its GOFLAGS, bounding the packages one go command builds and tests in parallel
busy_quit_sec: 120  # seconds a Go test binary under lyx gate test may keep a CPU core at least 90 percent busy before it gets one SIGQUIT and dumps its goroutine stacks; 0 turns the watchdog off; raise it for a package that is CPU-bound but healthy
