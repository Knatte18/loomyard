slots: 2  # how many gate builds and test runs the hub executes at once; a lowered count takes effect on the next acquire while a running holder finishes
busy_quit_sec: 120  # seconds a Go test binary under lym gate test may keep a CPU core at least 90 percent busy before it gets one SIGQUIT and dumps its goroutine stacks; 0 turns the watchdog off; raise it for a package that is CPU-bound but healthy
memory_quit_mb: 4096  # megabytes a Go test binary that lym gate test runs may hold, with every process it starts, before the memory guard kills them all and names its package; the guard also kills the largest test binary of 1024 MB or more once the memory limit lym sits under has less than a tenth left; 0 turns the guard off
fixer_timeout_min: 30  # minutes a cold gate fixer may run before the call that spawned it stops waiting; it bounds the card gate's fixer and the row gate fixers, and webster's fix-verify keeps webster.recovery_timeout_min
plan_tier0_budget_sec: 60  # seconds a plan's new and changed tier0 tests may add to one tier0 run; the planner states each card's estimate in its test Intent and the plan review flags a plan past it; 0 sets no budget

# The hub's test tiers, keyed tier0, tier1, and so on; the template declares none.
# A tier is written whole with one flow mapping: lym config gate --set 'tiers.tier0={command: "go test -json {targets} {args}", all_targets: ./..., timeout_min: 60, counter: go-json}'
# A gate.tiers.<tier> entry holds command (with {targets}, {test_targets}, {parallel}, {args} and {test_timeout} placeholders; {test_targets} is {targets} narrowed to the packages holding a test of the tier, for go test), timeout_min (at least 1) and counter (go-json or vstest), and all_targets when the command holds {targets} or {test_targets}.
# It may also hold about, dir (absolute or relative to the worktree root, the base drift.capture.dir uses too; default the worktree's anchor; a hub write refuses one that is no existing directory in the prime), env, parallel (at least 1, default 1), covers (lower tier numbers its command runs anyway), slots (a count of at least 1, or all; default 1), prebuilt_lym and manual (true keeps a tier above tier0 out of lym gate test --upto, so it runs only when --tier names it).
# Five more keys: filter (the tier's own test-filter expression, allowed only when the command holds {filter}), shared_build (true runs the hub's gate.build step first, once per call), carry (false keeps a green run from being carried over an unchanged tree; default true), test_timeout_min (the minutes {test_timeout} renders as, such as 20m for go test -timeout {test_timeout}, at least 1, allowed only when the command holds {test_timeout}; default 20) and memory_mb (the megabytes the tier's command may hold with every process it starts, its builds and test binaries together, before the kernel kills the largest of them and the run fails; at least 1; default uncapped; on a host whose user manager cannot cap a scope, each process gets memory_mb alone as its data segment limit, nothing is killed and no cap line prints).
# A tier with counter vstest and {args} in its command may hold results: trx, which makes the gate put the options that write a TRX results file at the front of {args} and take the run's counts, failed tests and a crashed test host's cause from that file; a call's own words after -- may then hold no results directory and no trx logger.
# Inside the mapping a value holding a brace, comma or bracket is a double-quoted string.
# One key of a declared tier is set alone with its dotted path: lym config gate --set tiers.tier0.env.LYM_TEST_TIER=0
tiers: {}

# gate.gates maps a gate key to the tiers that site runs and the scope it runs them over, written {tiers: [<n>...], scope: card|diff|all|marked}.
# The keys lym reads: card and batch (scope card, the cards' packages and the packages that depend on them; a batch tier above tier0 that does not cover tier0 runs the cards' packages alone), webster, parent-align, finalize and adopt (scope all, the whole tree, or no tier once gate.inert_paths is set and every changed file matches it), webster-fix, darn-write, code-burler-fix, harden-burler-fix, harden-live and pr-review (scope diff, the diff from the merge base), and upkeep (scope marked, run under the go scoper by the board-tidy agent on the main branch).
# Under the go scoper a Go test marked //lym:only <key>... runs only in a --gate call whose key the marker names, and a call without --gate; every other key's call skips it.
# Scope marked runs only the tests marked for the key, each under its file's tier whatever tiers the key lists, so gate.gates.upkeep needs no tier1 to run marked tier1 tests; a manual tier's marked tests run only when the key lists that tier or one that covers it; a marked test of a manual tier the key names in neither way or of a tier the hub does not declare, and a key no test is marked for, refuse the call.
# The two harden keys name tier 0, the tier a key may name before the hub declares more, so a hardener run needs no gate write; a hub whose live tests sit in a higher tier may point harden-live at one tier below tier3, since the run's concurrent copies call runs that same key.
# The scope card is only for the card and batch keys.
# The darn-write key's scope is not card and its tiers all hold {args} in their command, since the darn writer's measuring call passes the words that select one test class there.
# A key may also hold lints, the lint steps its call runs after the tiers against HEAD: comments (fixed-column-wrapped breaks and over-long lines in // comments) and pattern (PATTERN.md grown past its headroom line).
# The card key alone may also hold fixer, a model-spec such as sonnet[medium]: the cold fixer an agent's red lym gate test --gate card call hands its failures to; "" turns it off.
# No tier list may be empty.
# While gate.tiers is empty, every key runs with nothing to run; once any tier is declared, each tier a key names must be declared too.
gates:
  card: {tiers: [0], scope: card, lints: [comments, pattern], fixer: "sonnet[medium]"}
  batch: {tiers: [0], scope: card}
  webster: {tiers: [0], scope: all}
  parent-align: {tiers: [0], scope: all}
  finalize: {tiers: [0], scope: all}
  adopt: {tiers: [0], scope: all}
  webster-fix: {tiers: [0], scope: diff}
  darn-write: {tiers: [0], scope: diff}
  code-burler-fix: {tiers: [0], scope: diff}
  harden-live: {tiers: [0], scope: diff}
  harden-burler-fix: {tiers: [0], scope: diff}
  pr-review: {tiers: [0], scope: diff}
  upkeep: {tiers: [0], scope: marked}

# How a computed, base or card scope maps to {targets}: go derives the impacted Go packages per module, dotnet derives the impacted C# test projects and classes from the type-name closure over test classes, none runs every tier whole.
scoper: none

# The build a gate.tiers.<tier> entry with shared_build runs once per call; {} declares none.
# It holds command and timeout_min (at least 1), and may hold about, dir (absolute or relative to the worktree root; default the worktree's anchor; a hub write refuses one that is no existing directory in the prime) and env.
build: {}

# Glob patterns of files no test reads, such as "*.md" or "docs/*": a pattern without a slash matches the file's base name, one with a slash the whole worktree-relative path.
# A diff of inert files alone runs no tier.
inert_paths: []

# Command prefixes the shell guard refuses, each one or more words of letters, digits, dot, underscore and dash separated by single spaces, such as "go test".
refuse_raw: []

# This machine's parallel for a tier, tier name to a count of at least 1; it beats gate.tiers.<tier>.parallel.
# Set it inside a hub with lym config gate --layer machine --set tier_parallel.tier0=2, and in a standalone worktree, which has no machine layer, with plain lym config gate.
tier_parallel: {}
