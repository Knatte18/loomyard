slots: 2  # how many gate builds and test runs the hub executes at once; a lowered count takes effect on the next acquire while a running holder finishes
busy_quit_sec: 120  # seconds a Go test binary under lym gate test may keep a CPU core at least 90 percent busy before it gets one SIGQUIT and dumps its goroutine stacks; 0 turns the watchdog off; raise it for a package that is CPU-bound but healthy
fixer_timeout_min: 30  # minutes a cold gate fixer may run before the call that spawned it stops waiting; it bounds the card gate's fixer and the row gate fixers, and webster's fix-verify keeps its own recovery_timeout_min

# The hub's test tiers, keyed tier0, tier1, and so on; the template declares none.
# A tier is written whole with one flow mapping: lym config gate --set 'tiers.tier0={command: "go test -json {targets} {args}", all_targets: ./..., timeout_min: 60, counter: go-json}'
# It holds command (with {targets}, {test_targets}, {parallel}, {args} and {test_timeout} placeholders; {test_targets} is {targets} narrowed to the packages holding a test of the tier, for go test), timeout_min (at least 1) and counter (go-json or vstest), and all_targets when the command holds {targets} or {test_targets}.
# It may also hold about, dir (absolute or relative to the worktree root, the base drift.yaml's dir uses too; default the worktree's anchor; a hub write refuses one that is no existing directory in the prime), env, parallel (at least 1, default 1), covers (lower tier numbers its command runs anyway), slots (a count of at least 1, or all; default 1), prebuilt_lym and manual (true keeps a tier above tier0 out of lym gate test --upto, so it runs only when --tier names it).
# Four more keys: filter (the tier's own test-filter expression, allowed only when the command holds {filter}), shared_build (true runs the hub's build step first, once per call), carry (false keeps a green run from being carried over an unchanged tree; default true) and test_timeout_min (the minutes {test_timeout} renders as, such as 20m for go test -timeout {test_timeout}, at least 1, allowed only when the command holds {test_timeout}; default 20).
# Inside the mapping a value holding a brace, comma or bracket is a double-quoted string.
# One key of a declared tier is set alone with its dotted path: lym config gate --set tiers.tier0.env.LYM_TEST_TIER=0
tiers: {}

# Gate key to the tiers that site runs and the scope it runs them over, written {tiers: [<n>...], scope: card|diff|all}.
# The keys lym reads: card and batch (scope card, the card's own packages), webster, parent-align, finalize and adopt (scope all, the whole tree), and webster-fix, darn-write, code-burler-fix and pr-review (scope diff, the diff from the merge base).
# The scope card is only for the card and batch keys.
# A key may also hold lints, the lint steps its call runs after the tiers against HEAD: comments (fixed-column-wrapped breaks and over-long lines in // comments) and pattern (PATTERN.md grown past its headroom line).
# The card key alone may also hold fixer, a model-spec such as sonnet[medium]: the cold fixer an agent's red lym gate test --gate card call hands its failures to; "" turns it off.
# No tier list may be empty, and a tier a key names must be declared above when the gate runs.
gates:
  card: {tiers: [0], scope: card, lints: [comments, pattern], fixer: "sonnet[medium]"}
  batch: {tiers: [0], scope: card}
  webster: {tiers: [0], scope: all}
  parent-align: {tiers: [0], scope: all}
  finalize: {tiers: [0], scope: all}
  adopt: {tiers: [0], scope: all}
  webster-fix: {tiers: [0], scope: diff}
  darn-write: {tiers: [0], scope: diff}
  code-burler-fix: {tiers: [0], scope: diff}
  pr-review: {tiers: [0], scope: diff}

# How a computed, base or card scope maps to {targets}: go derives the impacted Go packages per module, dotnet derives the impacted C# test projects and classes from the type-name closure over test classes, none runs every tier whole.
scoper: none

# The build a tier with shared_build runs once per call; {} declares none.
# It holds command and timeout_min (at least 1), and may hold about, dir (absolute or relative to the worktree root; default the worktree's anchor; a hub write refuses one that is no existing directory in the prime) and env.
build: {}

# Glob patterns of files no test reads, such as "*.md" or "docs/*": a pattern without a slash matches the file's base name, one with a slash the whole worktree-relative path.
# A diff of inert files alone runs no tier.
inert_paths: []

# Command prefixes the shell guard refuses, each one or more words of letters, digits, dot, underscore and dash separated by single spaces, such as "go test".
refuse_raw: []

# This machine's parallel for a tier, tier name to a count of at least 1; it beats the tier's own parallel.
# Set it inside a hub with lym config gate --layer machine --set tier_parallel.tier0=2, and in a standalone worktree, which has no machine layer, with plain lym config gate.
tier_parallel: {}
