packages: []  # worktree-relative directories of the packages the campaign drives against its throwaway sandbox hubs, one list entry per package; an empty list halts a hardener run at Preflight
llm_driving: false  # whether the live tests drive a billed LLM session, which turns the concurrent copies of the live gate off
max_bounces: 7  # the soft cap of review rounds of the campaign; 0 means no review round
hard_max_bounces: 10  # the hard cap of review rounds, which the soft cap may not pass
reviewer: [opus, fable, sonnet]  # model-specs of the review rounds, taken in turn and cycled when the rounds outnumber them
fixer: [opus, fable, sonnet]  # model-specs of the fix rounds, taken in turn and cycled when the rounds outnumber them
judge: ""  # model-spec of the Bouncer's judge; empty takes loom.yaml's judge
seed: ""  # model-spec of the campaign's seed round; empty takes loom.yaml's seed
reviewer_fan: ""  # name of the reviewer fan the review rounds run, a fan lenses.yaml defines; empty runs a solo round
fixer_fan: ""  # name of the fixer fan the fix rounds run, a fan lenses.yaml defines; empty runs a solo round
auto_accept: false  # whether the Bouncer accepts a round's findings with no judge, bar a red live gate
concurrency: 3  # how many copies of the live gate run side by side when the live tests drive no LLM session
live_attempts: 2  # how many times the live gate runs before a red result ends the fix row
verify_attempts: 3  # how many times the fix row's verify gate re-prompts its session before the run halts for the parent
tree_scope: {}  # maps a tree path to the target string the tree contributes, an empty target meaning the tree has no tests of its own; write it with lym config hardener --set tree_scope.<tree>=<target>, remove a tree only in lym config hardener's editor
