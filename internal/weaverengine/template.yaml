ladder:  # model-specs a batch attempt climbs in order, one rung per failed attempt; Claude-only by default, led by Haiku since a one-card batch keeps its session small
  - haiku[medium]
  - sonnet[medium]
  - opus[high]
attempt_timeout_min: 90  # minutes from spawn, or from an attach after a crash, at which a batch attempt times out, gate waits and fixers included
fixer_timeout_min: 60  # minutes after spawn at which the plan-level verify fixer strand classifies dead
verify_gate: webster  # gate key of the plan-level verify Weaver's Done rests on
batch_profile: identity  # profile under batcher.profiles that groups Weaver's cards into batches; identity, one card per batch, needs no estimator, since a Weaver session pays no inherited start and its cost grows with batch length
