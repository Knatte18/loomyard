open_window: true  # the Open-Window row opens a terminal window attached to the task worktree's reed session; `lyx batten run <slug> --window` turns it on for that run
seed_ide: true  # the Seed-IDE row writes the task worktree's VS Code title-bar colour and .vscode/ config, as `lyx ide spawn` does, without the user's key bindings
open_ide: false  # the Open-IDE row opens VS Code on the task worktree
tackler: ""  # overrides shed.yaml's tackler model-spec for a batten run (see contracts/specs/llm-model-spec.md); empty inherits shed.yaml
tackler_timeout_min: 0  # overrides shed.yaml's tackler_timeout_min for a batten run; 0 inherits shed.yaml
tackler_max_spawns: ~  # overrides shed.yaml's tackler_max_spawns for a batten run; null inherits shed.yaml, and a set 0 turns the tackler off for batten
