open_window: true  # the Open-Window row's entry gate: the row runs open_window_command when this is on
open_window_command: "{lym} reed window {task_dir} --title {slug}"  # the Open-Window row's command, opening a terminal window attached to the task worktree's reed session; placeholders {lym}, {slug} and {task_dir}; change it with `lym config batten --layer default --set open_window_command=<value>` from the prime
seed_ide: true  # the Seed-IDE row's entry gate: the row runs seed_ide_command when this is on
seed_ide_command: "{lym} ide seed {slug}"  # the Seed-IDE row's command, writing the task worktree's VS Code title, colours and .vscode/ config and the user's key bindings; placeholders {lym}, {slug} and {task_dir}; change it with `lym config batten --layer default --set seed_ide_command=<value>` from the prime
open_ide: false  # the Open-IDE row's entry gate: the row runs open_ide_command when this is on
open_ide_command: "{lym} ide open {slug}"  # the Open-IDE row's command, opening VS Code on the task worktree; placeholders {lym}, {slug} and {task_dir}; change it with `lym config batten --layer default --set open_ide_command=<value>` from the prime
tackler: ""  # overrides shed.yaml's tackler model-spec for a batten run (see contracts/specs/llm-model-spec.md); empty inherits shed.yaml
tackler_timeout_min: 0  # overrides shed.yaml's tackler_timeout_min for a batten run; 0 inherits shed.yaml
tackler_max_spawns: ~  # overrides shed.yaml's tackler_max_spawns for a batten run; null inherits shed.yaml, and a set 0 turns the tackler off for batten
arbiter: ""  # overrides shed.yaml's arbiter model-spec for a batten run (see contracts/specs/llm-model-spec.md); empty inherits shed.yaml
arbiter_timeout_min: 0  # overrides shed.yaml's arbiter_timeout_min for a batten run; 0 inherits shed.yaml
arbiter_max_spawns: ~  # overrides shed.yaml's arbiter_max_spawns for a batten run; null inherits shed.yaml, and a set 0 turns the arbiter off for batten
