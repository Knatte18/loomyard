open_window: true  # the Open-Window row's entry gate: the row runs batten.open_window_command when this is on
open_window_command: "{lym} reed window {task_dir} --title {title}"  # the Open-Window row's command, opening a terminal window attached to the task worktree's reed session; placeholders {lym}, {slug}, {task_dir} and {title}, the task's console title such as `T7 [ly:P3] <slug>`; change it with `lym config batten --layer default --set open_window_command=<value>` from the prime
seed_ide: true  # the Seed-IDE row's entry gate: the row runs batten.seed_ide_command when this is on
seed_ide_command: "{lym} ide seed {slug}"  # the Seed-IDE row's command, writing the task worktree's VS Code title, colours and .vscode/ config and the user's key bindings; placeholders {lym}, {slug}, {task_dir} and {title}; change it with `lym config batten --layer default --set seed_ide_command=<value>` from the prime
open_ide: false  # the Open-IDE row's entry gate: the row runs batten.open_ide_command when this is on
open_ide_command: "{lym} ide open {slug}"  # the Open-IDE row's command, opening VS Code on the task worktree; placeholders {lym}, {slug}, {task_dir} and {title}; change it with `lym config batten --layer default --set open_ide_command=<value>` from the prime
tackler: ""  # overrides shed.tackler, the tackler's model-spec, for a batten run (see contracts/specs/llm-model-spec.md); empty inherits shed.tackler
tackler_timeout_min: 0  # overrides shed.tackler_timeout_min for a batten run; 0 inherits shed.tackler_timeout_min
tackler_max_spawns: ~  # overrides shed.tackler_max_spawns for a batten run; null inherits shed.tackler_max_spawns, and a set 0 turns the tackler off for batten
arbiter: ""  # overrides shed.arbiter, the arbiter's model-spec, for a batten run (see contracts/specs/llm-model-spec.md); empty inherits shed.arbiter
arbiter_timeout_min: 0  # overrides shed.arbiter_timeout_min for a batten run; 0 inherits shed.arbiter_timeout_min
arbiter_max_spawns: ~  # overrides shed.arbiter_max_spawns for a batten run; null inherits shed.arbiter_max_spawns, and a set 0 turns the arbiter off for batten
