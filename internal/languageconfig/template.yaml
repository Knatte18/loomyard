skills: [] # skills every code-writing or code-reviewing role (the darn writer, the Webster master and recovery strand, the merge conflict session, the Burler seats of a code round) loads after its own, in load order; comment and testing skills such as scribe:golang-comments and scribe:golang-testing are the expected content; a build skill such as scribe:golang-build or scribe:csharp-build, whose raw commands bypass the hub's own build and test route, belongs only in a hub that has no such route
verify_tiers: [] # each entry is one rule of the hub's verify tiers (their order, which tiers are compiled rather than run and why, a nested-module form, the raw-run limits) that the plan writer, Plan-Review and implementer prompts render verbatim; the empty list is the neutral default
