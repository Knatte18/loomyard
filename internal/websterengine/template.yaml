master: sonnet[medium]  # model-spec for the long-lived Master session that reads the plan once and forks one implementer per batch in-session
recovery: opus[high]  # model-spec for the cold, fresh recovery strand recover-batch spawns when a fork reports stuck or writes no report
self_fix_cap: 2  # max self-fix attempts a forked implementer makes before reporting stuck
master_timeout_min: 480  # minutes the Master session's own shuttle spawn is allowed to run; this is the WHOLE-RUN timeout (spanning every batch of the plan and every in-session fork) — never a per-batch timeout; a single Master session drives the whole plan, ending its turn while each backgrounded fork runs
recovery_timeout_min: 60  # minutes since spawn after which the cold recovery strand with no report and no live strand classifies dead (dead_reason: timeout); it applies only to recover-batch, whose call blocks until a terminal digest or this timeout
batch_profile: wide  # profile under batcher.profiles that groups Webster's cards into the batches Merriam forks; a fork inherits Merriam's start, so few large batches pay off
verify_gate_attempts: 2  # attempts the plan-level verify gate on Merriam's strand gives Merriam to make the plan's verify pass before the gate stops the run; the last attempt, and one after a fixer that committed nothing, goes to the cold fixer at the webster.recovery model-spec, the others to a fixer fork
