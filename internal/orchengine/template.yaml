model: opus  # model alias for the orchestrator session, so every machine starts the orch on the same model; an explicit empty value uses the provider default
effort: medium  # effort level, in shuttle's engine vocabulary; an explicit empty value uses the provider default
cycle_mode: compact  # how the watcher cycles the session: compact keeps the session id and Remote Control link and writes no handoff file; clear runs the handoff, /clear and resume cycle
permission_mode: bypass  # permission mode of the orch session; bypass is the only accepted value, because the orch never prompts per action
soft_threshold_tokens: 150000  # context-token count at which the watcher may cycle at a natural break, below threshold_tokens; a value at or above threshold_tokens never fires; non-positive is floored back to 150000
soft_idle_s: 300  # seconds the newest turn end must be quiet before a soft cycle, and how long a DEFER reply holds the next soft attempt; non-positive is floored back to 300
threshold_tokens: 200000  # hard cap: context-token count at which the watcher cycles the session; an absolute count because the transcript does not state the model's window, and a value above the model's auto-compaction point lets Claude Code compact first; non-positive is floored back to 200000
idle_grace_s: 30  # seconds the session must stay idle after its newest event before the watcher acts; non-positive is floored back to 30
handoff_timeout_s: 600  # seconds the session gets to write its handoff before the cycle aborts; non-positive is floored back to 600
poll_interval_ms: 2000  # milliseconds between watcher polls; a value below 1000 is floored to 1000 with one warning (an unfloored 0 would busy-spin the watcher)
remote_control: false  # whether every orch session lym launches or resumes starts with Claude Code's remote control on; off unless the operator sets it; a Codex orch never does; the RC button of an agent's pane turns remote control on for that agent
remote_control_name: "{machine}::{name}"  # the remote session's name as the phone shows it, also used by the RC button; {machine} is this machine's name, {hub} the hub's shortname, {role} and {name} the role and full name of the strand the name is formed for, the orch's at launch and the clicked agent's for the RC button, so the default is the cross-machine address creel uses, such as neve::ly:orch
