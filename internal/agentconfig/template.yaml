efforts:  # the Claude Code reasoning effort of every Claude session lym launches whose model-spec names none, and of every subagent such a session spawns through the Agent tool; a key is default, a model alias (opus, sonnet, haiku, fable), a role of skills, or <role>/<model>, and the most specific key wins: <role>/<model>, then <role>, then <model>, then default; default is required; the operator's own map, replacing the template's whole when present; values are Claude Code's efforts (low, medium, high, xhigh, max), validated when the file loads
  default: medium
  fable: high
