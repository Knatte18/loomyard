writer: opus[medium]  # model-spec for the darn writer's session, which reads the board entry, edits, tests and commits (see contracts/specs/llm-model-spec.md)
writer_timeout_min: 180  # minutes the darn writer's shuttle run is allowed to run
verify: ""  # shell command the darn verify gate, Publish and Finalize run in the task worktree; it runs any shell command, which is why this module is hub-wide; empty stops the run with a way forward instead of skipping the verify
verify_attempts: 3  # how many times the verify gate re-prompts the writer's session with the failing findings before it halts the run for the parent
