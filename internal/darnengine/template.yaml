writer: opus[medium]  # model-spec for the darn writer's session, which reads the board entry, edits, tests and commits (see contracts/specs/llm-model-spec.md)
writer_timeout_min: 180  # minutes the darn writer's shuttle run is allowed to run
verify_attempts: 3  # how many times a verify gate, the writer's or a Code-Review fix round's, re-prompts its session with the failing findings before it halts the run for the parent
tree_scope: {}  # maps a tree path to the target string the tree contributes, an empty target meaning the tree has no tests of its own; a diff wholly under these trees runs each darn verify site's own gate key over the touched trees' targets, and a docs-only or empty diff with no target runs nothing; tree scope is on exactly when a tree is listed; write it with lyx config darn --set tree_scope.<tree>=<target>, remove a tree only in lyx config darn's editor; a tree path holding ".", such as .github, is written in the editor
driver_kind: ""  # overrides shed.yaml's driver_kind for a darn run, llm or go; empty inherits shed.yaml; a seeded run keeps its recorded driver
tackler: ""  # overrides shed.yaml's tackler model-spec for a darn run (see contracts/specs/llm-model-spec.md); empty inherits shed.yaml
tackler_timeout_min: 0  # overrides shed.yaml's tackler_timeout_min for a darn run; 0 inherits shed.yaml
tackler_max_spawns: ~  # overrides shed.yaml's tackler_max_spawns for a darn run; null inherits shed.yaml, and a set 0 turns the tackler off for darn
arbiter: ""  # overrides shed.yaml's arbiter model-spec for a darn run (see contracts/specs/llm-model-spec.md); empty inherits shed.yaml
arbiter_timeout_min: 0  # overrides shed.yaml's arbiter_timeout_min for a darn run; 0 inherits shed.yaml
arbiter_max_spawns: ~  # overrides shed.yaml's arbiter_max_spawns for a darn run; null inherits shed.yaml, and a set 0 turns the arbiter off for darn
pr_review: false  # true makes the PR-Review stub log that the PR review is not built; the stub opens no pull request and acts on nothing either way
