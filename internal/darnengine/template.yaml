writer: opus[medium]  # model-spec for the darn writer's session, which reads the board entry, edits, tests and commits (see contracts/specs/llm-model-spec.md)
writer_timeout_min: 180  # minutes the darn writer's shuttle run is allowed to run
verify: ""  # the hub's whole verify command, run in the task worktree; a darn gate runs it where the impacted set falls back, Merge-In and Finalize run it for a diff that is not tree-scoped, and it stays the gates' base command; it runs any shell command, which is why this module is hub-wide; empty stops the run with a way forward instead of skipping the verify
verify_attempts: 3  # how many times a verify gate, the writer's or a Darn-Review fix round's, re-prompts its session with the failing findings before it halts the run for the parent
tree_scope: {}  # maps a tree path to the target string the tree contributes to tree_scope_verify's {targets}, an empty target meaning the tree has no tests of its own; write it with lyx config darn --set tree_scope.<tree>=<target>, remove a tree only in lyx config darn's editor; a tree path holding ".", such as .github, is written in the editor
tree_scope_verify: ""  # command a tree-scoped diff runs at every darn verify site, holding {targets}; it must run with an empty {targets}, since a docs-only or empty diff expands it so; tree scope is on only when both keys are non-empty; lyx config darn --set tree_scope_verify= turns it off
review_max_bounces: 1  # bounce budget of the Darn-Review perch, the Bouncer and Burler pair that reviews the writer's committed diff before Publish; settable per run through run_settings; a spent budget runs the soft-cap rule; 0 runs neither the review nor Describe and goes from Darn-Write straight to Merge-In
driver_kind: ""  # overrides shed.yaml's driver_kind for a darn run, llm or go; empty inherits shed.yaml; a seeded run keeps its recorded driver
tackler: ""  # overrides shed.yaml's tackler model-spec for a darn run (see contracts/specs/llm-model-spec.md); empty inherits shed.yaml
tackler_timeout_min: 0  # overrides shed.yaml's tackler_timeout_min for a darn run; 0 inherits shed.yaml
tackler_max_spawns: ~  # overrides shed.yaml's tackler_max_spawns for a darn run; null inherits shed.yaml, and a set 0 turns the tackler off for darn
darn_reviewer_model: sonnet[high]  # model-spec for the Darn-Review reviewer (see contracts/specs/llm-model-spec.md); empty takes loom.yaml's reviewer_model, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
darn_fixer_model: ""  # model-spec for the Darn-Review fixer; empty takes loom.yaml's fixer_model, a set value (one model-spec, or a per-round list whose last entry serves every later round) replaces it for this segment
darn_reviewer_fan: ""  # fan name from burler.yaml, such as review-code, that turns the lens fan on for Darn-Review; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; an empty entry, the default, runs that round solo
darn_fixer_fan: ""  # fan name from burler.yaml, such as fix-code, that has the Darn-Review fixer fork itself once per lens of the fan to check its fixes; one fan name, or a YAML list with one fan name per round, the last entry serving every later round; an empty entry, the default, runs the single fixer for that round
review_hard_max_bounces: 4  # hard cap of the Darn-Review perch, settable per run through run_settings: a round numbered at or past it is accepted or escalated hard-cap, never continued; at least 1 and not below review_max_bounces
