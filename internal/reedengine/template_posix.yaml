tmux: ${env:LYX_REED_TMUX:-tmux}  # path to the tmux executable
shell: ${env:LYX_REED_SHELL:-bash}  # path to the shell command lyx launches inside each pane (bash on POSIX, pwsh on Windows by default)
width: 220  # tmux window width while no client has ever attached (new-session -x); once a client attaches tmux resizes the window to that client
height: 50  # tmux window height while no client has ever attached (new-session -y); once a client attaches tmux resizes the window to that client
debug_log: ${env:LYX_REED_DEBUG:-0}  # opt-in tmux server verbose logging (0 off, 1 -v, 2 -vv); takes effect only on the boot that spawns the shared per-hub server; an existing reed.yaml lacking it takes the default until "lyx config reconcile" writes it
mouse: ${env:LYX_REED_MOUSE:-on}  # tmux mouse-mode default (on/off; on is the default so the wheel scrolls the pane's scrollback and a click selects a pane — with mouse off tmux never claims the wheel, so the terminal's own alternate-screen translation delivers arrow keys straight into the live agent's input instead of scrolling anything; the cost of on is that native terminal text selection needs the terminal's shift-bypass (hold Shift while dragging), and tmux copy-mode is the in-band alternative; takes effect on a fresh reed server boot only — a live toggle needs a server restart, and an already-materialized reed.yaml keeps whatever value it holds, since reconcile is key-based and never rewrites a value)
watchdog: ${env:LYX_REED_WATCHDOG:-on}  # per-worktree name repair gate (on/off; enables the per-hub watchdog daemon's session-name repair for this worktree; an invalid value fails "lyx reed up" loudly; the detached per-hub watchdog daemon re-reads a worktree's value when that worktree's session re-enters the watched set, so a "lyx reed down" + "up" is what makes a flipped value take effect, and an already-materialized reed.yaml keeps whatever value it holds, since reconcile is key-based and never rewrites a value)
operator_quiet_s: 5  # seconds since an attached client's last activity on a strand's pane within which lyx types nothing into that pane; an already-materialized reed.yaml lacking this key takes this default until "lyx config reconcile" writes it
window_share_max: 2  # the largest group of strands, as their spawner declares it, that share one window; a larger group gives each strand a window of its own, and 0 gives every grouped strand its own; an integer of at least 0, and a negative value fails "lyx reed up", "lyx reed resume" and every add, naming the key; a group keeps the choice its first strand made, so an edit reaches only groups started after it; an already-materialized reed.yaml lacking this key takes this default until "lyx config reconcile" writes it
window_split: width  # how a shared window lays out its strands: width puts them side by side, height stacks them; any other value fails "lyx reed up", "lyx reed resume" and every add, naming the key, and a remove still removes and reports it; an already-materialized reed.yaml lacking this key takes this default until "lyx config reconcile" writes it
tmux_conf: ${env:LYX_REED_TMUX_CONF:-}  # a tmux config file reed sources into a hub server on the boot that starts that server, before reed's own option pins, so reed's values win; empty, the default, sources nothing and keeps the hermetic server; a leading ~/ expands to the home directory, and the value must be an absolute path to an existing regular file holding no whitespace and none of * ? [ \ ' " ; # { } $; a changed value takes effect at the hub server's next start; an already-materialized reed.yaml lacking this key takes the default until "lyx config reconcile" writes it; set LYX_REED_TMUX_CONF in the shell profile instead of committing a personal path
segment_colors:  # tmux color per loom segment; each value must be a palette color (blue, purple, cyan, green, orange, yellow, pink, red), a value outside it fails "lyx reed up" and is no color everywhere else
  coordinator: blue
  discussion: purple
  plan: cyan
  webster: green
  review: orange
  describe: yellow
  landing: pink
  darn: red
  merge: red
