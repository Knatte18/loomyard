# burler.yaml — the lens/fan library for burler cluster review. Materialized
# once (lyx init / lyx config reconcile) when this file is absent; after that,
# this file is OPERATOR-OWNED: reconcile is seed-only for burler.yaml and
# never rewrites or prunes it again, so any lens or fan you add, edit, or
# remove here survives every future reconcile untouched. Deleting a standard
# lens or fan you don't want is a supported, permanent choice — it will not
# come back on the next reconcile.
#
# Resolution falls back per name to this embedded template: a fan or lens
# name this file defines is used verbatim and wins, and a name it lacks
# resolves from the template. A fan or lens you deleted here therefore still
# resolves when a profile or loom.yaml names it.
#
# lenses: maps a lens name to emphasis-steering review prose for one fork of a
# cluster round. Add a repo-local lens by adding a block like this:
#
# my-lens: |
#   Pay extra attention to <your concrete focus area>. Report anything else
#   you notice too — emphasis, never exclusion.
#
# fans: maps a fan name to an ordered list of lens names — the fan's length is
# the fork count a cluster round spawns for it, and a lens name may repeat
# (each repeat runs as its own fork). Add a repo-local fan the same way:
#
# my-fan: [generic, my-lens, my-lens]
#
# The dormant lenses are phrased as EMPHASIS, never exclusion. The procedure
# lenses of the production fans (each review-* and fix-* fan) are each a
# procedure that ends in its own list instead, and a fixer lens may end with
# no list. The no-"ignore" rule holds
# for every lens: none tells a fork to ignore anything, because hard "ignore
# everything else" lenses measurably suppressed cross-category coverage in the
# spike behind this design (docs/research/session-fork-spike.md, Q2). A fork
# keeps full tool access and its inherited context regardless of which lens it
# carries.

lenses:
  generic: |
    Review broadly with no single area of emphasis: read for correctness,
    design fit, error handling, tests, and anything else that looks off.
    Trust your own judgment about what matters most in what you read — this
    lens deliberately narrows to nothing, so the widest possible read is the
    point.
  correctness: |
    Focus on logic bugs: wrong results, incorrect conditionals, off-by-one and
    boundary mistakes, mismatched assumptions between caller and callee, and
    edge cases (empty/nil/zero-value inputs, unusual ordering) the code
    doesn't actually handle the way it looks like it does. Report anything
    else you notice too — emphasis, never exclusion.
  error-handling: |
    Focus on how failures are handled: swallowed or discarded errors, wrong or
    missing error wrapping/context, return values ignored where they carry a
    failure signal, panics used where a returned error is more appropriate,
    and failure paths that leave state inconsistent. Report anything else you
    notice too — emphasis, never exclusion.
  test-gaps: |
    Focus on test coverage: behavior with no test at all, missing edge/negative
    cases in an otherwise-tested function, table-driven tests missing an
    obvious case their own table structure invites, and assertions weak enough
    to pass even if the code under test regressed. Report anything else you
    notice too — emphasis, never exclusion.
  security: |
    Focus on security-relevant issues: unchecked or unsanitized input, injection
    surfaces (command, path, query), unsafe deserialization, secrets or
    credentials in code/logs/errors, path traversal, and any operation that
    trusts data it should verify. Report anything else you notice too —
    emphasis, never exclusion.
  performance: |
    Focus on performance: unnecessary allocations or copies in hot paths,
    quadratic or worse patterns over data that can grow, blocking calls where a
    non-blocking one is available, unbounded loops/memory/goroutines, and
    inefficient use of the standard library where a direct alternative exists.
    Report anything else you notice too — emphasis, never exclusion.
  api-design: |
    Focus on the public surface: naming and signature consistency with the rest
    of the package, whether exported symbols are documented, backward
    compatibility of any changed signature, and whether parameter/return
    shapes make the common call easy and the misuse hard. Report anything else
    you notice too — emphasis, never exclusion.
  concurrency: |
    Focus on concurrency: shared state touched without synchronization, races
    between goroutines, goroutine or resource leaks on early return, deadlock
    potential from lock ordering or blocking channel operations, and context
    cancellation that is accepted but not actually honored. Report anything
    else you notice too — emphasis, never exclusion.
  docs-consistency: |
    Focus on documentation drift: comments or docs that no longer match the
    code they describe, module docs or PATTERN entries a behavior
    change should have updated but didn't, stale references to removed or
    renamed symbols, and examples that would no longer compile or run as
    written. Report anything else you notice too — emphasis, never exclusion.
  goal-scope: |
    Focus on the record against its board entry: whether the stated goal is
    met, scope boundaries are explicit, nothing the entry asks for is missing,
    nothing unlicensed was added, no deferral or MVP phase hides in the text,
    and whether this is the right thing to build at all. Report anything else
    you notice too — emphasis, never exclusion.
  pattern-fit: |
    Focus on fit with the repo's rules: check every decision or card against
    the PATTERN.md entries and the pattern/ background files it touches, and
    flag a departure that does not name the entry it changes. Report anything
    else you notice too — emphasis, never exclusion.
  scenarios: |
    Focus on scenarios: failure, restart and resume, concurrency, empty state
    and invalid input. Apply the Discussion-Review rubric's "The attack-surface
    question" and the discussion stencil's "Must-cover test scenarios go under
    `## Acceptance criteria`" rule. Report anything else you notice too —
    emphasis, never exclusion.
  leanness: |
    Focus on content to move or cut: apply the Discussion-Review rubric's
    "Relocation and exclusion findings are legitimate, on equal footing with
    gap-filling findings" and "The completeness-before-leanness test". Seek
    what does not belong in the decision record rather than what is missing
    from it. Report anything else you notice too — emphasis, never exclusion.
  premises: |
    Focus on the record's premises: every claim it makes about existing code,
    config or behaviour matches what the code does, including one hop past
    what the record cites, such as the caller, the config key or the spawned
    process a cited piece leans on. Report anything else you notice too —
    emphasis, never exclusion.
  board-fit: |
    Focus on the record against every other board entry: planned work it
    duplicates or contradicts, and a dependency it leaves unnamed. Report
    anything else you notice too — emphasis, never exclusion.
  decision-coverage: |
    Focus on the plan against the decision record: apply the Plan-Review
    rubric's "Fidelity to the answer key". Report anything else you notice
    too — emphasis, never exclusion.
  card-structure: |
    Focus on how the cards are cut and typed: apply the Plan-Review rubric's
    "Granularity", "Card order", "Member glyphs on an `Edit` card", "The
    re-sign arrow", "`ImpactSummary` carries a real conclusion" and "`Custom`
    is a last resort". Report anything else you notice too — emphasis, never
    exclusion.
  verify-tests: |
    Focus on verification: apply the Plan-Review rubric's "Verify coverage"
    and "Test economy". Report anything else you notice too — emphasis, never
    exclusion.
  criteria-coverage: |
    Focus on the plan against the decision record: list every decision and
    every acceptance criterion, and for each find the card whose Intent
    carries it and the planned test row that would fail if it were broken. A
    criterion the plan argues holds without a test, waives or defers is a
    finding, and so is a decision, failure exit or branch the record names
    that no row reaches. Apply the Plan-Review rubric's "Fidelity to the
    answer key". Check that each path, comparison or default a card states
    uses the operand the record names, not a near one, such as the current
    directory's parent where the record names the worktree's parent. Report
    anything else you notice too — emphasis, never exclusion.
  branch-coverage: |
    Focus on branch coverage: list every branch and exit the cards' Intents
    introduce or change, whether or not the decision record names it (error
    returns, early returns, refusals, a loop's or scan's end without a match,
    a default case), and for each find the planned test row that reaches it.
    A branch no planned row reaches is a finding. Report anything else you
    notice too — emphasis, never exclusion.
  row-reachability: |
    Focus on whether each planned test row can do what the card says: open
    every test function a card extends or names, and the fakes, fixtures and
    helpers it runs on, and check that the row's input reaches the branch it
    claims (the fake can produce that state at that point of the sequence),
    that its assertion would fail if the code were wrong, and that each new
    fake field or helper the row needs is listed on the card. Apply the
    Plan-Review rubric's "Reachability of a prescribed refusal" and "Verify
    coverage". Report anything else you notice too — emphasis, never
    exclusion.
  forced-edits: |
    Focus on what each change forces outside the members a card names: for
    every member a card changes, find its callers, the tests that assert its
    output or wording, and the comments, doc files and stated reasons (such as
    a `//testtiming:keep` reason) that describe it, and report each one the
    change makes wrong that no card lists. Check that each `Create` handle's
    package is the package clause of the file the Intent puts it in, an
    external `_test` package included, and that each listed glyph is the one
    `lyx quarry` gives. Apply the Plan-Review rubric's "Member glyphs on an
    `Edit` card" and "The re-sign arrow". A new type, function or executor
    that must be registered in a table or list, such as a guard table, is a
    forced edit, and a registration no card lists is a finding. Report
    anything else you notice too — emphasis, never exclusion.
  test-economy: |
    Focus on test economy: for every new top-level test and every new row,
    open the test file it lands in and the existing tests of the same
    function, and report a new top-level test that should be a row of an
    existing test and a row that repeats a behavior an existing test already
    reaches. Apply the Plan-Review rubric's "Test economy". Report anything
    else you notice too — emphasis, never exclusion.
  interactions: |
    Own the interactions between the record's own decisions. List every pair
    of decisions that act on the same state, file, key, command, ordering or
    invariant, including a pair where one adds a mechanism and the other adds
    another mechanism over the same state. For each pair, run the first
    decision's paths, its failure and restart paths included, with the second
    in force, and say whether both still hold; then check each acceptance
    criterion and constraint against every decision it touches. A pair where
    one decision silently undoes, outruns or contradicts the other is a
    finding. Your list: the pairs you checked, one line each, held or broken.
  existing-paths: |
    Own what the record's changes meet in the code that already runs. For each
    state, setting, file or invariant a decision introduces or changes, find
    every existing code path that also writes, resets, reapplies or reads it,
    such as other verbs, hooks, resize or apply steps, restart and resume
    paths and background processes, starting from the definitions your
    context holds. For each path, say whether the decision's result survives
    it, and for a path that reads the state, whether it still reads the state
    right under the new behaviour. A path that undoes or misreads a decision
    while the record is silent about it is a design finding about that
    decision, never a missing call-site list. Your list: the paths you traced,
    per decision, survives or breaks.
  bound-breaker: |
    Own the record's claims and bounds. For every bound, guard, guarantee,
    ordering promise and claim about existing code the record states, try to
    build a concrete input, interleaving or path that breaks it: a concurrent
    caller, a process the code spawns, another entry point that reaches the
    same verb, a state that already exists or was left by an older version,
    a file in an unexpected shape. Go one hop past what the record cites. A
    claim you break is a finding with its counterexample. Your list: each
    claim you attacked, held or broken.
  walkthrough: |
    Own the decisions' mechanisms run end to end. For each decision, take one
    concrete case and execute its mechanism step by step, with the data each
    step is handed by the step before it, not the data the record says it
    should be handed. Check the end state against the decision's own stated
    purpose. A step whose input differs from what the previous step produces,
    and an end state that misses the purpose, are findings. Your list: each
    decision, the case you used, purpose met or not.
  affected-set: |
    Own what each card's change forces outside the card. For each output, key,
    string, file shape or behaviour a card changes, find everything that reads
    or asserts it, tests, callers, docs and fixtures, from the pre-read and a
    search for what the pre-read lacks. For each change, find the cards that
    cover the set. A card that covers part of a set is one finding about the
    method, naming the members it missed. Your list: per change, the set you
    found and the cards that cover it.
  guard-reach: |
    Own whether each guard can be reached. For each guard, refusal, branch or
    test row a card adds, trace the sequence of states a real entry point
    passes through to reach it. Say whether the state it guards can occur at
    that point, and whether the guarded site recurs elsewhere on a path the
    card does not guard. A guard whose state cannot occur, and a guarded site
    that recurs unguarded, are findings. Your list: per guard, reachable or
    not.
  way-forward: |
    Own the failure and recovery ends. For each refusal, stop, reset or
    recovery step a card adds, find the next step it names and check whether
    that step can succeed from the state the refusal leaves. A refusal that
    names no next step, and a next step that cannot succeed from that state,
    are findings. Your list: per refusal, the next step, progresses or not.
  code-correctness: |
    Own the correctness of the code the diff changes. For each function,
    branch and error path the diff adds or changes, take one concrete input,
    including an empty, nil, zero or boundary value and a failure of each call
    it makes, and run the code step by step with the data each step is handed.
    A wrong result, a swallowed or misreported error and a state left
    inconsistent on a failure path are findings, as the rubric's "Finding
    class" defines `design`. Your list: each function or branch, the case you
    ran, correct or not.
  code-affected-set: |
    Own what the diff's changes force outside the lines it touches. For each
    signature, output, key, message, file shape or behaviour the diff changes,
    find everything that calls, reads or asserts it, callers, tests, docs,
    stencils and fixtures, from the definitions your context holds and a
    search for what it lacks. A member of the set the diff leaves wrong is a
    finding. Apply the rubric's "Stencil wording" and "The repository's own
    rules" where this round's rubric carries them. Your list: per change, the
    set you found, covered or not.
  code-tests: |
    Own the tests of the diff. For each behaviour the diff adds or changes,
    find the test row that would fail if it were broken, and for each new test
    or row, open the existing tests of the same function. Apply the rubric's
    "Test economy". Your list: per behaviour, the test that pins it, or none.
  code-pattern-fit: |
    Own the diff's fit with the repository's rules. Read the repository's
    constraints document and the pattern files the diff touches, and check
    every changed file against each rule that applies to it. Apply whichever
    of the rubric's "The repository's own rules", "Declared PATTERN changes
    landed", "Commit messages and departures", "A broken invariant" and "A
    pattern the parent changed" this round's rubric carries. Your list: each
    rule you checked, held or broken.
  fix-code-correctness: |
    Own the correctness of the code the fix changed. For each function or
    branch the fix added or changed, take one concrete input, including a
    failure of each call it makes, and run it step by step. Check that every
    caller of a changed signature or behaviour still holds, and that each test
    the fix added fails with the defect in place. A wrong result, a caller left
    broken and a test that passes with the defect in place are findings.
  fix-consistency: |
    Own the agreement of the change set with its surroundings. Check that every
    sibling decision, card, criterion, row or cross-reference the changed text
    touches or depends on still agrees with it, and look for a change made in
    one place whose twin elsewhere was left as it was.
  fix-claims: |
    Own the claims the fix made. Check that every sentence the fix added or
    rewrote that asserts a bound, a guarantee, a behaviour, a count or a fact
    about the code holds against the code at this worktree's HEAD, including a
    claim taken over from the reviewer's proposed fix.
  fix-proposal: |
    Own the reviewer's proposals the fix carried out. For each finding the
    fixer fixed as proposed, challenge the proposal itself rather than check
    that it was carried out: build the concrete case where the proposed change
    is wrong, or name what it breaks elsewhere in the artifact. A case you
    build, or a breakage you name, is a finding with its evidence.
  fix-way-forward: |
    Own the ways forward the fix introduced. Check that every refusal, error,
    next step, row or test the fix introduced can be carried out or reached
    from the state it names, and leads somewhere that makes progress.
  fix-affected-set: |
    Own the sets the fix had to cover. For each finding whose premise is a set,
    tests, callers or sites under one key, rerun the finding's own search with
    one tool call per finding, and check the fix covers every member, not only
    those the review named. When these findings exceed your tool-call cap,
    rerun the searches for the most severe findings first. Your list: each
    finding you left unchecked.

fans:
  standard:
    - generic
    - generic
    - correctness
    - error-handling
    - test-gaps
  full:
    - correctness
    - error-handling
    - test-gaps
    - security
    - performance
    - api-design
    - concurrency
    - docs-consistency
  discussion:
    - generic
    - goal-scope
    - pattern-fit
    - scenarios
    - leanness
  plan:
    - generic
    - decision-coverage
    - card-structure
    - verify-tests
    - pattern-fit
  twill-discussion:
    - premises
    - goal-scope
    - board-fit
    - pattern-fit
    - scenarios
    - leanness
  twill-plan:
    - criteria-coverage
    - branch-coverage
    - row-reachability
    - forced-edits
    - test-economy
  review-discussion:
    - interactions
    - existing-paths
    - bound-breaker
    - walkthrough
  review-plan:
    - affected-set
    - guard-reach
    - way-forward
  fix-discussion:
    - fix-consistency
    - fix-claims
    - fix-proposal
    - fix-way-forward
  fix-plan:
    - fix-consistency
    - fix-claims
    - fix-proposal
    - fix-affected-set
  review-code:
    - code-correctness
    - code-affected-set
    - code-tests
    - code-pattern-fit
  fix-code:
    - fix-code-correctness
    - fix-consistency
    - fix-proposal
    - fix-affected-set
